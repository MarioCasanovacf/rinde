/* ---------- 1. Tokens: modo claro (default) ---------- */
:root {
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --delta-good: #006300;
  --delta-bad: #d03b3b;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --heat-1: #6da7ec;
  --heat-2: #3987e5;
  --heat-3: #2a78d6;

}

    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --delta-good: #0ca30c;
    --delta-bad: #d03b3b;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --heat-1: #9ec5f4;
    --heat-2: #6da7ec;
    --heat-3: #3987e5;
    --heat-4: #2a78d6;

:root[data-theme="light"] {

/* ---------- 4. Reset y base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { color-scheme: light dark; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

img, svg { max-width: 100%; height: auto; display: block; }

button, input, select { font-family: inherit; }

/* ---------- 5. Layout de chrome (header, tabs, filtros, main) ---------- */
.hz-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px clamp(12px, 4vw, 32px);
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
}
.hz-header-brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hz-header-nombre { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.01em; color: var(--text-primary); }
.hz-header-meta { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-secondary); font-size: 0.85rem; }
.hz-toggle-tema {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}
.hz-toggle-tema:hover { background: var(--page); }
.hz-toggle-tema:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.hz-tablist {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 clamp(12px, 4vw, 32px);
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
}
.hz-tab {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 600;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.hz-tab:hover { color: var(--text-primary); }
.hz-tab:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
.hz-tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); }

.hz-main { padding: 20px clamp(12px, 4vw, 32px) 48px; max-width: 100%; }

.hz-vista { display: flex; flex-direction: column; gap: 20px; }
.hz-vista[hidden] { display: none; }

.hz-filtros {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 12px 0 20px;
}
.hz-filtros[hidden] { display: none; }
.hz-filtros-label { color: var(--text-secondary); font-size: 0.85rem; }
.hz-filtro-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
}
.hz-filtro-btn:hover { color: var(--text-primary); }
.hz-filtro-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.hz-filtro-btn[aria-pressed="true"] {
  background: var(--series-1);
  border-color: var(--series-1);
  color: var(--surface-1);
  font-weight: 600;
}

.hz-footer { padding: 20px clamp(12px, 4vw, 32px) 32px; border-top: 1px solid var(--border); }

/* ---------- 6. Componentes congelados (plan.md 3.G) ---------- */
.hz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
  gap: 16px;
}

.hz-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow-card);
  min-width: 0;
}
.hz-card-title { margin: 0 0 12px; font-size: 1rem; font-weight: 600; color: var(--text-primary); }

.hz-hero { display: flex; flex-direction: column; gap: 4px; }
.hz-hero-num { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; line-height: 1; color: var(--text-primary); }
.hz-hero-label { font-size: 0.85rem; color: var(--text-secondary); }

.hz-stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-1);
}
.hz-stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.hz-stat-num { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
.hz-stat-delta { font-size: 0.85rem; font-weight: 600; }
.hz-delta-good { color: var(--delta-good); }
.hz-delta-bad { color: var(--delta-bad); }

.hz-spark { display: block; width: 100%; height: auto; }

.hz-chart { position: relative; width: 100%; }
.hz-chart-title { margin: 0 0 8px; font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }

.hz-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.hz-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
.hz-legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.hz-table-toggle {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.82rem;
  cursor: pointer;
  margin-top: 8px;
}
.hz-table-toggle:hover { color: var(--text-primary); }
.hz-table-toggle:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.hz-table-toggle[aria-expanded="true"] { color: var(--text-primary); font-weight: 600; }

.hz-table-wrap { overflow-x: auto; margin-top: 8px; }
.hz-table { border-collapse: collapse; width: 100%; min-width: max-content; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.hz-table th, .hz-table td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; color: var(--text-primary); white-space: nowrap; }
.hz-table th { color: var(--text-secondary); font-weight: 600; }

.hz-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.8rem;
  color: var(--text-primary);
  z-index: 20;
  opacity: 0;
  transition: opacity 0.1s ease;
}
.hz-tooltip[data-visible="true"] { opacity: 1; }

.hz-crosshair {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--axis);
  pointer-events: none;
  opacity: 0;
}
.hz-crosshair[data-visible="true"] { opacity: 1; }

.hz-status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.hz-status-dot[data-status="good"] { background: var(--status-good); }
.hz-status-dot[data-status="warning"] { background: var(--status-warning); }
.hz-status-dot[data-status="serious"] { background: var(--status-serious); }
.hz-status-dot[data-status="critical"] { background: var(--status-critical); }
.hz-status-label { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }

.hz-nota { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; max-width: 70ch; }

/* Adendum R8 punto 2: .hz-vacio, basada en .hz-nota, para estados vacíos de
   cards en modo real sin datos (T-040/T-041 la consumen; contenido vía
   textContent). Centrada, con padding vertical generoso frente a .hz-nota. */
.hz-vacio { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; max-width: 70ch; text-align: center; padding: 40px 16px; }

.hz-form { display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
.hz-form-campo { display: flex; flex-direction: column; gap: 6px; }
.hz-form-campo label { font-size: 0.85rem; color: var(--text-secondary); }
.hz-form-campo select,
.hz-form-campo input {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--surface-1);
  color: var(--text-primary);
}
.hz-form-campo select:focus-visible,
.hz-form-campo input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

.hz-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-secondary);
  background: var(--page);
  border: 1px solid var(--border);
}
.hz-badge[hidden] { display: none; }

/* Ticks de eje de gráfica: única otra regla, además de .hz-table, con tabular-nums */
.hz-axis-tick { font-variant-numeric: tabular-nums; fill: var(--axis); font-size: 0.72rem; }

/* ---------- 7. Adendum R4 (T-017): menú del día en Plan de dieta ----------
   Clases nuevas SOLO con prefijo hz-menu- (plan.md Adendum R4, punto 2).
   El "Detalle del día" deja de ser tabla y pasa a fila de ancho completo:
   una card por comida, nombre del platillo COMPLETO (envuelve, no hereda
   el white-space:nowrap de .hz-table) y una mini barra apilada de macros
   por comida con gap de 2px color superficie (regla 5 del contrato).
   Corrección R4 (intento 2, rechazo del verifier por hueco muerto): la card
   del menú ya NO vive dentro de .hz-grid (evita que auto-fit deje columnas
   sin colapsar en otras filas del grid superior); vive como hermana de
   .hz-grid dentro de .hz-vista (flex column, gap:20px, congelado 3.G) y
   solo necesita declarar su propio ancho completo. */
.hz-menu-fila { width: 100%; }

.hz-menu-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

.hz-menu-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--page);
}

.hz-menu-hora { flex: 0 0 auto; min-width: 52px; color: var(--text-secondary); font-size: 0.82rem; }

.hz-menu-nombre {
  flex: 1 1 240px;
  min-width: 160px;
  color: var(--text-primary);
  font-size: 0.92rem;
  white-space: normal;
  overflow-wrap: break-word;
}
.hz-menu-momento { color: var(--text-secondary); font-weight: 600; }
.hz-menu-platillo { color: var(--text-primary); }

.hz-menu-kcal { flex: 0 0 auto; min-width: 76px; text-align: right; font-weight: 600; color: var(--text-primary); font-size: 0.92rem; }

.hz-menu-macros {
  flex: 0 0 140px;
  display: flex;
  gap: 2px;
  height: 10px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface-1);
}
.hz-menu-macro-seg { height: 100%; }

.hz-menu-total {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  margin-top: 6px;
  border-top: 2px solid var(--border);
}
.hz-menu-total-label { font-weight: 700; color: var(--text-primary); }
.hz-menu-total-macros { font-weight: 400; color: var(--text-secondary); font-size: 0.85rem; }
.hz-menu-total-kcal { font-weight: 700; color: var(--text-primary); }

/* ---------- 8. Adendum R5 (T-021): recomendador (hz-reco-*) ----------
   Clases nuevas SOLO con prefijo hz-reco- (plan.md Adendum R5 punto 5).
   #reco-plan vive dentro de #vista-plan, hermano de .hz-grid (mismo
   patrón ya usado por .hz-menu-fila en el Adendum R4): flex column con
   gap:20px heredado de .hz-vista, declara su propio ancho completo. El
   contenido (formulario precargado, resumen TMB/GET/kcal objetivo/
   macros, ranking de plantillas con razones y controles de ajuste) lo
   genera T-022 en build/vista_dieta_supl.js contra estas clases, ya
   que T-022 NO posee build/shell.html (regla F1): este es el set
   congelado de estilos disponible para esa vista. */
.hz-reco-panel { width: 100%; }

.hz-reco-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
  gap: 12px;
  margin-top: 4px;
}

.hz-reco-resumen {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
  gap: 12px;
  margin-top: 12px;
}

.hz-reco-lista {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.hz-reco-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-left: 4px solid transparent;
  border-radius: 10px;
  background: var(--page);
}
.hz-reco-item[data-mejor="true"] {
  border-left-color: var(--series-1);
  background: var(--surface-1);
}

.hz-reco-rank {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface-1);
  border: 1px solid var(--border);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text-primary);
}

.hz-reco-nombre { flex: 1 1 200px; min-width: 140px; font-weight: 600; color: var(--text-primary); font-size: 0.95rem; }

.hz-reco-score { flex: 0 0 auto; min-width: 64px; text-align: right; font-weight: 700; color: var(--text-primary); font-size: 0.92rem; }

.hz-reco-score-barra {
  flex: 0 0 120px;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface-1);
  border: 1px solid var(--border);
}
.hz-reco-score-fill { height: 100%; background: var(--series-1); }

.hz-reco-razones {
  flex: 1 1 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.hz-reco-acciones {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.hz-reco-slider { flex: 1 1 200px; min-width: 160px; accent-color: var(--series-1); }

/* ---------- 9. Adendum R5 (T-021): herramientas de documentos y
   documento imprimible (hz-doc-*) ----------
   Clases nuevas SOLO con prefijo hz-doc- (plan.md Adendum R5 punto 5).
   #doc-herramientas vive dentro de #vista-seguimiento, primer hijo
   estático (T-005 hace rootEl.appendChild de sus propias cards DESPUÉS,
   nunca las reemplaza) -- por eso la fila queda arriba de las cards,
   igual que #filtro-rango queda arriba de lo que filtra. Los botones
   son estáticos con id fijo; T-023 (build/documentos.js) les cablea el
   evento -- T-023 NO posee build/shell.html, así que la estructura y el
   estilo de esta fila quedan congelados aquí. */
.hz-doc-herramientas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.hz-doc-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
}
.hz-doc-btn:hover { color: var(--text-primary); }
.hz-doc-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.hz-doc-import { display: inline-flex; align-items: center; }
.hz-doc-import input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.hz-doc-import:focus-within .hz-doc-import-label {
  outline: 2px solid var(--series-1);
  outline-offset: 2px;
}

.hz-doc-import-label {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.hz-doc-import-label:hover { color: var(--text-primary); }

/* #documento-plan: oculto en pantalla (display:none aquí abajo), visible
   SOLO dentro de @media print (sección 10). Genera su contenido T-023
   con Herzon.planActivo() (fallback al plan por defecto). */
.hz-doc-documento { display: none; }
.hz-doc-titulo { margin: 0 0 4px; font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
.hz-doc-meta { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 20px; color: var(--text-secondary); font-size: 0.85rem; }
.hz-doc-seccion { margin: 0 0 24px; }
.hz-doc-seccion-titulo { margin: 0 0 8px; font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
.hz-doc-pie { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--grid); font-size: 0.75rem; color: var(--text-secondary); }

/* ---------- 10. Adendum R5 (T-021): bloque @media print ----------
   Regla del criterio de aceptación: SOLO #documento-plan es visible al
   imprimir -- el resto de la app (header, tablist, main, footer y los
   dos bloques de script, hz-runtime y hz-boot) se oculta con un solo
   selector robusto a futuras adiciones (body > *:not(#documento-plan)).
   El documento SIEMPRE se ve en modo claro al imprimir, sin importar el
   tema activo en pantalla:
   se fuerzan los tokens de color a sus valores claros con !important
   DENTRO de este bloque únicamente. Los 4 bloques de tokens originales
   (:root base, @media dark, [data-theme="dark"], [data-theme="light"])
   quedan intactos -- esto no los modifica, solo los sobre-escribe en
   tiempo de impresión (Adendum R5 punto 5: "sin tokens de tema oscuro,
   documento siempre claro para impresión").
   Adendum R10 (R-01.6): el selector maestro gana un segundo :not() para
   #documento-rutina (compuerta de impresión por documento, ver las reglas
   justo después de él, más abajo); con el atributo data-imprimir ausente
   el resultado impreso del plan queda idéntico al de antes de R10. */
@media print {
  :root {
    --page: #f9f9f7 !important;
    --surface-1: #fcfcfb !important;
    --text-primary: #0b0b0b !important;
    --text-secondary: #52514e !important;
    --text-muted: #898781 !important;
    --grid: #e1e0d9 !important;
    --axis: #c3c2b7 !important;
    --border: rgba(11, 11, 11, 0.10) !important;
    --delta-good: #006300 !important;
    --delta-bad: #d03b3b !important;
    --series-1: #2a78d6 !important;
    --series-2: #eb6834 !important;
    --series-3: #1baf7a !important;
    --series-4: #eda100 !important;
    --series-5: #e87ba4 !important;
    --shadow-card: none !important;
  }

  body > *:not(#documento-plan):not(#documento-rutina) { display: none !important; }

  /* Adendum R10 (R-01.6): compuerta de impresión por documento. Con el
     atributo data-imprimir ausente, el resultado impreso del plan es
     idéntico al de antes: #documento-rutina queda oculto por la regla de
     ID de abajo (gana por especificidad sobre .hz-doc-documento{display:
     block} aunque aparezca antes en la cascada) y #documento-plan sigue
     siendo el único documento visible. */
  body[data-imprimir="rutina"] #documento-plan { display: none !important; }
  #documento-rutina { display: none; }
  body[data-imprimir="rutina"] #documento-rutina { display: block; }

  .hz-doc-documento {
    display: block;
    max-width: none;
    margin: 0;
    padding: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11pt;
    line-height: 1.5;
  }

  /* resp-4 (Adendum R6): un párrafo de sección no debe quedar solo al pie
     de una página con el resto de la sección en la siguiente; una tabla no
     debe partirse a la mitad entre páginas, y su overflow-x:auto (pensado
     para pantalla) no aplica al imprimir -- el papel no scrollea. */
  .hz-doc-seccion > p { break-after: avoid-page; }
  .hz-doc-seccion .hz-table-wrap { break-inside: avoid-page; overflow-x: visible; }
}

/* ---------- 11. Adendum R6 (T-026): refinamiento Justesse (modo preserve) ----------
   Extensiones ADITIVAS autorizadas explícitamente por el Adendum R6 del plan
   (jerarquía, producto, finishing, responsive/dark). Los 4 bloques de
   tokens (secciones 1-3 arriba) NO se tocan: esto solo agrega selectores
   nuevos o ajusta valores puntuales ya autorizados explícitamente. */

/* jera-3/fini-3: el slider del recomendador (.hz-reco-slider) vive dentro
   de un .hz-form-campo (flex-direction: column) en layout vertical; sin
   este ajuste hereda flex:1 1 200px y se estira ~200px de alto en vez de
   ocupar el ancho del campo, rompiendo el ritmo etiqueta/control/valor. */
.hz-form-campo .hz-reco-slider { flex: 0 0 auto; width: 100%; min-width: 0; }

/* jera-4: la prosa secundaria (nota del prototipo, pie del documento
   imprimible) sube de --text-muted a --text-secondary (contraste 4.5:1);
   --text-muted queda reservado para ejes y labels de gráfica. Reasignación
   aplicada IN-PLACE en las reglas base .hz-nota (sección 6) y .hz-doc-pie
   (sección 9) -- no se duplica aquí para evitar dos declaraciones de
   `color` para la misma clase en cascada. */

/* prod-7/fini-7: gramática de botones -- las acciones one-shot pasan a
   radius 8px (reasignación IN-PLACE en las reglas base .hz-doc-btn y
   .hz-doc-import-label de la sección 9, no duplicada aquí); la píldora
   999px queda reservada a .hz-badge (chip) y .hz-filtro-btn (filtro).
   Disabled + hover/focus-visible garantizados en toda acción (incluye
   .hz-table-toggle, ya congelada en radius 8px, que el recomendador
   reutiliza para sus propios botones). */
.hz-doc-btn:disabled,
.hz-doc-btn[aria-disabled="true"],
.hz-doc-import-label[aria-disabled="true"],
.hz-table-toggle:disabled {
  opacity: 0.5;
  cursor: default;
}
.hz-doc-import-label:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

/* fini-5/resp-2: color-scheme sigue al toggle para que el chrome nativo
   (track del slider, controles del navegador) cambie de tema con la app;
   el default sin toggle conserva "light dark" (sección 4 arriba, intacta). */
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

/* fini-8: las tabs no se desplazan al activarse -- peso 600 constante en
   todo estado (declarado en .hz-tab, sección 5 arriba); el acento visual
   de "activa" vive solo en color + subrayado (border-bottom-color), nunca
   en un salto de font-weight que cambie el ancho del texto. */

/* resp-3: targets táctiles >=44px en pantallas táctiles o angostas. */
@media (pointer: coarse), (max-width: 640px) {
  .hz-filtro-btn,
  .hz-doc-btn,
  .hz-doc-import-label,
  .hz-table-toggle {
    min-height: 44px;
    padding: 10px 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
}

/* Adendum R6 punto 1: atributo data-ancho="completo" en hijos directos de
   .hz-grid; las vistas lo aplican vía setAttribute (primer consumidor: la
   card del régimen de suplementos, consumido en T-028/T-029). */
.hz-grid > [data-ancho="completo"] { grid-column: 1 / -1; }

/* Adendum R9 punto 1 (T-044): CSS aditivo. Regla data-ancho="doble" (junto
   a "completo" de arriba, misma mecánica setAttribute) — consumida por
   LY-01/LY-05/DV-05 en sus vistas, se implementa UNA sola vez aquí. Clase
   .hz-grid-pares — consumida por LY-04 (Seguimiento). Selector de cliente
   del header — consumido por MC-03; poblado y cableado en build/almacen.js
   (T-045). Cero hexes nuevos: solo tokens ya congelados. */
@media (min-width: 600px) {
  .hz-grid > [data-ancho="doble"] { grid-column: span 2; }
}

.hz-grid-pares {
  grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr));
}

.hz-selector-cliente {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  background: var(--surface-1);
  color: var(--text-primary);
  font-size: 0.85rem;
  cursor: pointer;
}
.hz-selector-cliente:focus-visible {
  outline: 2px solid var(--series-1);
  outline-offset: 2px;
}

/* ---------- 12. Adendum R10 (F-01/F-02): sistema de formularios ----------
   Sistema único de formularios (F-01) y jerarquía de botones (F-02) que
   consumen alta/editar perfil/captura (vista_metricas.js), el editor de
   rutina (vista_rutina.js) y las cards de seguridad (vista_metricas.js).
   Nadie fuera de esta sección define clases hz-form-* ni hz-btn-* (C-1/C-2). */

/* F-01.1 */
.hz-form-card { width: 100%; max-width: 720px; margin-inline: auto; }

/* F-01.2 -- la regla .hz-form base (sección 6) NO se toca; todo es aditivo
   por composición (class="hz-form hz-form-columnas"). */
.hz-form.hz-form-columnas { display: grid; grid-template-columns: 1fr; gap: 14px 20px; max-width: none; }
@media (min-width: 600px) {
  .hz-form.hz-form-columnas { grid-template-columns: 1fr 1fr; }
}

/* F-01.3 */
.hz-form-ancho { grid-column: 1 / -1; }

/* F-01.4 */
.hz-form-sub { display: grid; grid-template-columns: 1fr; gap: 14px 20px; margin-top: 12px; }
@media (min-width: 600px) {
  .hz-form-sub { grid-template-columns: 1fr 1fr; }
}

/* F-01.5 */
.hz-form summary { cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
.hz-form summary:hover { color: var(--text-primary); }
.hz-form summary:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

/* F-01.6 */
.hz-form-campo input[aria-invalid="true"], .hz-form-campo select[aria-invalid="true"] { border-color: var(--delta-bad); }

/* F-01.7 */
.hz-form-campo input[type="number"] { font-variant-numeric: tabular-nums; }

/* F-01.8 */
.hz-form-error { margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--delta-bad); }
.hz-form-error:empty { display: none; }

/* F-01.9 */
.hz-form-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }

/* F-01.10 */
.hz-form-pie { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }

/* F-01.11 -- AL FINAL de la sección (ganan por orden ante empate 0-2-0);
   el inline style.display='none' del JS se conserva como cinturón
   verificado. */
.hz-form[hidden] { display: none; }
.hz-form-card[hidden] { display: none; }

/* F-02 -- jerarquía de botones hz-btn-*. Radius 8px (píldora 999px
   reservada a badge/filtro). Un solo primario por formulario. */
.hz-btn { appearance: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
.hz-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.hz-btn:disabled, .hz-btn[aria-disabled="true"] { opacity: 0.5; cursor: default; }

.hz-btn-primario { background: var(--series-1); border-color: var(--series-1); color: var(--surface-1); }
.hz-btn-primario:hover { filter: brightness(0.94); }

.hz-btn-secundario { background: var(--surface-1); border-color: var(--border); color: var(--text-primary); }
.hz-btn-secundario:hover { background: var(--page); }

.hz-btn-peligro { background: transparent; border-color: transparent; color: var(--delta-bad); font-size: 0.85rem; padding: 6px 12px; }
.hz-btn-peligro:hover { border-color: var(--delta-bad); }
.hz-btn-peligro:focus-visible { outline: 2px solid var(--delta-bad); outline-offset: 2px; }
.hz-btn-peligro[data-confirmar="true"] { background: var(--delta-bad); border-color: var(--delta-bad); color: var(--surface-1); font-weight: 700; }

/* Targets táctiles (extiende la regla R6 resp-3 sin tocarla, sección 11
   arriba: ese bloque no incluye .hz-btn). */
@media (pointer: coarse), (max-width: 640px) {
  .hz-btn { min-height: 44px; padding: 10px 18px; display: inline-flex; align-items: center; justify-content: center; }
}

/* ---------- 13. Adendum R10 (R-01): clases hz-rutina- (lectura de la
   rutina) ---------- */
.hz-rutina-lista {display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.hz-rutina-item {display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--page);}
.hz-rutina-nombre {flex:1 1 200px;min-width:140px;color:var(--text-primary);font-size:0.92rem;white-space:normal;overflow-wrap:break-word;}
.hz-rutina-dosis {flex:0 0 auto;font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.hz-rutina-descanso {flex:0 0 auto;color:var(--text-secondary);font-size:0.85rem;}
.hz-rutina-nota {flex:1 1 100%;color:var(--text-secondary);font-size:0.8rem;}

/* ---------- 14. Adendum R11 (D-01): dialogo modal hz-dialogo ---------- */
dialog.hz-dialogo { border: 1px solid var(--border); border-radius: 16px; background: var(--surface-1); color: var(--text-primary); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: var(--shadow-card); overflow: auto; }
dialog.hz-dialogo::backdrop { background: rgba(11, 11, 11, 0.55); backdrop-filter: blur(2px); }
dialog.hz-dialogo > .hz-form-card { max-width: none; margin: 0; }
dialog.hz-dialogo:not([open]) { display: none; }
@media (max-width: 599px) {
  dialog.hz-dialogo { width: calc(100vw - 16px); border-radius: 12px; }
}

/* R11 (D-07): casilla en linea con su etiqueta */
.hz-form-campo.hz-form-check { flex-direction: row; align-items: center; gap: 10px; }
.hz-form-campo.hz-form-check input[type="checkbox"] { width: 18px; height: 18px; margin: 0; padding: 0; flex: 0 0 auto; accent-color: var(--series-1); }
.hz-form-campo.hz-form-check label { font-size: 0.95rem; color: var(--text-primary); }
</style>
</head>
<body>
<header class="hz-header">
  <div class="hz-header-brand">
    <span class="hz-header-nombre">Rinde</span>
    <span class="hz-badge" id="hz-modo-datos">Modo demo</span>
  </div>
  <div class="hz-header-meta">
    <select id="hz-cliente-selector" class="hz-selector-cliente" aria-label="Cliente activo"></select>
    <span class="hz-header-periodo" id="hz-periodo">Período de seguimiento: 12 semanas</span>
  </div>
  <!-- Adendum R8 punto 2: solo markup y estilo (mismo .hz-toggle-tema que
       "Cambiar tema"); la lógica de cambio de modo la cablea T-039
       (build/almacen.js), que también actualiza el texto de #hz-modo-datos. -->
  <button type="button" id="hz-btn-modo" class="hz-toggle-tema" aria-pressed="false">Usar mis datos</button>
  <button type="button" id="toggle-tema" class="hz-toggle-tema" aria-pressed="false">Cambiar tema</button>

<nav class="hz-tablist" role="tablist" aria-label="Secciones de Rinde">

  <button type="button" id="tab-perfil" class="hz-tab" role="tab" aria-selected="false" aria-controls="vista-perfil" tabindex="-1">Perfil</button>
  <button type="button" id="tab-plan" class="hz-tab" role="tab" aria-selected="false" aria-controls="vista-plan" tabindex="-1">Plan de dieta</button>
  <button type="button" id="tab-rutina" class="hz-tab" role="tab" aria-selected="false" aria-controls="vista-rutina" tabindex="-1">Rutina</button>
  <button type="button" id="tab-seguimiento" class="hz-tab" role="tab" aria-selected="false" aria-controls="vista-seguimiento" tabindex="-1">Seguimiento</button>
  <button type="button" id="tab-suplementos" class="hz-tab" role="tab" aria-selected="false" aria-controls="vista-suplementos" tabindex="-1">Suplementos</button>

<main class="hz-main">
  <section id="vista-resumen" class="hz-vista" role="tabpanel" aria-labelledby="tab-resumen">
  </section>
  <section id="vista-perfil" class="hz-vista" role="tabpanel" aria-labelledby="tab-perfil" hidden>
  </section>
  <section id="vista-plan" class="hz-vista" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <!-- Adendum R5 (T-021): contenedor del recomendador de plan; T-022
         lo llena vía JS (hermano de .hz-grid, mismo patrón que
         .hz-menu-fila del Adendum R4). -->
    <div id="reco-plan" class="hz-card hz-reco-panel"></div>

  <!-- Adendum R10 (T-049, R-01.2): contenedor vacío; build/vista_rutina.js
       (T-053) lo llena vía JS, mismo patrón que las demás vistas. -->
  <section id="vista-rutina" class="hz-vista" role="tabpanel" aria-labelledby="tab-rutina" hidden></section>

         T-040 lo llena con el formulario de captura de mediciones (modo

    <!-- Adendum R5 (T-021): fila de herramientas de documentos, arriba

    <div id="doc-herramientas" class="hz-doc-herramientas">

</footer>

<script id="hz-runtime">
(function () {
  var G = (typeof window !== 'undefined') ? window : globalThis;
  G.Herzon = G.Herzon || {};
  var Herzon = G.Herzon;

  var TAB_ORDER = ['resumen', 'perfil', 'plan', 'rutina', 'seguimiento', 'suplementos'];
  var views = {};
  var activeTab = 'resumen';
  var rangeWeeks = 12;
  var rangeListeners = [];

  Herzon.registerView = function (id, mountFn) {
    if (TAB_ORDER.indexOf(id) === -1) { return; }
    views[id] = views[id] || {};
    views[id].mountFn = mountFn;
  };

  function mountIfNeeded(id) {
    var entry = views[id];
    if (!entry || typeof entry.mountFn !== 'function' || entry.mounted) { return; }
    var root = document.getElementById('vista-' + id);
    if (!root) { return; }
    entry.mountFn(root);
    entry.mounted = true;
  }

  function activateTab(id) {
    if (TAB_ORDER.indexOf(id) === -1) { return; }
    activeTab = id;
    for (var i = 0; i < TAB_ORDER.length; i++) {
      var tid = TAB_ORDER[i];
      var selected = (tid === id);
      var tabEl = document.getElementById('tab-' + tid);
      var panelEl = document.getElementById('vista-' + tid);
      if (tabEl) {
        tabEl.setAttribute('aria-selected', selected ? 'true' : 'false');
        tabEl.tabIndex = selected ? 0 : -1;
      }
      if (panelEl) {
        if (selected) { panelEl.removeAttribute('hidden'); }
        else { panelEl.setAttribute('hidden', ''); }
      }
    }
    var filtroEl = document.getElementById('filtro-rango');
    if (filtroEl) {
      if (id === 'seguimiento') { filtroEl.removeAttribute('hidden'); }
      else { filtroEl.setAttribute('hidden', ''); }
    }
    mountIfNeeded(id);
  }

  function focusTab(id) {
    var el = document.getElementById('tab-' + id);
    if (el && typeof el.focus === 'function') { el.focus(); }
  }

  function onTabClick(ev) {
    var id = ev.currentTarget.getAttribute('data-tab-id');
    activateTab(id);
  }

  function onTablistKeydown(ev) {
    var idx = TAB_ORDER.indexOf(activeTab);
    var nextId = null;
    if (ev.key === 'ArrowRight') {
      nextId = TAB_ORDER[(idx + 1) % TAB_ORDER.length];
    } else if (ev.key === 'ArrowLeft') {
      nextId = TAB_ORDER[(idx - 1 + TAB_ORDER.length) % TAB_ORDER.length];
    } else if (ev.key === 'Home') {
      nextId = TAB_ORDER[0];
    } else if (ev.key === 'End') {

  var FACTORES_DIA = [1.00, 0.97, 1.03, 0.99, 1.05, 0.95, 1.01];

    var partesC = dividirEntreComidas(cDia, proporciones);
    var partesG = dividirEntreComidas(gDia, proporciones);

    for (var i = 0; i < momentos.length; i++) {
      var momento = momentos[i];
      var lista = plantillas[momento];
      var plantilla = lista[(numeroDia - 1 + i) % lista.length];
      comidas.push(construirComida(
        momento,
        horas[momento],
        plantilla.nombre,
        partesP[i],
        partesC[i],
        partesG[i],
        plantilla.ingredientes
      ));

  // fuente de verdad, siempre deriva de macrosBase.
  function construirPlan(id, nombre, kcalObjetivo, macrosBase, plantillas, indicadoPara, etiquetas, descripcion) {

// sección 2.3): Herzon.Seguridad — módulo de CRIPTO PURO, sin DOM, sin el
// objeto de datos en memoria del prototipo, sin red. Cifra/descifra el
// payload v2 completo que vive en la MISMA clave de localStorage
// `rinde.datos.v1` (dueño de esa clave: build/almacen.js), envolviéndolo
// en un SOBRE versionado `version:"cifrado-1"`.
//
// Separación estricta (C-4 del documento de diseño): seguridad.js NO
// conoce clientes ni la forma del payload v2 más allá de tratarlo como
// texto JSON opaco que cifra/descifra; almacen.js NO conoce WebCrypto y
// solo llama a esta API. Este módulo JAMÁS toca `document` ni el objeto
// de datos global del runtime, ni monta interfaz.
//
// Preámbulo obligatorio (plan.md 3.A): script clásico, IIFE, sin
// import/export, sin tocar `document` en el nivel superior (aquí ni
// siquiera existe esa noción: el módulo no usa DOM en absoluto). En los
// selfchecks de Node se hace `globalThis.crypto = require('crypto').webcrypto`
// ANTES de requerir este archivo (mismo patrón que documenta el contrato
// S-01): en el navegador `window.crypto` ya trae `subtle` y
// `getRandomValues` de forma nativa, incluso bajo `file://` (contexto
// seguro en Chrome/Firefox/Safari).
//
// SOBRE (formato exacto, JSON, contrato S-01):
// {"version":"cifrado-1","kdf":{"algoritmo":"PBKDF2","sal":"<base64 16 bytes>",
//  "iteraciones":600000,"hash":"SHA-256"},
//  "cifrado":{"algoritmo":"AES-GCM","iv":"<base64 12 bytes>","datos":"<base64 ciphertext+tag>"}}
// El texto plano cifrado es `JSON.stringify` del payload v2 completo
// `{version:2,activoId,clientes}` en UTF-8. La clave se deriva con
// PBKDF2-SHA-256 -> AES-GCM 256 bits, SIEMPRE no extraíble.
// `desbloquear`/`desactivar`/`cambiar` leen SIEMPRE la sal y las
// iteraciones DEL SOBRE (nunca de una constante): un aumento futuro de
// `ITERACIONES_MINIMAS` no rompe sobres viejos.
//
// INVARIANTE DE IV: `crypto.getRandomValues` genera un IV de 12 bytes
// FRESCO en cada llamada a `cifrarYPersistir` (reutilizar un IV bajo la
// misma clave AES-GCM es catastrófico: revela el XOR de los dos textos
// planos y compromete la autenticación). El selfcheck asierta
// literalmente `iv1 !== iv2` entre dos escrituras consecutivas.
//
// COLA DE ESCRITURA: las escrituras son asíncronas (derivar/cifrar toma
// tiempo). Se serializan y COALESCEN: como máximo una escritura en vuelo y
// una pendiente; si llegan más peticiones mientras hay una pendiente,
// SOLO la última sobrevive (gana la última). La memoria del llamador
// (almacen.js) es la fuente de verdad: este módulo nunca lee de vuelta lo
// que va a escribir, solo serializa el `payload` que recibe en cada
// llamada.
(function () {
  'use strict';

  var G = (typeof window !== 'undefined') ? window : globalThis;
  G.Herzon = G.Herzon || {};

  var CLAVE_ALMACEN = 'rinde.datos.v1';
  var VERSION_SOBRE = 'cifrado-1';
  var ITERACIONES_MINIMAS = 600000;
  var LONGITUD_SAL = 16;
  var LONGITUD_IV = 12;
  var BASE64_ALFABETO = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

  // -----------------------------------------------------------------------
  // Estado de sesión (closure del módulo; jamás expuesto). `claveSesion` es
  // el CryptoKey no extraíble derivado en activar/desbloquear/cambiar;
  // `salSesion`/`iteracionesSesion` acompañan a esa clave para poder
  // reconstruir el bloque `kdf` del sobre en cada escritura sin volver a
  // derivar.
  // -----------------------------------------------------------------------
  var claveSesion = null;
  var salSesion = null;
  var iteracionesSesion = null;

  // Cola serializada y coalescente de escrituras (ver nota de cabecera).
  var trabajoEnVuelo = null;
  var trabajoPendiente = null;

  // -----------------------------------------------------------------------
  // Base64 propio (bytes <-> texto), sin depender de btoa/atob: idéntico en
  // Node y en el navegador, sin límites de tamaño de argumento.
  // -----------------------------------------------------------------------
  function bytesABase64(bytes) {
    var resultado = '';
    var i;
    for (i = 0; i + 3 <= bytes.length; i += 3) {
      var b0 = bytes[i];
      var b1 = bytes[i + 1];
      var b2 = bytes[i + 2];
      resultado += BASE64_ALFABETO[b0 >> 2];
      resultado += BASE64_ALFABETO[((b0 & 3) << 4) | (b1 >> 4)];
      resultado += BASE64_ALFABETO[((b1 & 15) << 2) | (b2 >> 6)];
      resultado += BASE64_ALFABETO[b2 & 63];
    }
    var restantes = bytes.length - i;
    if (restantes === 1) {
      var c0 = bytes[i];
      resultado += BASE64_ALFABETO[c0 >> 2];
      resultado += BASE64_ALFABETO[(c0 & 3) << 4];
      resultado += '==';
    } else if (restantes === 2) {
      var d0 = bytes[i];
      var d1 = bytes[i + 1];
      resultado += BASE64_ALFABETO[d0 >> 2];
      resultado += BASE64_ALFABETO[((d0 & 3) << 4) | (d1 >> 4)];
      resultado += BASE64_ALFABETO[(d1 & 15) << 2];
      resultado += '=';
    }
    return resultado;
  }

  function base64ABytes(texto) {
    var cadena = String(texto == null ? '' : texto);
    var sinPadding = cadena.replace(/=+$/, '');
    var bytesEsperados = Math.floor((sinPadding.length * 6) / 8);
    var bytes = new Uint8Array(bytesEsperados);
    var buffer = 0;
    var bitsAcumulados = 0;
    var indiceByte = 0;
    for (var i = 0; i < sinPadding.length; i++) {
      var valor = BASE64_ALFABETO.indexOf(sinPadding[i]);
      if (valor === -1) { continue; }
      buffer = (buffer << 6) | valor;
      bitsAcumulados += 6;
      if (bitsAcumulados >= 8) {
        bitsAcumulados -= 8;
        bytes[indiceByte] = (buffer >> bitsAcumulados) & 0xFF;
        indiceByte += 1;
      }
    }
    return bytes;
  }

  // -----------------------------------------------------------------------
  // Acceso a localStorage: TOLERANTE por diseño (mismo patrón que
  // build/almacen.js, copia propia porque seguridad.js no depende de otros
  // módulos). El módulo no debe lanzar si `localStorage` no existe.
  // -----------------------------------------------------------------------
  function localStorageDisponible() {
    try {
      if (typeof G.localStorage === 'undefined' || G.localStorage === null) { return false; }
      var claveDePrueba = '__rinde_seguridad_prueba__';
      G.localStorage.setItem(claveDePrueba, '1');
      G.localStorage.removeItem(claveDePrueba);
      return true;
    } catch (e) {
      return false;
    }
  }

  function leerCrudo() {
    try {
      if (!localStorageDisponible()) { return null; }
      return G.localStorage.getItem(CLAVE_ALMACEN);
    } catch (e) {
      return null;
    }
  }

  function escribirCrudo(texto) {
    try {
      if (!localStorageDisponible()) { return false; }
      G.localStorage.setItem(CLAVE_ALMACEN, texto);
      return true;
    } catch (e) {
      return false;
    }
  }

  // -----------------------------------------------------------------------
  // Sobre cifrado-1: construcción y parseo.
  // -----------------------------------------------------------------------
  function construirSobre(salBytes, iteraciones, ivBytes, datosBytes) {
    return JSON.stringify({
      version: VERSION_SOBRE,
      kdf: {
        algoritmo: 'PBKDF2',
        sal: bytesABase64(salBytes),
        iteraciones: iteraciones,
        hash: 'SHA-256'
      },
      cifrado: {
        algoritmo: 'AES-GCM',
        iv: bytesABase64(ivBytes),
        datos: bytesABase64(datosBytes)
      }
    });
  }

  function parsearSobre(crudo) {
    if (crudo === null || crudo === undefined) { return null; }
    var objeto;
    try {
      objeto = JSON.parse(crudo);
    } catch (e) {
      return null;
    }
    if (!objeto || typeof objeto !== 'object') { return null; }
    if (objeto.version !== VERSION_SOBRE) { return null; }
    if (!objeto.kdf || !objeto.cifrado) { return null; }
    if (typeof objeto.kdf.sal !== 'string' || typeof objeto.kdf.iteraciones !== 'number') { return null; }
    if (typeof objeto.cifrado.iv !== 'string' || typeof objeto.cifrado.datos !== 'string') { return null; }
    return objeto;
  }

  // -----------------------------------------------------------------------
  // Primitivas WebCrypto (todas asíncronas, todas leen `G.crypto`: nunca el
  // identificador suelto `crypto`, para que el patrón `globalThis.crypto = ...`
  // de los selfchecks y de la app real sea la única fuente).
  // -----------------------------------------------------------------------
  function bytesAleatorios(n) {
    var bytes = new Uint8Array(n);
    G.crypto.getRandomValues(bytes);
    return bytes;
  }

  function derivarClave(contrasena, salBytes, iteraciones) {
    var codificador = new TextEncoder();
    return G.crypto.subtle.importKey(
      'raw',
      codificador.encode(String(contrasena)),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    ).then(function (materialClave) {
      return G.crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salBytes, iterations: iteraciones, hash: 'SHA-256' },
        materialClave,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    });
  }

  function cifrarBytes(clave, ivBytes, textoPlano) {
    var codificador = new TextEncoder();
    return G.crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: ivBytes },
      clave,
      codificador.encode(textoPlano)
    ).then(function (bufferCifrado) {
      return new Uint8Array(bufferCifrado);
    });
  }

  function descifrarBytes(clave, ivBytes, datosBytes) {
    return G.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: ivBytes },
      clave,
      datosBytes
    ).then(function (bufferPlano) {
      var decodificador = new TextDecoder();
      return decodificador.decode(bufferPlano);
    }).catch(function () {
      return null;
    });
  }

  // Descifra un sobre YA PARSEADO con una contrasena candidata, derivando
  // SIEMPRE desde cero (nunca confía en la clave de sesión cacheada: eso es
  // lo que hace a `desactivar`/`cambiar` verificaciones reales). Devuelve
  // null ante CUALQUIER fallo (contrasena incorrecta, sobre manipulado o
  // JSON inválido son indistinguibles por diseño).
  function descifrarSobreConContrasena(sobre, contrasena) {
    var salBytes;
    var ivBytes;
    var datosBytes;
    try {
      salBytes = base64ABytes(sobre.kdf.sal);
      ivBytes = base64ABytes(sobre.cifrado.iv);
      datosBytes = base64ABytes(sobre.cifrado.datos);
    } catch (e) {
      return Promise.resolve(null);
    }
    var iteraciones = sobre.kdf.iteraciones;
    return derivarClave(contrasena, salBytes, iteraciones).then(function (clave) {
      return descifrarBytes(clave, ivBytes, datosBytes).then(function (textoPlano) {
        if (textoPlano === null) { return null; }
        var payload;
        try {
          payload = JSON.parse(textoPlano);
        } catch (e) {
          return null;
        }
        return { payload: payload, clave: clave, sal: salBytes, iteraciones: iteraciones };
      });
    }).catch(function () {
      return null;
    });
  }

  function limpiarSesion() {
    claveSesion = null;
    salSesion = null;
    iteracionesSesion = null;
  }

  function fijarSesion(clave, salBytes, iteraciones) {
    claveSesion = clave;
    salSesion = salBytes;
    iteracionesSesion = iteraciones;
  }

  // -----------------------------------------------------------------------
  // API pública
  // -----------------------------------------------------------------------

  // activa(): SÍNCRONA, sin cripto (solo JSON.parse) — invocable desde el
  // boot síncrono de almacen.js.
  function activa() {
    var crudo = leerCrudo();
    if (crudo === null) { return false; }
    return parsearSobre(crudo) !== null;
  }

  // activar(contrasena): lee el v2 plano vigente (o cifra el esqueleto
  // vacío si la clave no existe todavía), genera sal nueva, cifra y escribe
  // el sobre. Deja la sesión DESBLOQUEADA.
  function activar(contrasena) {
    return new Promise(function (resolve) {
      if (!localStorageDisponible()) {
        resolve({ ok: false, errores: ['No hay almacenamiento disponible en este dispositivo.'] });
        return;
      }
      var crudo = leerCrudo();
      if (crudo !== null && parsearSobre(crudo) !== null) {
        resolve({ ok: false, errores: ['La protección ya está activa en este dispositivo.'] });
        return;
      }
      var plano;
      if (crudo === null) {
        plano = { version: 2, activoId: null, clientes: {} };
      } else {
        try {
          plano = JSON.parse(crudo);
        } catch (e) {
          resolve({ ok: false, errores: ['Los datos existentes de este dispositivo no se pudieron leer; no es seguro activar la protección sobre ellos.'] });
          return;
        }
      }
      var sal = bytesAleatorios(LONGITUD_SAL);
      var iteraciones = ITERACIONES_MINIMAS;
      derivarClave(contrasena, sal, iteraciones).then(function (clave) {
        var iv = bytesAleatorios(LONGITUD_IV);
        var textoPlano = JSON.stringify(plano);
        return cifrarBytes(clave, iv, textoPlano).then(function (datosBytes) {
          var sobre = construirSobre(sal, iteraciones, iv, datosBytes);
          var ok = escribirCrudo(sobre);
          if (!ok) {
            resolve({ ok: false, errores: ['No se pudo escribir la protección cifrada en este dispositivo.'] });
            return;
          }
          fijarSesion(clave, sal, iteraciones);
          resolve({ ok: true, errores: [] });
        });
      }).catch(function () {
        resolve({ ok: false, errores: ['No se pudo activar la protección en este dispositivo.'] });
      });
    });
  }

  // desactivar(contrasena): verifica descifrando DESDE CERO (nunca confía
  // en la clave cacheada), escribe el v2 PLANO de vuelta y borra la sesión.
  function desactivar(contrasena) {
    return new Promise(function (resolve) {
      var crudo = leerCrudo();
      var sobre = parsearSobre(crudo);
      if (sobre === null) {
        resolve({ ok: false, errores: ['No hay protección activa en este dispositivo.'] });
        return;
      }
      descifrarSobreConContrasena(sobre, contrasena).then(function (resultado) {
        if (resultado === null) {
          resolve({ ok: false, errores: ['Contraseña incorrecta.'] });
          return;
        }
        var ok = escribirCrudo(JSON.stringify(resultado.payload));
        if (!ok) {
          resolve({ ok: false, errores: ['No se pudo escribir los datos sin cifrar en este dispositivo.'] });
          return;
        }
        limpiarSesion();
        resolve({ ok: true, errores: [] });
      });
    });
  }

  // cambiar(actual, nueva): descifra con `actual`, re-deriva con SAL NUEVA
  // y re-cifra con `nueva`.
  function cambiar(actual, nueva) {
    return new Promise(function (resolve) {
      var crudo = leerCrudo();
      var sobre = parsearSobre(crudo);
      if (sobre === null) {
        resolve({ ok: false, errores: ['No hay protección activa en este dispositivo.'] });
        return;
      }
      descifrarSobreConContrasena(sobre, actual).then(function (resultado) {
        if (resultado === null) {
          resolve({ ok: false, errores: ['La contraseña actual es incorrecta.'] });
          return;
        }
        var salNueva = bytesAleatorios(LONGITUD_SAL);
        var iteracionesNueva = ITERACIONES_MINIMAS;
        derivarClave(nueva, salNueva, iteracionesNueva).then(function (claveNueva) {
          var iv = bytesAleatorios(LONGITUD_IV);
          var textoPlano = JSON.stringify(resultado.payload);
          return cifrarBytes(claveNueva, iv, textoPlano).then(function (datosBytes) {
            var sobreNuevo = construirSobre(salNueva, iteracionesNueva, iv, datosBytes);
            var ok = escribirCrudo(sobreNuevo);
            if (!ok) {
              resolve({ ok: false, errores: ['No se pudo escribir la nueva protección en este dispositivo.'] });
              return;
            }
            fijarSesion(claveNueva, salNueva, iteracionesNueva);
            resolve({ ok: true, errores: [] });
          });
        }).catch(function () {
          resolve({ ok: false, errores: ['No se pudo cambiar la contraseña en este dispositivo.'] });
        });
      });
    });
  }

  // desbloquear(contrasena): null ante fallo de autenticación GCM
  // (contrasena incorrecta y sobre manipulado son indistinguibles por
  // diseño). En éxito cachea la clave de sesión y devuelve el payload v2.
  function desbloquear(contrasena) {
    return new Promise(function (resolve) {
      var crudo = leerCrudo();
      var sobre = parsearSobre(crudo);
      if (sobre === null) {
        resolve(null);
        return;
      }
      descifrarSobreConContrasena(sobre, contrasena).then(function (resultado) {
        if (resultado === null) {
          resolve(null);
          return;
        }
        fijarSesion(resultado.clave, resultado.sal, resultado.iteraciones);
        resolve(resultado.payload);
      }).catch(function () {
        resolve(null);
      });
    });
  }

  // bloquear(): SÍNCRONA, borra la clave de sesión (re-bloqueo sin
  // recargar la página).
  function bloquear() {
    limpiarSesion();
  }

  // cifrarYPersistir(payload): rechaza/false sin clave de sesión. IV
  // fresco en CADA escritura. Cola serializada y coalescente: una en
  // vuelo, una pendiente máximo, gana la última.
  function cifrarYPersistir(payload) {
    return new Promise(function (resolve) {
      if (!claveSesion) {
        resolve(false);
        return;
      }
      var instantanea = { clave: claveSesion, sal: salSesion, iteraciones: iteracionesSesion };
      if (trabajoEnVuelo) {
        if (trabajoPendiente) {
          trabajoPendiente.payload = payload;
          trabajoPendiente.instantanea = instantanea;
          trabajoPendiente.resolvers.push(resolve);
        } else {
          trabajoPendiente = { payload: payload, instantanea: instantanea, resolvers: [resolve] };
        }
        return;
      }
      ejecutarTrabajo(payload, instantanea, [resolve]);
    });
  }

  function procesarEscritura(payload, instantanea) {
    var iv = bytesAleatorios(LONGITUD_IV);
    var textoPlano = JSON.stringify(payload);
    return cifrarBytes(instantanea.clave, iv, textoPlano).then(function (datosBytes) {
      var sobre = construirSobre(instantanea.sal, instantanea.iteraciones, iv, datosBytes);
      return escribirCrudo(sobre);
    });
  }

  function ejecutarTrabajo(payload, instantanea, resolvers) {
    trabajoEnVuelo = procesarEscritura(payload, instantanea).then(function (ok) {
      for (var i = 0; i < resolvers.length; i++) { resolvers[i](ok); }
    }).catch(function () {
      for (var i = 0; i < resolvers.length; i++) { resolvers[i](false); }
    }).then(function () {
      trabajoEnVuelo = null;
      if (trabajoPendiente) {
        var siguiente = trabajoPendiente;
        trabajoPendiente = null;
        ejecutarTrabajo(siguiente.payload, siguiente.instantanea, siguiente.resolvers);
      }
    });
  }

  G.Herzon.Seguridad = {
    activa: activa,
    activar: activar,
    desactivar: desactivar,
    cambiar: cambiar,
    desbloquear: desbloquear,
    cifrarYPersistir: cifrarYPersistir,
    bloquear: bloquear
  };
})();

</script>
<script id="hz-almacen">
/* build/almacen.js
 * R8 (T-039) + R9 (T-045) + R10 (T-052): Herzon.Almacen -- modo demo/real,
 * multi-cliente y persistencia local. Dueño único de este archivo. Contrato
 * congelado en .harness/plan.md Adendum R8 punto 1, Adendum R9 punto 3
 * (SUPERSEDE parcial de R8: ver `activarReal` más abajo) y Adendum R10
 * (R-02/R-03/S-02/S-04/S-05, ver el documento normativo consolidado de la
 * ronda 10 dentro de `.harness/`).
 *
 * R10 -- ampliación aditiva, NINGUNA firma previa cambia:
 *   - Slot `rutina` por cliente (R-02/R-03): `guardarRutina`, normalización
 *     tolerante, expuesto en `HERZON_DATA.rutina`.
 *   - Slot `config` por cliente (S-05): `{labsOcultos}`, `actualizarConfig`,
 *     expuesto en `HERZON_DATA.config` (SIEMPRE `{labsOcultos:false}` en
 *     demo, aunque el catálogo no traiga la clave).
 *   - Respaldo exportable/importable (S-04): `exportarRespaldo`,
 *     `restaurarRespaldo` (reemplazo TOTAL, nunca fusión).
 *   - Boot bloqueado + embudo único de escritura (S-02): con
 *     `Herzon.Seguridad.activa()===true` el boot arranca en demo funcional
 *     con `bloqueado()===true`; `desbloquearYMontar(contrasena)` asíncrono
 *     levanta el bloqueo. `escribirAlmacenCrudo` es el ÚNICO sitio de este
 *     archivo que escribe la clave `rinde.datos.v1` (assert de selfcheck).
 *     Tolerancia total: si `Herzon.Seguridad` no existe, comportamiento
 *     IDÉNTICO al de antes de esta ronda (sin flag day).
 *
 * Responsabilidad EXCLUSIVA de este módulo: datos, persistencia, modo,
 * clientes y el cableado del botón/badge/selector del header
 * (#hz-btn-modo / #hz-modo-datos / #hz-cliente-selector). NO monta
 * formularios ni ninguna otra UI: eso es de las vistas (T-040/T-041).
 *
 * Persistencia: UNA clave localStorage `rinde.datos.v1` (JSON versionado).
 * Sin backend, sin red: todo vive en este dispositivo.
 *
 * -------------------------------------------------------------------------
 * Esquema v2 (Adendum R9 punto 3), MISMA clave que v1:
 *   { "version": 2, "activoId": "c-<id>" | null,
 *     "clientes": { "c-<id>": { perfil, series, labs, plicometria,
 *                                suplementos, plan: null|{plantillaId,
 *                                kcalObjetivo,fecha}, creado } } }
 * `perfil` tiene la MISMA forma que el `paciente` de v1. La demo JAMÁS
 * entra en `clientes{}` ni toca localStorage (MC-05): vive solo en
 * `datosOriginalDemo` (copia profunda en memoria de data.js).
 *
 * Migración v1 -> v2: en `cargar()`, si el payload leído trae
 * `version===1 && modo==='real'`, se envuelve como ÚNICO cliente y se
 * reescribe la clave YA en v2 (idempotente: la próxima lectura ve
 * version===2 directo, la rama de migración no vuelve a correr).
 *
 * Corrupción / version desconocida / `activoId` colgante SIN clientes =>
 * modo demo funcional, sin lanzar. `activoId` colgante CON clientes =>
 * se monta el primero por `creado` (y se corrige el activoId persistido).
 * `clientes` vacío => demo.
 *
 * Contrato del parámetro `perfil` que reciben `crearCliente(perfil)`,
