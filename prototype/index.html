<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herzon — Prototipo</title>
<style>
/* ============================================================
   HERZON — hoja de estilos única (T-002, dueño único de TODO
   el CSS del prototipo). Ningún otro módulo escribe <style>.
   ============================================================ */

/* ---------- 1. Tokens: modo claro (default) ---------- */
:root {
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --delta-good: #006300;
  --delta-bad: #d03b3b;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --heat-1: #6da7ec;
  --heat-2: #3987e5;
  --heat-3: #2a78d6;
  --heat-4: #1c5cab;
  --heat-5: #104281;
  --shadow-card: 0 1px 3px rgba(11, 11, 11, 0.10);
}

/* ---------- 2. Tokens: preferencia de sistema oscura ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --delta-good: #0ca30c;
    --delta-bad: #d03b3b;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --heat-1: #9ec5f4;
    --heat-2: #6da7ec;
    --heat-3: #3987e5;
    --heat-4: #2a78d6;
    --heat-5: #1c5cab;
    --shadow-card: none;
  }
}

/* ---------- 3. Tokens: el toggle del prototipo (gana en ambas direcciones) ---------- */
:root[data-theme="dark"] {
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --delta-good: #0ca30c;
  --delta-bad: #d03b3b;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --heat-1: #9ec5f4;
  --heat-2: #6da7ec;
  --heat-3: #3987e5;
  --heat-4: #2a78d6;
  --heat-5: #1c5cab;
  --shadow-card: none;
}

:root[data-theme="light"] {
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --delta-good: #006300;
  --delta-bad: #d03b3b;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --heat-1: #6da7ec;
  --heat-2: #3987e5;
  --heat-3: #2a78d6;
  --heat-4: #1c5cab;
  --heat-5: #104281;
  --shadow-card: 0 1px 3px rgba(11, 11, 11, 0.10);
}

/* ---------- 4. Reset y base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { color-scheme: light dark; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

img, svg { max-width: 100%; height: auto; display: block; }

button, input, select { font-family: inherit; }

/* ---------- 5. Layout de chrome (header, tabs, filtros, main) ---------- */
.hz-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px clamp(12px, 4vw, 32px);
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
}
.hz-header-brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hz-header-nombre { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.01em; color: var(--text-primary); }
.hz-header-meta { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-secondary); font-size: 0.85rem; }
.hz-toggle-tema {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}
.hz-toggle-tema:hover { background: var(--page); }
.hz-toggle-tema:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.hz-tablist {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 clamp(12px, 4vw, 32px);
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
}
.hz-tab {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.95rem;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.hz-tab:hover { color: var(--text-primary); }
.hz-tab:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
.hz-tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }

.hz-main { padding: 20px clamp(12px, 4vw, 32px) 48px; max-width: 100%; }

.hz-vista { display: flex; flex-direction: column; gap: 20px; }
.hz-vista[hidden] { display: none; }

.hz-filtros {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 12px 0 20px;
}
.hz-filtros[hidden] { display: none; }
.hz-filtros-label { color: var(--text-secondary); font-size: 0.85rem; }
.hz-filtro-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
}
.hz-filtro-btn:hover { color: var(--text-primary); }
.hz-filtro-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.hz-filtro-btn[aria-pressed="true"] {
  background: var(--series-1);
  border-color: var(--series-1);
  color: var(--surface-1);
  font-weight: 600;
}

.hz-footer { padding: 20px clamp(12px, 4vw, 32px) 32px; border-top: 1px solid var(--border); }

/* ---------- 6. Componentes congelados (plan.md 3.G) ---------- */
.hz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
  gap: 16px;
}

.hz-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow-card);
  min-width: 0;
}
.hz-card-title { margin: 0 0 12px; font-size: 1rem; font-weight: 600; color: var(--text-primary); }

.hz-hero { display: flex; flex-direction: column; gap: 4px; }
.hz-hero-num { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; line-height: 1; color: var(--text-primary); }
.hz-hero-label { font-size: 0.85rem; color: var(--text-secondary); }

.hz-stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-1);
}
.hz-stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.hz-stat-num { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
.hz-stat-delta { font-size: 0.85rem; font-weight: 600; }
.hz-delta-good { color: var(--delta-good); }
.hz-delta-bad { color: var(--delta-bad); }

.hz-spark { display: block; width: 100%; height: auto; }

.hz-chart { position: relative; width: 100%; }
.hz-chart-title { margin: 0 0 8px; font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }

.hz-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.hz-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
.hz-legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.hz-table-toggle {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.82rem;
  cursor: pointer;
  margin-top: 8px;
}
.hz-table-toggle:hover { color: var(--text-primary); }
.hz-table-toggle:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.hz-table-toggle[aria-expanded="true"] { color: var(--text-primary); font-weight: 600; }

.hz-table-wrap { overflow-x: auto; margin-top: 8px; }
.hz-table { border-collapse: collapse; width: 100%; min-width: max-content; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.hz-table th, .hz-table td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; color: var(--text-primary); white-space: nowrap; }
.hz-table th { color: var(--text-secondary); font-weight: 600; }

.hz-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.8rem;
  color: var(--text-primary);
  z-index: 20;
  opacity: 0;
  transition: opacity 0.1s ease;
}
.hz-tooltip[data-visible="true"] { opacity: 1; }

.hz-crosshair {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--axis);
  pointer-events: none;
  opacity: 0;
}
.hz-crosshair[data-visible="true"] { opacity: 1; }

.hz-status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.hz-status-dot[data-status="good"] { background: var(--status-good); }
.hz-status-dot[data-status="warning"] { background: var(--status-warning); }
.hz-status-dot[data-status="serious"] { background: var(--status-serious); }
.hz-status-dot[data-status="critical"] { background: var(--status-critical); }
.hz-status-label { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }

.hz-nota { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; max-width: 70ch; }

.hz-form { display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
.hz-form-campo { display: flex; flex-direction: column; gap: 6px; }
.hz-form-campo label { font-size: 0.85rem; color: var(--text-secondary); }
.hz-form-campo select,
.hz-form-campo input {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--surface-1);
  color: var(--text-primary);
}
.hz-form-campo select:focus-visible,
.hz-form-campo input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

.hz-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-secondary);
  background: var(--page);
  border: 1px solid var(--border);
}

/* Ticks de eje de gráfica: única otra regla, además de .hz-table, con tabular-nums */
.hz-axis-tick { font-variant-numeric: tabular-nums; fill: var(--axis); font-size: 0.72rem; }

/* ---------- 7. Adendum R4 (T-017): menú del día en Plan de dieta ----------
   Clases nuevas SOLO con prefijo hz-menu- (plan.md Adendum R4, punto 2).
   El "Detalle del día" deja de ser tabla y pasa a fila de ancho completo:
   una card por comida, nombre del platillo COMPLETO (envuelve, no hereda
   el white-space:nowrap de .hz-table) y una mini barra apilada de macros
   por comida con gap de 2px color superficie (regla 5 del contrato).
   Corrección R4 (intento 2, rechazo del verifier por hueco muerto): la card
   del menú ya NO vive dentro de .hz-grid (evita que auto-fit deje columnas
   sin colapsar en otras filas del grid superior); vive como hermana de
   .hz-grid dentro de .hz-vista (flex column, gap:20px, congelado 3.G) y
   solo necesita declarar su propio ancho completo. */
.hz-menu-fila { width: 100%; }

.hz-menu-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

.hz-menu-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--page);
}

.hz-menu-hora { flex: 0 0 auto; min-width: 52px; color: var(--text-secondary); font-size: 0.82rem; }

.hz-menu-nombre {
  flex: 1 1 240px;
  min-width: 160px;
  color: var(--text-primary);
  font-size: 0.92rem;
  white-space: normal;
  overflow-wrap: break-word;
}
.hz-menu-momento { color: var(--text-secondary); font-weight: 600; }
.hz-menu-platillo { color: var(--text-primary); }

.hz-menu-kcal { flex: 0 0 auto; min-width: 76px; text-align: right; font-weight: 600; color: var(--text-primary); font-size: 0.92rem; }

.hz-menu-macros {
  flex: 0 0 140px;
  display: flex;
  gap: 2px;
  height: 10px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface-1);
}
.hz-menu-macro-seg { height: 100%; }

.hz-menu-total {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  margin-top: 6px;
  border-top: 2px solid var(--border);
}
.hz-menu-total-label { font-weight: 700; color: var(--text-primary); }
.hz-menu-total-macros { font-weight: 400; color: var(--text-secondary); font-size: 0.85rem; }
.hz-menu-total-kcal { font-weight: 700; color: var(--text-primary); }

/* ---------- 8. Adendum R5 (T-021): recomendador (hz-reco-*) ----------
   Clases nuevas SOLO con prefijo hz-reco- (plan.md Adendum R5 punto 5).
   #reco-plan vive dentro de #vista-plan, hermano de .hz-grid (mismo
   patrón ya usado por .hz-menu-fila en el Adendum R4): flex column con
   gap:20px heredado de .hz-vista, declara su propio ancho completo. El
   contenido (formulario precargado, resumen TMB/GET/kcal objetivo/
   macros, ranking de plantillas con razones y controles de ajuste) lo
   genera T-022 en build/vista_dieta_supl.js contra estas clases, ya
   que T-022 NO posee build/shell.html (regla F1): este es el set
   congelado de estilos disponible para esa vista. */
.hz-reco-panel { width: 100%; }

.hz-reco-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
  gap: 12px;
  margin-top: 4px;
}

.hz-reco-resumen {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
}

.hz-reco-lista {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.hz-reco-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-left: 4px solid transparent;
  border-radius: 10px;
  background: var(--page);
}
.hz-reco-item[data-mejor="true"] {
  border-left-color: var(--series-1);
  background: var(--surface-1);
}

.hz-reco-rank {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface-1);
  border: 1px solid var(--border);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text-primary);
}

.hz-reco-nombre { flex: 1 1 200px; min-width: 140px; font-weight: 600; color: var(--text-primary); font-size: 0.95rem; }

.hz-reco-score { flex: 0 0 auto; min-width: 64px; text-align: right; font-weight: 700; color: var(--text-primary); font-size: 0.92rem; }

.hz-reco-score-barra {
  flex: 0 0 120px;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface-1);
  border: 1px solid var(--border);
}
.hz-reco-score-fill { height: 100%; background: var(--series-1); }

.hz-reco-razones {
  flex: 1 1 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.hz-reco-acciones {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.hz-reco-slider { flex: 1 1 200px; min-width: 160px; accent-color: var(--series-1); }

/* ---------- 9. Adendum R5 (T-021): herramientas de documentos y
   documento imprimible (hz-doc-*) ----------
   Clases nuevas SOLO con prefijo hz-doc- (plan.md Adendum R5 punto 5).
   #doc-herramientas vive dentro de #vista-seguimiento, primer hijo
   estático (T-005 hace rootEl.appendChild de sus propias cards DESPUÉS,
   nunca las reemplaza) -- por eso la fila queda arriba de las cards,
   igual que #filtro-rango queda arriba de lo que filtra. Los botones
   son estáticos con id fijo; T-023 (build/documentos.js) les cablea el
   evento -- T-023 NO posee build/shell.html, así que la estructura y el
   estilo de esta fila quedan congelados aquí. */
.hz-doc-herramientas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.hz-doc-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
}
.hz-doc-btn:hover { color: var(--text-primary); }
.hz-doc-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.hz-doc-import { display: inline-flex; align-items: center; }
.hz-doc-import input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.hz-doc-import:focus-within .hz-doc-import-label {
  outline: 2px solid var(--series-1);
  outline-offset: 2px;
}

.hz-doc-import-label {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.hz-doc-import-label:hover { color: var(--text-primary); }

/* #documento-plan: oculto en pantalla (display:none aquí abajo), visible
   SOLO dentro de @media print (sección 10). Genera su contenido T-023
   con Herzon.planActivo() (fallback al plan por defecto). */
.hz-doc-documento { display: none; }
.hz-doc-titulo { margin: 0 0 4px; font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
.hz-doc-meta { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 20px; color: var(--text-secondary); font-size: 0.85rem; }
.hz-doc-seccion { margin: 0 0 24px; }
.hz-doc-seccion-titulo { margin: 0 0 8px; font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
.hz-doc-pie { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--grid); font-size: 0.75rem; color: var(--text-muted); }

/* ---------- 10. Adendum R5 (T-021): bloque @media print ----------
   Regla del criterio de aceptación: SOLO #documento-plan es visible al
   imprimir -- el resto de la app (header, tablist, main, footer y los
   dos bloques de script, hz-runtime y hz-boot) se oculta con un solo
   selector robusto a futuras adiciones (body > *:not(#documento-plan)).
   El documento SIEMPRE se ve en modo claro al imprimir, sin importar el
   tema activo en pantalla:

<script id="hz-runtime">
(function () {
  var G = (typeof window !== 'undefined') ? window : globalThis;
  G.Herzon = G.Herzon || {};
  var Herzon = G.Herzon;

  var TAB_ORDER = ['resumen', 'perfil', 'plan', 'seguimiento', 'suplementos'];
  var views = {};
  var activeTab = 'resumen';
  var rangeWeeks = 12;
  var rangeListeners = [];

  Herzon.registerView = function (id, mountFn) {
    if (TAB_ORDER.indexOf(id) === -1) { return; }
    views[id] = views[id] || {};
    views[id].mountFn = mountFn;
  };

  function mountIfNeeded(id) {
    var entry = views[id];
    if (!entry || typeof entry.mountFn !== 'function' || entry.mounted) { return; }
    var root = document.getElementById('vista-' + id);
    if (!root) { return; }
    entry.mountFn(root);
    entry.mounted = true;
  }

  function activateTab(id) {
    if (TAB_ORDER.indexOf(id) === -1) { return; }
    activeTab = id;
    for (var i = 0; i < TAB_ORDER.length; i++) {
      var tid = TAB_ORDER[i];
      var selected = (tid === id);
      var tabEl = document.getElementById('tab-' + tid);
      var panelEl = document.getElementById('vista-' + tid);
      if (tabEl) {
        tabEl.setAttribute('aria-selected', selected ? 'true' : 'false');
        tabEl.tabIndex = selected ? 0 : -1;
      }
      if (panelEl) {
        if (selected) { panelEl.removeAttribute('hidden'); }
        else { panelEl.setAttribute('hidden', ''); }
      }
    }
    var filtroEl = document.getElementById('filtro-rango');
    if (filtroEl) {
      if (id === 'seguimiento') { filtroEl.removeAttribute('hidden'); }
      else { filtroEl.setAttribute('hidden', ''); }
    }
    mountIfNeeded(id);
  }

  function focusTab(id) {
    var el = document.getElementById('tab-' + id);
    if (el && typeof el.focus === 'function') { el.focus(); }
  }

  function onTabClick(ev) {
    var id = ev.currentTarget.getAttribute('data-tab-id');
    activateTab(id);
  }

  function onTablistKeydown(ev) {
    var idx = TAB_ORDER.indexOf(activeTab);
    var nextId = null;
    if (ev.key === 'ArrowRight') {
      nextId = TAB_ORDER[(idx + 1) % TAB_ORDER.length];
    } else if (ev.key === 'ArrowLeft') {
      nextId = TAB_ORDER[(idx - 1 + TAB_ORDER.length) % TAB_ORDER.length];
    } else if (ev.key === 'Home') {
      nextId = TAB_ORDER[0];
    } else if (ev.key === 'End') {
      nextId = TAB_ORDER[TAB_ORDER.length - 1];
    } else if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
      ev.preventDefault();
      activateTab(activeTab);
      return;
    } else {
      return;
    }
    ev.preventDefault();
    activateTab(nextId);
    focusTab(nextId);
  }

  function setRange(weeksRaw) {
    var weeks = parseInt(weeksRaw, 10);
    if (weeks !== 4 && weeks !== 8 && weeks !== 12) { return; }
    rangeWeeks = weeks;
    var btns = document.querySelectorAll('.hz-filtro-btn');
    for (var i = 0; i < btns.length; i++) {
      var w = parseInt(btns[i].getAttribute('data-weeks'), 10);
      btns[i].setAttribute('aria-pressed', (w === weeks) ? 'true' : 'false');
    }
    for (var j = 0; j < rangeListeners.length; j++) {
      rangeListeners[j](rangeWeeks);
    }
  }

  Herzon.filters = {
    getRange: function () { return rangeWeeks; },
    onRangeChange: function (cb) {
      if (typeof cb === 'function') { rangeListeners.push(cb); }
    }
  };

  Herzon.theme = {
    get: function () {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'dark' || attr === 'light') { return attr; }
      var prefersDark = (typeof window.matchMedia === 'function') &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      return prefersDark ? 'dark' : 'light';
    },
    set: function (t) {
      if (t !== 'dark' && t !== 'light') { return; }
      document.documentElement.setAttribute('data-theme', t);
      var btn = document.getElementById('toggle-tema');
      if (btn) { btn.setAttribute('aria-pressed', (t === 'dark') ? 'true' : 'false'); }
    }
  };

  function onToggleTemaClick() {
    var current = Herzon.theme.get();
    Herzon.theme.set(current === 'dark' ? 'light' : 'dark');
  }

  function wireHeaderFromData() {
    if (!G.HERZON_DATA) { return; }
    var data = G.HERZON_DATA;
    var pacienteEl = document.getElementById('hz-paciente-nombre');
    if (pacienteEl && data.paciente && data.paciente.nombre) {
      pacienteEl.textContent = data.paciente.nombre;
    }
    var periodoEl = document.getElementById('hz-periodo');
    if (periodoEl && data.meta && data.meta.periodoSemanas) {
      periodoEl.textContent = 'Período de seguimiento: ' + data.meta.periodoSemanas + ' semanas';
    }
  }

  Herzon.boot = function () {
    for (var i = 0; i < TAB_ORDER.length; i++) {
      var id = TAB_ORDER[i];
      var tabEl = document.getElementById('tab-' + id);
      if (tabEl) {
        tabEl.setAttribute('data-tab-id', id);
        tabEl.addEventListener('click', onTabClick);
      }
    }
    var tablistEl = document.querySelector('[role="tablist"]');
    if (tablistEl) { tablistEl.addEventListener('keydown', onTablistKeydown); }

    var filtroBtns = document.querySelectorAll('.hz-filtro-btn');
    for (var k = 0; k < filtroBtns.length; k++) {
      filtroBtns[k].addEventListener('click', function (ev) {
        setRange(ev.currentTarget.getAttribute('data-weeks'));
      });
    }

    var toggleBtn = document.getElementById('toggle-tema');
    if (toggleBtn) { toggleBtn.addEventListener('click', onToggleTemaClick); }

    wireHeaderFromData();
    activateTab(activeTab);
  };
})();
</script>

    var f = Math.pow(10, decimales || 0);
    return Math.round(n * f) / f;
  }

  function sumarCampo(lista, campo) {
    var total = 0;
    for (var i = 0; i < lista.length; i++) {
      total += lista[i][campo];
    }
    return redondear(total, 2);
  }

  function sumarArreglo(lista) {
    var total = 0;
    for (var i = 0; i < lista.length; i++) { total += lista[i]; }
    return total;
  }

  function promedio(lista) {
    return sumarArreglo(lista) / lista.length;
  }

  function formatoFecha(fechaBase, offsetDias) {
    var d = new Date(fechaBase.getTime());
    d.setUTCDate(d.getUTCDate() + offsetDias);
    var yyyy = d.getUTCFullYear();
    var mm = String(d.getUTCMonth() + 1).padStart(2, '0');

  function dividirEntreComidas(totalGramos, proporciones) {
    var partes = [];

    for (var i = 0; i < proporciones.length - 1; i++) {
      var parte = Math.round(totalGramos * proporciones[i]);

    for (var i = 0; i < momentos.length; i++) {

      var plantilla = lista[(numeroDia - 1 + i) % lista.length];

<script id="hz-charts">
// build/charts.js
// Herzon.Charts — librería SVG genérica hecha a mano, AGNOSTICA de datos: cada función
// recibe (contenedorEl, opciones) y devuelve el elemento raiz que creo. No conoce el
// objeto de datos global del prototipo en ninguna forma; el llamador decide que
// arrays y valores le pasa.
//
// Método: skill dataviz (marks-and-anatomy.md, interaction.md, anti-patterns.md) y
// .harness/design-contract-herzon.md secciones 2 y 3 (13 reglas duras). Namespaces y
// convenciones congeladas en .harness/plan.md sección 3.
//
// Preámbulo obligatorio (plan.md 3.A): script clásico, IIFE, sin import/export.
// Prohibido tocar `document` en el nivel superior del módulo: todo acceso al DOM ocurre
// dentro de funciones, usando `contenedorEl.ownerDocument` (funciona igual en el navegador
// real y contra el TestDOM headless de build/testdom.js).
//

  G.Herzon.Charts = G.Herzon.Charts || {};
  var Charts = G.Herzon.Charts;

  var GAP_SEPARADOR = 2;      // regla 5: gap de 2px color superficie
  var GROSOR_MAX_BARRA = 24;  // regla 4: barra <= 24px de grosor

  var HIT_MINIMO = 24;        // regla 10: zona de hit >= 24px

  // de ancho de texto. Se fijan por atributo SVG (no son color: no violan la

  var TAMANO_FUENTE_EJE = 11;       // ticks y categorías de eje
  var TAMANO_FUENTE_ETIQUETA = 12;  // etiquetas de valor de punta
  var FACTOR_ANCHO_CARACTER = 0.62; // D2: ancho estimado por carácter, sin medición real de DOM

  // QA ronda 3 (a): colisión de labels de categoría en el eje X de apilada100/barras

  var ROTACION_ETIQUETA_X_GRADOS = 35;   // rotación cuando el label no cabe horizontal
  var MARGEN_ABAJO_CATEGORIA_BASE = 40;  // margen inferior sin rotar (comportamiento previo)
  var PADDING_ETIQUETA_CATEGORIA = 6;    // aire mínimo entre etiquetas de categoría vecinas

  var GUTTER_IZQUIERDO_PROPORCION_MAX = 0.40; // tope: hasta ~40% del ancho del chart
  var GUTTER_IZQUIERDO_MIN = 60;               // piso razonable para el gutter de labels
  var PADDING_GUTTER_IZQUIERDO = 16;           // aire entre el texto del gutter y el eje

  // menos de una linea de texto de distancia vertical (caso real: plicometria S12,
  // Subescapular 20mm vs Suprailiaco 21mm en escala 0-40, ~5.8px entre centros --
  // root cause del triple rechazo de T-018, ver nota REJECTED de las 11:26 en
  // .harness/tasks/T-018.json). ALTURA_MINIMA_ETIQUETA_PUNTA es la separación
  // vertical mínima entre labels; UMBRAL_LINEA_GUIA es el desplazamiento a partir
  // del cual el label queda visualmente desconectado de su punto y se traza una
  // linea guia (marks-and-anatomy.md, sección "Labels & legend": "When end-labels

  var ALTURA_MINIMA_ETIQUETA_PUNTA = 12;
  var UMBRAL_LINEA_GUIA = 4;

  // ---------------------------------------------------------------------
  // Utilidades internas puras (sin DOM)
  // ---------------------------------------------------------------------

  function tokenSerie(indice) {

    return 'var(--series-' + i + ')';
  }

  function formatearNumero(v) {
    if (typeof v !== 'number' || isNaN(v)) return '';

    var negativo = redondeado < 0;
    var abs = Math.abs(redondeado);
    var partes = String(abs).split('.');
    var entero = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var resultado = entero + (partes[1] ? '.' + partes[1] : '');
    return (negativo ? '-' : '') + resultado;
  }

  // Genera `cantidad` ticks equiespaciados entre yMin y yMax. Por construcción,
  // ticks[0] === yMin y ticks[último] === yMax exactamente (regla 3: eje forzable).

    cantidad = cantidad || 5;
    if (cantidad < 2) cantidad = 2;
    var ticks = [];
    for (var i = 0; i < cantidad; i++) {
      ticks.push(yMin + (yMax - yMin) * (i / (cantidad - 1)));
    }
    return ticks;
  }

  // Etiquetado directo selectivo (regla 7 / marks-and-anatomy.md): nunca todas las
  // marcas. Con <=6 puntos se muestran todas las etiquetas de eje; si hay más, solo
  // primero / medio / último.
  function seleccionarIndicesEtiquetas(n) {
    if (n <= 0) return [];
    if (n <= 6) {
      var todos = [];
      for (var i = 0; i < n; i++) todos.push(i);
      return todos;
    }
    var vistos = {};
    var resultado = [];
    [0, Math.floor((n - 1) / 2), n - 1].forEach(function (v) {
      if (!vistos[v]) { vistos[v] = true; resultado.push(v); }
    });
    resultado.sort(function (a, b) { return a - b; });
    return resultado;
  }

  function indiceDelMaximo(arr) {
    if (!arr || !arr.length) return -1;
    var idx = 0;
    for (var i = 1; i < arr.length; i++) {
      if (typeof arr[i] === 'number' && arr[i] > arr[idx]) idx = i;
    }
    return idx;
  }

  function construirTablaAutomatica(etiquetas, series, etiquetaColumna) {
    var columnas = [etiquetaColumna || 'Categoría'];
    for (var i = 0; i < series.length; i++) columnas.push(series[i].nombre || ('Serie ' + (i + 1)));
    var filas = [];
    for (var f = 0; f < etiquetas.length; f++) {
      var fila = [etiquetas[f]];
      for (var s = 0; s < series.length; s++) {
        var datos = series[s].datos || [];
        fila.push(datos[f]);
      }
      filas.push(fila);
    }

  }

  var _contadorId = 0;
  function idUnico(prefijo) {
    _contadorId += 1;
    return (prefijo || 'hz') + '-' + _contadorId;
  }

  // D3 (QA ronda 1): usar el ancho real del contenedor (clientWidth al momento
  // del render) en vez de un viewBox fijo escalado por CSS width:100%, que es la
  // causa raíz de que las fuentes en unidades de viewBox se vean microscópicas en
  // contenedores angostos (small multiples, cards de 4 columnas): si el viewBox
  // declara 640 y el navegador lo comprime a ~285px reales, todo texto interno
  // se encoge por el mismo factor sin importar el font-size declarado. Igualando
  // el ancho del viewBox al ancho real renderizado, la escala queda en 1:1 y el
  // font-size en unidades SVG equivale a px físicos. Si no hay layout real
  // (TestDOM headless de los selfchecks no implementa clientWidth) se conserva
  // el comportamiento previo: opciones.ancho o el valor por defecto.
  function anchoDeRenderizado(contenedorEl, anchoOpciones, porDefecto) {
    var medido = contenedorEl && contenedorEl.clientWidth;
    if (typeof medido === 'number' && medido > 0) return Math.round(medido);
    if (typeof anchoOpciones === 'number' && anchoOpciones > 0) return anchoOpciones;
    return porDefecto;
  }

  // D2 (QA ronda 1): estimación pura (sin DOM, sin medición real de texto) del
  // ancho físico de una etiqueta, para poder reservar margen suficiente y no
  // recortar el label de punta contra el borde del viewBox. Calibrada para
  // digitos tabulares en tipografia sans-serif (deliberadamente conservadora:
  // sobreestimar el margen es preferible a recortar texto).
  function estimarAnchoTexto(texto, tamanoFuente) {
    var cadena = texto == null ? '' : String(texto);
    var tamano = tamanoFuente || TAMANO_FUENTE_ETIQUETA;
    return cadena.length * tamano * FACTOR_ANCHO_CARACTER;
  }

  // QA-R3 (a): cuando el ancho estimado de las etiquetas de categoría del eje X no cabe
  // horizontalmente en el espacio de su propia banda, se rotan ~35 grados (text-anchor end)
  // en vez de quedar encimadas contra la banda vecina. La decisión es GLOBAL a la gráfica
  // (todas rotan o ninguna) para que el eje quede legible de forma consistente, y nunca se
  // dibuja un número encima de cada punto como alternativa.
  function calcularRotacionEtiquetasX(categorias, anchoBanda) {
    var anchoMaximo = 0;
    for (var i = 0; i < categorias.length; i++) {
      var w = estimarAnchoTexto(categorias[i], TAMANO_FUENTE_EJE);
      if (w > anchoMaximo) anchoMaximo = w;
    }
    var rotar = anchoBanda > 0 && anchoMaximo > (anchoBanda - PADDING_ETIQUETA_CATEGORIA);
    var margenAbajo = MARGEN_ABAJO_CATEGORIA_BASE;
    if (rotar) {
      var radianes = ROTACION_ETIQUETA_X_GRADOS * Math.PI / 180;
      var extensionVertical = anchoMaximo * Math.sin(radianes);
      margenAbajo = Math.max(MARGEN_ABAJO_CATEGORIA_BASE, Math.min(130, Math.round(extensionVertical + 26)));
    }
    return { rotar: rotar, margenAbajo: margenAbajo };
  }

  // Dibuja una etiqueta de categoría del eje X: centrada y horizontal cuando cabe; si no,
  // rotada ~35 grados con text-anchor end (regla dura QA-R3 a: prohibido dejarlas encimadas).
  function dibujarEtiquetaCategoriaX(doc, svg, xCentro, yBase, texto, rotar) {
    var cadena = texto == null ? '' : String(texto);

      ? {
          x: xCentro, y: yBase, 'text-anchor': 'end', 'font-size': String(TAMANO_FUENTE_EJE),
          transform: 'rotate(-' + ROTACION_ETIQUETA_X_GRADOS + ' ' + xCentro + ' ' + yBase + ')'
        }
      : { x: xCentro, y: yBase, 'text-anchor': 'middle', 'font-size': String(TAMANO_FUENTE_EJE) };

  // QA-R3 (b): trunca con elipsis SIEMPRE al final del texto (nunca por el inicio) cuando
  // ni el gutter máximo alcanza para el label completo. Estimación pura de caracteres,
  // consistente con estimarAnchoTexto (D2): mismo método, sin medición real de DOM.
  function truncarConElipsisFinal(texto, anchoDisponible, tamanoFuente) {
    var cadena = texto == null ? '' : String(texto);
    if (estimarAnchoTexto(cadena, tamanoFuente) <= anchoDisponible) return cadena;
    var ELIPSIS = '…';
    var anchoPorCaracter = tamanoFuente * FACTOR_ANCHO_CARACTER;
    var anchoDisponibleTexto = anchoDisponible - estimarAnchoTexto(ELIPSIS, tamanoFuente);
    if (anchoDisponibleTexto <= 0) return ELIPSIS;
    var maxCaracteres = Math.max(1, Math.floor(anchoDisponibleTexto / anchoPorCaracter));

  // T-025: recibe una lista de puntos `{cx, cy, ...}` de labels de punta EN
  // CUALQUIER orden y devuelve la MISMA lista con la propiedad `yEtiqueta`
  // anadida a cada objeto (mutación in-place, para que el llamador conserve las
  // demas propiedades del punto). Algoritmo: se agrupan en clusters de colisión
  // por adyacencia en Y (ordenados ascendente); cada cluster de 2+ se reparte
  // simetricamente centrado en el promedio de sus valores originales -- el label
  // superior sube, el inferior baja, en cascada si son 3+ -- separados
  // exactamente `alturaMinima`, y el cluster completo se acota al area vertical
  // disponible (`limiteArriba`..`limiteAbajo`) sin romper el espaciado interno. Un
  // punto sin colisión (cluster de tamaño 1) conserva `yEtiqueta === cy` (cero
  // desplazamiento).
  function resolverColisionesEtiquetasPunta(puntos, limiteArriba, limiteAbajo, alturaMinima) {
    var orden = puntos.slice().sort(function (a, b) { return a.cy - b.cy; });
    var n = orden.length;
    if (!n) return puntos;

    var clusters = [[orden[0]]];
    for (var i = 1; i < n; i++) {
      if (orden[i].cy - orden[i - 1].cy < alturaMinima) {
        clusters[clusters.length - 1].push(orden[i]);
      } else {
        clusters.push([orden[i]]);
      }
    }

    clusters.forEach(function (cluster) {
      if (cluster.length === 1) {
        cluster[0].yEtiqueta = cluster[0].cy;
        return;
      }
      var suma = 0;
      for (var k = 0; k < cluster.length; k++) suma += cluster[k].cy;
      var centro = suma / cluster.length;
      var extension = (cluster.length - 1) * alturaMinima;
      var inicio = centro - extension / 2;
      if (limiteArriba != null && inicio < limiteArriba) inicio = limiteArriba;
      if (limiteAbajo != null && inicio + extension > limiteAbajo) inicio = limiteAbajo - extension;
      if (limiteArriba != null && inicio < limiteArriba) inicio = limiteArriba;
      for (var j = 0; j < cluster.length; j++) cluster[j].yEtiqueta = inicio + j * alturaMinima;

  function crearSVG(doc, tag, attrs) {

      }
    }
    return elemento;
  }

  function crearHTML(doc, tag, attrs) {
    var elemento = doc.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, k)) {

        }
      }
    }

  // dos esquinas superiores redondeadas (regla 4: "punta redondeada, base cuadrada").
  function construirBarraVertical(doc, x, y, ancho, alturaBarra, radio) {
    var r = Math.max(0, Math.min(radio, ancho / 2, alturaBarra));
    var d = 'M ' + x + ',' + (y + alturaBarra) +
      ' L ' + x + ',' + (y + r) +
      ' Q ' + x + ',' + y + ' ' + (x + r) + ',' + y +
      ' L ' + (x + ancho - r) + ',' + y +
      ' Q ' + (x + ancho) + ',' + y + ' ' + (x + ancho) + ',' + (y + r) +
      ' L ' + (x + ancho) + ',' + (y + alturaBarra) +
      ' Z';

    var r = Math.max(0, Math.min(radio, alto / 2, anchoBarra));
    var d = 'M ' + x + ',' + y +
      ' L ' + (x + anchoBarra - r) + ',' + y +
      ' Q ' + (x + anchoBarra) + ',' + y + ' ' + (x + anchoBarra) + ',' + (y + r) +
      ' L ' + (x + anchoBarra) + ',' + (y + alto - r) +
      ' Q ' + (x + anchoBarra) + ',' + (y + alto) + ' ' + (x + anchoBarra - r) + ',' + (y + alto) +
      ' L ' + x + ',' + (y + alto) +
      ' Z';
    var path = crearSVG(doc, 'path', { d: d, 'data-grosor': String(Math.round(alto * 100) / 100) });
    path.style.stroke = 'none';
    return path;
  }

  // Leyenda: identidad de color siempre por swatch, nunca por texto coloreado
  // (regla 8). Usada como primitiva pública y como pieza interna de otras gráficas.
  function construirLeyenda(doc, contenedorEl, series) {
    var raiz = crearHTML(doc, 'div');
    raiz.classList.add('hz-legend');
    raiz.setAttribute('role', 'list');
    for (var i = 0; i < series.length; i++) {
      var item = crearHTML(doc, 'div');
      item.classList.add('hz-legend-item');
      item.setAttribute('role', 'listitem');

      var swatch = crearHTML(doc, 'span');
      swatch.classList.add('hz-legend-swatch');
      swatch.style.backgroundColor = series[i].color || tokenSerie(i);

      var etiqueta = crearHTML(doc, 'span');
      etiqueta.textContent = series[i].nombre || '';

      item.appendChild(swatch);
      item.appendChild(etiqueta);
      raiz.appendChild(item);
    }
    contenedorEl.appendChild(raiz);
    return raiz;
  }

  // Toggle "Ver tabla" + tabla equivalente (regla 9, regla de relieve del contrato).
  function construirTablaToggle(doc, contenedorEl, especTabla) {

    var filas = especTabla.filas || [];
    var idWrap = idUnico('hz-tabla');

    var raiz = crearHTML(doc, 'div');

    boton.setAttribute('aria-expanded', 'false');

    wrap.setAttribute('hidden', '');

    tabla.classList.add('hz-table');

    var thead = crearHTML(doc, 'thead');
    var trEncabezado = crearHTML(doc, 'tr');

      th.setAttribute('scope', 'col');
      th.textContent = columnas[c] == null ? '' : String(columnas[c]);
      trEncabezado.appendChild(th);
    }
    thead.appendChild(trEncabezado);
    tabla.appendChild(thead);

    var tbody = crearHTML(doc, 'tbody');
    for (var f = 0; f < filas.length; f++) {
      var tr = crearHTML(doc, 'tr');
      var fila = filas[f];
      for (var i = 0; i < fila.length; i++) {
        var esPrimera = i === 0;
        var celda = crearHTML(doc, esPrimera ? 'th' : 'td');
        if (esPrimera) celda.setAttribute('scope', 'row');
        else celda.style.fontVariantNumeric = 'tabular-nums';
        var valor = fila[i];
        celda.textContent = (valor === null || valor === undefined) ? '' : String(valor);
        tr.appendChild(celda);
      }
      tbody.appendChild(tr);
    }

    wrap.appendChild(tabla);

      var expandidoAhora = boton.getAttribute('aria-expanded') === 'true';
      var nuevoExpandido = !expandidoAhora;
