          var AlmacenReco = G.Herzon.Almacen;
          if (AlmacenReco && typeof AlmacenReco.modo === 'function' && AlmacenReco.modo() === 'real') {
            var planElegidoParaGuardar = planPorId(HERZON_DATA, idElegido);
            AlmacenReco.guardarPlan({
              plantillaId: idElegido,

            });
          }
          renderRanking();
          renderPlanAplicado();
          refrescarVistaPrincipal();
        });
        razones.appendChild(botonUsar);

        listaRanking.appendChild(item);
      }

    // --- 4. Modificable: kcal objetivo manual + escala de porciones ---
    var accionesModificar = crearHTML(doc, 'div');

    var campoKcalManual = crearCampoInput(

    // R6 (prod-8): el valor vivo de la escala se muestra JUNTO a su

    var campoEscalaDiv = crearHTML(doc, 'div');

    campoEscalaDiv.appendChild(etiquetaEscala);
    campoEscalaDiv.appendChild(inputEscala);

    var campoEscala = { campo: campoEscalaDiv, input: inputEscala };

    function actualizarEtiquetaEscala(valorNum) {
      etiquetaEscala.textContent = 'Escala de porciones: ' + formatoEscala(valorNum);
    }
    actualizarEtiquetaEscala(1);

    campoKcalManual.input.addEventListener('change', function (evento) {
      var valorTexto = evento.target.value;
      if (valorTexto === '' || valorTexto === null || valorTexto === undefined) {
        est.kcalManual = null;
      } else {
        var valorNum = parseFloat(valorTexto);
        est.kcalManual = isNaN(valorNum) ? null : redondear(valorNum);
      }
      renderPlanAplicado();
    });

    campoEscala.input.addEventListener('input', function (evento) {
      var valorNum = parseFloat(evento.target.value);
      if (isNaN(valorNum)) valorNum = 1;
      valorNum = Math.max(0.8, Math.min(1.2, valorNum));
      est.escalaPorciones = valorNum;
      actualizarEtiquetaEscala(valorNum);
      renderPlanAplicado();
      refrescarVistaPrincipal();

    // --- 5. Plantilla aplicada: macros mostrados recalculados en vivo ---
    var notaAplicado = crearHTML(doc, 'p');
    notaAplicado.classList.add('hz-nota');
    contenedorReco.appendChild(notaAplicado);

    var resumenAplicado = crearHTML(doc, 'div');
    resumenAplicado.classList.add('hz-reco-resumen');
    contenedorReco.appendChild(resumenAplicado);

    var statPlanAplicado = crearStat(doc, resumenAplicado, 'Plantilla aplicada');
    var statKcalAplicado = crearStat(doc, resumenAplicado, 'Kcal objetivo (aplicado)');
    var statProteinaAplicada = crearStat(doc, resumenAplicado, 'Proteína (g)');
    var statCarbohidratoAplicado = crearStat(doc, resumenAplicado, 'Carbohidrato (g)');
    var statGrasaAplicada = crearStat(doc, resumenAplicado, 'Grasa (g)');

    function renderPlanAplicado() {
      var activo = G.Herzon.planActivo();
      statPlanAplicado.num.textContent = activo.plan.nombre;
      statKcalAplicado.num.textContent = formatearEntero(activo.kcalObjetivo) + ' kcal';
      statProteinaAplicada.num.textContent = activo.macros.proteina_g + ' g';
      statCarbohidratoAplicado.num.textContent = activo.macros.carbohidrato_g + ' g';
      statGrasaAplicada.num.textContent = activo.macros.grasa_g + ' g';
      notaAplicado.textContent = 'Con la escala de porciones en ' + formatoEscala(activo.escalaPorciones) +
        ', esta es la plantilla actualmente aplicada al menú del día.';
    }

    botonCalcular.addEventListener('click', function () {
      // R6 (prod-4): limpia marcas de una validación previa antes de
      // revisar de nuevo -- si el usuario ya corrigió el campo, no debe
      // quedar pintado en rojo aunque el resto siga vigente.
      CAMPOS_NUMERICOS_VALIDABLES.forEach(function (campo) {
        campo.input.style.borderColor = '';
        campo.input.removeAttribute('aria-invalid');
      });
      var invalidos = validarCamposNumericos();
      if (invalidos.length) {
        invalidos.forEach(function (campo) {
          campo.input.style.borderColor = 'var(--delta-bad)';
          campo.input.setAttribute('aria-invalid', 'true');
        });
        notaValidacion.textContent = 'Revisa el campo ' +
          invalidos.map(function (campo) { return campo.etiqueta; }).join(', ') +
          ' antes de calcular: debe ser un número mayor que cero. No se recalculó.';
        return;
      }
      notaValidacion.textContent = '';
      leerPerfilDeFormulario();
      recalcularNecesidadesYRanking(est);
      renderNecesidades();
      renderRanking();
      renderPlanAplicado();
    });

    // Primer pintado: el formulario ya viene precargado con el perfil y
    // obtenerRecoEstado() ya calculó necesidades/ranking de forma perezosa.
    renderNecesidades();
    renderRanking();
    renderPlanAplicado();
  }

  function montarVistaPlan(rootEl) {
    var doc = rootEl.ownerDocument;
    var HERZON_DATA = G.HERZON_DATA;
    var Charts = G.Herzon.Charts;
    var planes = HERZON_DATA.planes;

    var opcionesObjetivo = derivarOpciones(planes, 'objetivo').map(function (v) {
      return { valor: v, etiqueta: ETIQUETAS_OBJETIVO[v] || v };
    });
    var opcionesRestriccion = derivarOpciones(planes, 'restriccion').map(function (v) {
      return { valor: v, etiqueta: ETIQUETAS_RESTRICCION[v] || v };
    });

    // R6 (prod-2): objetivo/restricción se guardan también en el estado
    // compartido del recomendador (obtenerRecoEstado().filtroObjetivo/
    // filtroRestriccion), para que Herzon.planActivo() resuelva la MISMA
    // plantilla que esta card en modo automático (ver planSeleccionadoActivo).
    // derivarOpciones(planes, campo)[0] es la misma cuenta que usa
    // crearRecoEstadoInicial(), así que ambos arrancan coincidiendo.
    var recoEstInicial = obtenerRecoEstado();
    var estado = {
      objetivo: recoEstInicial.filtroObjetivo || opcionesObjetivo[0].valor,
      restriccion: recoEstInicial.filtroRestriccion || opcionesRestriccion[0].valor,
      dia: 1
    };
    recoEstInicial.filtroObjetivo = estado.objetivo;
    recoEstInicial.filtroRestriccion = estado.restriccion;

    var grid = crearHTML(doc, 'div');
    grid.classList.add('hz-grid');
    rootEl.appendChild(grid);

    // --- Hero: exactamente UN número héroe por vista (regla 11) ---
    var cardHero = crearCard(doc, grid, 'Plan de dieta actual');
    var hero = crearHero(doc, cardHero, 'Calorías objetivo del plan (kcal / día)');
    var notaPlan = crearHTML(doc, 'p');
    notaPlan.classList.add('hz-nota');
    cardHero.appendChild(notaPlan);
    // R8 punto 4 / R9 MC-07: estado vacío (modo real sin plantilla
    // aplicada) -- nodo oculto por defecto; render() alterna la visibilidad
    // contra notaPlan (nunca ambos visibles a la vez).
    var notaVaciaHero = crearHTML(doc, 'p');
    notaVaciaHero.classList.add('hz-vacio');
    notaVaciaHero.setAttribute('hidden', '');
    notaVaciaHero.textContent = TEXTO_VACIO_PLAN;
    cardHero.appendChild(notaVaciaHero);

    // --- Formulario mínimo (.hz-form): objetivo + restricción/alergia ---
    var cardForm = crearCard(doc, grid, 'Personaliza tu plan');
    // R6 (prod-6): mientras el recomendador tenga una plantilla fijada a
    // mano, esta nota lo deja explícito aquí mismo (textContent); se retira
    // sola en cuanto el usuario vuelve al modo automático (cambia objetivo
    // o restricción, lo que limpia planIdSeleccionado -- ver render()).
    var notaPlantillaFijada = crearHTML(doc, 'p');
    notaPlantillaFijada.classList.add('hz-nota');
    cardForm.appendChild(notaPlantillaFijada);
    var form = crearHTML(doc, 'form');
    form.classList.add('hz-form');
    cardForm.appendChild(form);

    var campoObjetivo = crearCampoSelect(doc, form, 'hz-plan-objetivo', 'Objetivo', opcionesObjetivo);
    var campoRestriccion = crearCampoSelect(doc, form, 'hz-plan-restriccion', 'Restricción o alergia', opcionesRestriccion);
    var campoDia = crearCampoSelect(doc, form, 'hz-plan-dia', 'Día del plan (detalle)', [1, 2, 3, 4, 5, 6, 7].map(function (d) {
      return { valor: String(d), etiqueta: 'Día ' + d };
    }));

    campoObjetivo.select.value = estado.objetivo;
    campoRestriccion.select.value = estado.restriccion;
    campoDia.select.value = String(estado.dia);

    // --- Gráficas: macros por comida (apilada100) y calorías por día (barras),
    // agrupadas en UNA sola card con grid anidado (mismo patrón que la card
    // "Laboratorios en 3 cortes" de vista_metricas.js). R9 (LY-03): esta
    // card sale del grid superior y se monta como HERMANA directa de `grid`
    // bajo rootEl (mismo patrón ya bendecido de #reco-plan/hz-menu-fila),
    // ANTES de "Menú del día" -- el grid superior queda con EXACTAMENTE 2
    // hijos (héroe + formulario), que a 1240px resuelven 2 columnas de
    // ~570px sin hueco muerto; el gridGraficas anidado de esta card resuelve
    // 2 columnas propias (macros por comida y calorías por día lado a lado),
    // en vez de comprimirse a 1 columna en la pista más angosta del grid
    // superior (el defecto que LY-03 corrige). ---
    var cardGraficas = crearCard(doc, rootEl, 'Gráficas del plan');
    var gridGraficas = crearHTML(doc, 'div');
    gridGraficas.classList.add('hz-grid');
    cardGraficas.appendChild(gridGraficas);

    var contMacros = crearHTML(doc, 'div');
    gridGraficas.appendChild(contMacros);

    var contKcal = crearHTML(doc, 'div');
    gridGraficas.appendChild(contKcal);

    // R8 punto 4 / R9 MC-07: estado vacío -- sustituye las 2 gráficas
    // cuando el cliente real aún no tiene una plantilla aplicada.
    var notaVaciaGraficas = crearHTML(doc, 'p');
    notaVaciaGraficas.classList.add('hz-vacio');
    notaVaciaGraficas.setAttribute('hidden', '');
    notaVaciaGraficas.textContent = TEXTO_VACIO_PLAN;
    cardGraficas.appendChild(notaVaciaGraficas);

    // --- Menú del día (Adendum R4): fila de ancho completo, el menú como
    // protagonista de la vista (feedback ronda 4 de Mario). Vive FUERA del
    // grid superior, como hermano directo de `grid` bajo rootEl (.hz-vista,
    // ya congelado en shell.html: display:flex; flex-direction:column;
    // gap:20px), DESPUÉS de "Gráficas del plan" (R9, LY-03: orden vertical
    // final de la vista: #reco-plan, grid héroe+formulario, gráficas, menú
    // del día). Dentro de un CSS grid auto-fit, una card que abarca
    // grid-column:1/-1 "usa" todas las columnas en su propia fila, así que
    // ninguna queda vacía en TODAS las filas del grid y auto-fit no las
    // colapsa -- eso es precisamente lo que dejaba una card sola con
    // columnas vacías al lado (hueco muerto medido por el verifier de R4).
    // Como hermano de `grid` (no hijo), el menú no participa del cálculo de
    // columnas del grid superior en ningún ancho. ---
    var cardDetalle = crearCard(doc, rootEl, 'Menú del día');
    cardDetalle.classList.add('hz-menu-fila');
    var listaMenu = crearHTML(doc, 'div');
    listaMenu.classList.add('hz-menu-lista');
    cardDetalle.appendChild(listaMenu);

    // R8 punto 4 / R9 MC-07: estado vacío -- sustituye el listado de comidas
    // cuando el cliente real aún no tiene una plantilla aplicada.
    var notaVaciaMenu = crearHTML(doc, 'p');
    notaVaciaMenu.classList.add('hz-vacio');
    notaVaciaMenu.setAttribute('hidden', '');
    notaVaciaMenu.textContent = TEXTO_VACIO_PLAN;
    cardDetalle.appendChild(notaVaciaMenu);

    function render() {
      // R6 (prod-2): hero, gráficas, filas del menú y total del día derivan
      // TODOS de Herzon.planActivo() -- única fuente de verdad, compartida
      // con el panel del recomendador (renderPlanAplicado), así que las
      // cifras en pantalla ya no pueden contradecirse entre secciones. El
      // recomendador (Adendum R5, T-022) puede fijar una plantilla a mano
      // (botón "Usar este plan" en #reco-plan); mientras esa selección
      // exista, planActivo() la respeta (Adendum R5 punto 4); si no, cae en
      // la MISMA plantilla que resuelve la card "Personaliza tu plan"
      // (planSeleccionadoActivo, sincronizada más abajo).
      var recoEst = obtenerRecoEstado();

      // R8 punto 4 / R9 MC-07: estado vacío -- en modo real, mientras el
      // cliente activo no tenga una plantilla APLICADA (guardada vía
      // Herzon.Almacen.guardarPlan, HERZON_DATA.planAplicado === null), no
      // se muestra un plan "automático" como si fuera el suyo: se invita al
      // recomendador (#reco-plan, que se mantiene SIEMPRE visible y
      // funcional más abajo, fuera de este gate). En demo, Herzon.Almacen no
      // existe o reporta 'demo' y HERZON_DATA.planAplicado nunca existe
      // (undefined): esta rama nunca se toma, cero cambios de comportamiento.
      var AlmacenPlan = G.Herzon.Almacen;
      var enModoRealPlan = !!(AlmacenPlan && typeof AlmacenPlan.modo === 'function' && AlmacenPlan.modo() === 'real');
      var sinPlanAplicado = enModoRealPlan && (G.HERZON_DATA.planAplicado === null || G.HERZON_DATA.planAplicado === undefined);

      if (sinPlanAplicado) {
        rootEl.removeAttribute('data-plan-id');
        hero.num.textContent = '—';
        limpiar(notaPlan);
        notaPlan.setAttribute('hidden', '');
        notaVaciaHero.removeAttribute('hidden');
        notaPlantillaFijada.textContent = '';

        gridGraficas.setAttribute('hidden', '');
        notaVaciaGraficas.removeAttribute('hidden');
        limpiar(contMacros);
        limpiar(contKcal);

        listaMenu.setAttribute('hidden', '');
        notaVaciaMenu.removeAttribute('hidden');
        limpiar(listaMenu);
        return;
      }

      notaPlan.removeAttribute('hidden');
      notaVaciaHero.setAttribute('hidden', '');
      gridGraficas.removeAttribute('hidden');
      notaVaciaGraficas.setAttribute('hidden', '');
      listaMenu.removeAttribute('hidden');
      notaVaciaMenu.setAttribute('hidden', '');

      var activo = G.Herzon.planActivo();
      var plan = activo.plan;
      var escala = activo.escalaPorciones;
      rootEl.setAttribute('data-plan-id', plan.id);

      // prod-6: nota de plantilla fijada, SOLO mientras haya una elección
      // explícita del recomendador; se retira (textContent vacío) en modo
      // automático.
      if (recoEst.planIdSeleccionado) {
        notaPlantillaFijada.textContent = 'Plantilla fijada desde el recomendador: ' + plan.nombre +
          '. Cambia objetivo o restricción aquí abajo para volver al modo automático.';
      } else {
        notaPlantillaFijada.textContent = '';
      }

      var diaIdx = Math.max(1, Math.min(plan.dias.length, estado.dia)) - 1;
      var diaData = plan.dias[diaIdx];
      // "El menú escalado" (prod-2): cada comida del día se multiplica por
      // escalaPorciones -- hero, gráficas y menú comparten estos mismos
      // números escalados, incluso con kcalManual fijado (ese override es
      // solo el objetivo mostrado en el panel del recomendador; aquí se
      // muestra lo que la comida REAL, ya escalada, realmente suma).
      var comidasEscaladas = diaData.comidas.map(function (c) {
        return {
          hora: c.hora,
          momento: c.momento,
          nombre: c.nombre,
          kcal: c.kcal * escala,
          proteina_g: c.proteina_g * escala,
          carbohidrato_g: c.carbohidrato_g * escala,
          grasa_g: c.grasa_g * escala
        };
      });
      var totalKcalEscalado = comidasEscaladas.reduce(function (acc, c) { return acc + c.kcal; }, 0);
      var totalProteinaEscalada = comidasEscaladas.reduce(function (acc, c) { return acc + c.proteina_g; }, 0);
      var totalCarbohidratoEscalado = comidasEscaladas.reduce(function (acc, c) { return acc + c.carbohidrato_g; }, 0);
      var totalGrasaEscalada = comidasEscaladas.reduce(function (acc, c) { return acc + c.grasa_g; }, 0);

      hero.num.textContent = formatearEntero(totalKcalEscalado);
      limpiar(notaPlan);
      notaPlan.textContent = plan.nombre + ' (escala ' + formatoEscala(escala) + ') — el menú del día ' + diaData.dia +
        ' suma ' + formatearEntero(totalKcalEscalado) + ' kcal/día (proteína ' + formatearEntero(totalProteinaEscalada) +
        ' g, carbohidrato ' + formatearEntero(totalCarbohidratoEscalado) + ' g, grasa ' + formatearEntero(totalGrasaEscalada) + ' g).';

      var categoriasComida = comidasEscaladas.map(function (c) { return NOMBRES_MOMENTO[c.momento] || c.momento; });
      // R9 (DV-01): índice de la comida principal ("Comida", la de mayor
      // kcal del día) dentro de categoriasComida -- la única columna que
      // conserva sus 3 etiquetas de % (saillance: una columna ejemplar en
      // vez de 15 rótulos casi idénticos; leyenda + tooltip + "Ver tabla"
      // cubren el resto).
      var indiceComidaPrincipal = categoriasComida.indexOf('Comida');

      limpiar(contMacros);
      Charts.apilada100(contMacros, {
        // La card contenedora ahora es "Gráficas del plan" (agrupa las 2
        // gráficas, corrección R4): el título visible propio de esta gráfica
        // ya NO duplica el heading de su card (D5 sigue cumplido, ver
        // selfcheck_vistas_a.js sección 3-bis).
        titulo: 'Macronutrientes por comida (día seleccionado)',
        tituloAccesible: 'Distribución de proteínas, carbohidratos y grasas por comida del día ' + diaData.dia,
        categorias: categoriasComida,
        series: [
          { nombre: 'Proteínas', color: 'var(--series-1)', datos: comidasEscaladas.map(function (c) { return c.proteina_g; }) },
          { nombre: 'Carbohidratos', color: 'var(--series-2)', datos: comidasEscaladas.map(function (c) { return c.carbohidrato_g; }) },
          { nombre: 'Grasas', color: 'var(--series-3)', datos: comidasEscaladas.map(function (c) { return c.grasa_g; }) }
        ],
        etiquetaColumna: 'Comida',
        tabla: true,
        // R6-fix (hallazgo data-7, T-035): la gráfica no mostraba ni un solo
        // valor legible sin abrir la tabla. etiquetasSegmento ya existe
        // verificada en Charts.apilada100 (T-027): % en cada segmento con
        // alto >= 14px, tinta de texto vía var(--text-primary), jamás color
        // de serie. Cableado quirúrgico: solo esta opción, nada más.
        etiquetasSegmento: true,
        // R9 (DV-01): restringe las etiquetas de % a la comida principal.
        // Ausente el índice (caso extremo sin ninguna comida "comida" en el
        // día), se omite la opción y se conserva el comportamiento actual
        // (todas las categorías elegibles).
        etiquetasSegmentoIndices: indiceComidaPrincipal !== -1 ? [indiceComidaPrincipal] : undefined
      });

      limpiar(contKcal);
      Charts.barras(contKcal, {
        // Idem: título visible propio, ya no duplica el heading de "Gráficas
        // del plan" (corrección R4). Escalado por el mismo factor que el
        // menú (prod-2): esta gráfica no puede contradecir el total de abajo.
        titulo: 'Calorías por día (semana del plan)',
        tituloAccesible: 'Calorías totales por cada día de la semana del plan ' + plan.nombre,
        categorias: plan.dias.map(function (d) { return 'Día ' + d.dia; }),
        series: [{ nombre: 'Calorías (kcal)', datos: plan.dias.map(function (d) { return d.totales.kcal * escala; }) }],
        etiquetaColumna: 'Día',
        tabla: true,
        // R9 (DV-03): dibuja el objetivo de kcal APLICADO (plantilla activa
        // ya escalada, o el override manual del recomendador) como umbral
        // explícito -- el reference exige dibujar el objetivo, no solo el
        // dato. unidad ya era una opción existente (Adendum R6 punto 2).
        referencia: { valor: activo.kcalObjetivo, etiqueta: 'Objetivo' },
        unidad: 'kcal'
      });

      limpiar(listaMenu);
      for (var mi = 0; mi < comidasEscaladas.length; mi++) {
        construirFilaMenuComida(doc, listaMenu, comidasEscaladas[mi]);
      }

      // Leyenda una sola vez (no por fila): colores por token, misma
      // asignación fija que la gráfica de macros por comida de arriba.
      Charts.leyenda(listaMenu, {
        series: [
          { nombre: 'Proteínas', color: 'var(--series-1)' },
          { nombre: 'Carbohidratos', color: 'var(--series-2)' },
          { nombre: 'Grasas', color: 'var(--series-3)' }
        ]
      });

      // Total del día, visible al pie del menú (escalado, prod-2).
      var filaTotal = crearHTML(doc, 'div');
      filaTotal.classList.add('hz-menu-total');
      var totalLabel = crearHTML(doc, 'span');
      totalLabel.classList.add('hz-menu-total-label');
      totalLabel.textContent = 'Total del día';
      var totalMacros = crearHTML(doc, 'span');
      totalMacros.classList.add('hz-menu-total-macros');
      totalMacros.textContent = 'Proteína ' + formatearEntero(totalProteinaEscalada) + ' g · Carbohidrato ' +
        formatearEntero(totalCarbohidratoEscalado) + ' g · Grasa ' + formatearEntero(totalGrasaEscalada) + ' g';
      var totalKcal = crearHTML(doc, 'span');
      totalKcal.classList.add('hz-menu-total-kcal');
      totalKcal.textContent = formatearEntero(totalKcalEscalado) + ' kcal';
      filaTotal.appendChild(totalLabel);
      filaTotal.appendChild(totalMacros);
      filaTotal.appendChild(totalKcal);
      listaMenu.appendChild(filaTotal);
    }

    campoObjetivo.select.addEventListener('change', function (evento) {
      estado.objetivo = evento.target.value;
      // Volver al emparejamiento automático: una elección explícita en la
      // card "Personaliza tu plan" reemplaza cualquier plantilla aplicada
      // a mano desde el recomendador. filtroObjetivo sincroniza esta card
      // con Herzon.planActivo() (prod-2).
      var recoEstCambio = obtenerRecoEstado();
      recoEstCambio.filtroObjetivo = estado.objetivo;
      recoEstCambio.planIdSeleccionado = null;
      render();
    });
    campoRestriccion.select.addEventListener('change', function (evento) {
      estado.restriccion = evento.target.value;
      var recoEstCambio = obtenerRecoEstado();
      recoEstCambio.filtroRestriccion = estado.restriccion;
      recoEstCambio.planIdSeleccionado = null;
      render();
    });
    campoDia.select.addEventListener('change', function (evento) {
      estado.dia = parseInt(evento.target.value, 10) || 1;
      render();
    });

    render();

    // --- Recomendador (Adendum R5, T-022): panel #reco-plan ---
    var contenedorReco = buscarHijoPorId(rootEl, 'reco-plan');
    if (!contenedorReco) {
      // Red de seguridad: en el shell real (build/shell.html, T-021) este
      // contenedor SIEMPRE está presente de forma estática dentro de
      // #vista-plan. Si no aparece (p. ej. un contenedor de prueba vacío),
      // se crea con las mismas clases congeladas para no perder la sección.
      contenedorReco = crearHTML(doc, 'div');
      contenedorReco.setAttribute('id', 'reco-plan');
      contenedorReco.classList.add('hz-card');
      contenedorReco.classList.add('hz-reco-panel');
      rootEl.appendChild(contenedorReco);
    }
    montarPanelRecomendador(doc, contenedorReco, HERZON_DATA, render);

    // R9 (Adendum R9 punto 3): referencia de re-montaje para
    // manejarRemontajeDatos (herzon:modo-cambiado), que necesita poder
    // volver a construir el panel del recomendador (perfil real) y
    // repintar esta vista sin depender de que registerView la monte de
    // nuevo (se monta UNA sola vez).
    refsMontajePlan = { doc: doc, contenedorReco: contenedorReco, render: render };
  }

  // -----------------------------------------------------------------------
  // Vista "Suplementos"
  // -----------------------------------------------------------------------
  function promedio(lista) {
    if (!lista.length) return 0;
    var total = 0;
    for (var i = 0; i < lista.length; i++) total += lista[i];
    return total / lista.length;
  }

  function montarVistaSuplementos(rootEl) {
    var doc = rootEl.ownerDocument;

    // R9 (Adendum R9 punto 3): render() propio (antes montaba una única vez
    // sin función de repintado) -- lo necesita manejarRemontajeDatos para
    // volver a dibujar esta vista ya montada cuando cambia el cliente/modo
    // (herzon:modo-cambiado), sin depender de un segundo mountFn
    // (registerView monta UNA sola vez, plan.md 3.C).
    function render() {
      var HERZON_DATA = G.HERZON_DATA;
      var Charts = G.Herzon.Charts;
      var Almacen = G.Herzon.Almacen;
      var suplementos = HERZON_DATA.suplementos || [];
      var adherenciaDiaria = (HERZON_DATA.series && HERZON_DATA.series.adherenciaDiaria) || [];
      var enModoReal = !!(Almacen && typeof Almacen.modo === 'function' && Almacen.modo() === 'real');
      var sinRegimen = enModoReal && suplementos.length === 0;

      limpiar(rootEl);
      var grid = crearHTML(doc, 'div');
      grid.classList.add('hz-grid');
      rootEl.appendChild(grid);

      // R8 punto 4: estado vacío -- un cliente real sin régimen todavía no
      // tiene NADA que graficar (ni siquiera un hero en 0%: 0% de adherencia
      // a cero suplementos sería un dato falso). Se muestra un único hero
      // con nota hz-vacio; regla 11 (exactamente un .hz-hero) se conserva.
      if (sinRegimen) {
        var cardVacio = crearCard(doc, grid, 'Suplementos');
        var heroVacio = crearHero(doc, cardVacio, 'Adherencia promedio de suplementos (%)');
        heroVacio.num.textContent = '—';
        var notaVaciaSup = crearHTML(doc, 'p');
        notaVaciaSup.classList.add('hz-vacio');
        notaVaciaSup.textContent = TEXTO_VACIO_SUPLEMENTOS;
        cardVacio.appendChild(notaVaciaSup);
        rootEl.setAttribute('data-suplementos-count', '0');
        return;
      }

      // --- Hero: exactamente UN número héroe por vista (regla 11) ---
      var adherenciaPromedio = Math.round(promedio(suplementos.map(function (s) { return s.adherencia_pct; })));
      var cardHero = crearCard(doc, grid, 'Suplementos');
      var hero = crearHero(doc, cardHero, 'Adherencia promedio de suplementos (%)');
      hero.num.textContent = formatearEntero(adherenciaPromedio) + '%';
      var notaHero = crearHTML(doc, 'p');
      notaHero.classList.add('hz-nota');
      notaHero.textContent = suplementos.length + ' suplementos en el régimen actual.';
      cardHero.appendChild(notaHero);

      // --- Adherencia por suplemento (barras horizontales). R9 (LY-05/C3):
      // 2a pista de la fila 1, ANTES del heatmap y del régimen (nuevo orden
      // vertical: héroe, barras, heatmap doble, régimen completo). Rótulos
      // cortos de despliegue (C3): el nombre completo con dosis ya vive en
      // la tabla "Régimen de suplementos" (cardRegimen, más abajo). ---
      var cardAdherenciaSup = crearCard(doc, grid, 'Adherencia por suplemento');
      var contAdherenciaSup = crearHTML(doc, 'div');
      cardAdherenciaSup.appendChild(contAdherenciaSup);
      Charts.barras(contAdherenciaSup, {
        // D5: sin título interno (duplicaria el heading de cardAdherenciaSup).
        tituloAccesible: 'Porcentaje de adherencia por cada suplemento del régimen en las últimas 12 semanas',
        orientacion: 'horizontal',
        categorias: suplementos.map(function (s) { return etiquetaCortaSuplemento(s.nombre); }),
        series: [{ nombre: 'Adherencia (%)', datos: suplementos.map(function (s) { return s.adherencia_pct; }) }],
        max: 100,
        // R6 (data-6, Adendum R6 punto 2): serie única, <=6 categorías en
        // horizontal -- unidad agrega el sufijo '%' a cada etiqueta y
        // valoresEnBarras dibuja el valor al final de CADA barra (antes solo
        // se etiquetaba la barra máxima).
        unidad: '%',
        valoresEnBarras: true,
        // R9 (LY-05/C3, corrección post-verificación): el eje usa el rótulo
        // corto (etiquetaCortaSuplemento) pero "Ver tabla" debe seguir
        // mostrando el nombre completo con dosis -- resolverEspecTabla
        // (charts.js) devuelve opciones.tabla TAL CUAL cuando trae columnas
        // y filas completas, así que se construye la espec de tabla a mano
        // con s.nombre (completo) en vez de dejar que 'tabla: true' derive
        // las filas de 'categorias' (que ya son los rótulos cortos).
        tabla: {
          columnas: ['Suplemento', 'Adherencia (%)'],
          filas: suplementos.map(function (s) { return [s.nombre, s.adherencia_pct]; })
        }
      });

      // --- Adherencia en el tiempo (heatmap TRANSPUESTO, rampa
      // var(--heat-1..5)). R9 (DV-05/LY-05/C4): 3a-4a pista de la fila 1,
      // data-ancho="doble" (~570px) para que las 12 columnas (semanas)
      // tengan celda digna. ---
      var cardAdherenciaTiempo = crearCard(doc, grid, 'Adherencia diaria a suplementos en el tiempo');
      cardAdherenciaTiempo.setAttribute('data-ancho', 'doble');
      var contAdherenciaTiempo = crearHTML(doc, 'div');
      cardAdherenciaTiempo.appendChild(contAdherenciaTiempo);

      // R9 (DV-05): transponer -- el tiempo corre a lo largo del eje x
      // (semanas en columnas), no hacia abajo. adherenciaDiaria viene en
      // orden cronológico (semana 0 días 0-6, semana 1 días 7-13, ...); se
      // reordena a orden por-día-de-semana (día 0 de cada semana, luego día
      // 1 de cada semana...) para que Charts.heatmapCalendario (fila =
      // i/columnas, columna = i%columnas, charts.js) dibuje 7 filas (L a D)
      // x 12 columnas (S1..S12) en vez de 12 filas x 7 columnas.
      var semanasHeatmap = Math.ceil(adherenciaDiaria.length / 7) || 1;
      var valoresTranspuestos = [];
      var etiquetasTranspuestas = [];
      for (var filaDia = 0; filaDia < 7; filaDia++) {
        for (var colSemana = 0; colSemana < semanasHeatmap; colSemana++) {
          var entradaDia = adherenciaDiaria[colSemana * 7 + filaDia];
          valoresTranspuestos.push(entradaDia ? entradaDia.suplementos_pct : null);
          etiquetasTranspuestas.push(entradaDia ? entradaDia.fecha : '');
        }
      }
      var encabezadosColumnaAdherenciaTiempo = [];
      for (var ecAdh = 0; ecAdh < semanasHeatmap; ecAdh++) {
        encabezadosColumnaAdherenciaTiempo.push(
          (ecAdh === 0 || ecAdh === 3 || ecAdh === 7 || ecAdh === 11) ? 'S' + (ecAdh + 1) : ''
        );
      }
      Charts.heatmapCalendario(contAdherenciaTiempo, {
        // D5: sin título interno (duplicaria el heading de cardAdherenciaTiempo).
        valores: valoresTranspuestos,
        etiquetas: etiquetasTranspuestas,
        columnas: semanasHeatmap,
        min: 0,
        max: 100,
        nombreSerie: 'Adherencia suplementos (%)',
        etiquetaColumna: 'Fecha',
        // R9 (DV-05): etiquetasFila rotula las 7 filas (un día de la semana
        // por fila, L a D); encabezadosColumna rotula S1/S4/S8/S12 sobre las
        // columnas (semanas). encabezadosDia queda retirado: los días ya no
        // son columnas, son filas.
        etiquetasFila: ['L', 'M', 'X', 'J', 'V', 'S', 'D'],
        encabezadosColumna: encabezadosColumnaAdherenciaTiempo,
        leyendaRampa: true,
        tabla: true
      });

      // --- Régimen (tabla siempre visible: dosis, horario, propósito). R9
      // (LY-05): fila 2, ANCHO completo, ÚLTIMA en el orden vertical (antes
      // era la segunda card montada). R6 (jera-1/data-3/fini-1/resp-1):
      // ancho completo (regla de T-026, plan.md Adendum R6 punto 1) -- con
      // 5 columnas, compartir fila con otra card recortaba
      // "Horario"/"Momento"/"Propósito" fuera del viewport a 1240px.
      // data-ancho="completo" la expande a las 1/-1 columnas del grid (CSS
      // de build/shell.html, este módulo solo aplica el atributo). ---
      var cardRegimen = crearCard(doc, grid, 'Régimen de suplementos');
      cardRegimen.setAttribute('data-ancho', 'completo');
      var columnasRegimen = ['Suplemento', 'Dosis', 'Horario', 'Momento', 'Propósito'];
      var filasRegimen = suplementos.map(function (s) {
        return [s.nombre, s.dosis, s.horario, s.momento, s.proposito];
      });
      construirTablaSimple(doc, cardRegimen, columnasRegimen, filasRegimen);

      rootEl.setAttribute('data-suplementos-count', String(suplementos.length));
    }

    render();

    // R9 (Adendum R9 punto 3): referencia de re-montaje para
    // manejarRemontajeDatos (herzon:modo-cambiado).
    refsMontajeSuplementos = { render: render };
  }

  // -----------------------------------------------------------------------
  // R9 (Adendum R9 punto 3, MC-02/MC-07): reactividad multi-cliente. Tanto
  // el panel del recomendador (perfil + plan aplicado) como los estados
  // vacíos de esta vista dependen del cliente/modo MONTADO en G.HERZON_DATA,
  // no del que estaba activo cuando la vista se montó por primera vez
  // (Herzon.registerView monta cada vista UNA sola vez, plan.md 3.C). Este
  // listener es el único mecanismo de repintado ante herzon:modo-cambiado
  // (semántica de remontaje: demo<->real y cliente<->cliente): descarta el
  // estado del recomendador del cliente/modo ANTERIOR (recoEstadoSingleton)
  // y lo recalcula desde cero contra el HERZON_DATA ya remontado (perfil
  // real + planIdSeleccionado precargado desde HERZON_DATA.planAplicado,
  // ver crearRecoEstadoInicial); si alguna vista ya se montó, la repinta.
  // -----------------------------------------------------------------------
  function manejarRemontajeDatos() {
    recoEstadoSingleton = null;
    obtenerRecoEstado();
    if (refsMontajePlan) {
      montarPanelRecomendador(refsMontajePlan.doc, refsMontajePlan.contenedorReco, G.HERZON_DATA, refsMontajePlan.render);
      refsMontajePlan.render();
    }
    if (refsMontajeSuplementos) {
      refsMontajeSuplementos.render();
    }
  }
  if (typeof G.addEventListener === 'function') {
    G.addEventListener('herzon:modo-cambiado', manejarRemontajeDatos);
  }

  // -----------------------------------------------------------------------
  // Herzon.planActivo() (Adendum R5 punto 4, dueño único vista_dieta_supl.js):
  // devuelve la plantilla y los ajustes actualmente seleccionados en el
  // recomendador. Funciona incluso si la vista "Plan de dieta" nunca se
  // montó (obtenerRecoEstado() calcula el default de forma perezosa), así
  // que build/documentos.js (T-023) NO necesita esperar a que la pestaña se
  // haya activado; el "fallback al plan por defecto" que le autoriza el
  // Adendum R5 aplica solo si este módulo no llegó a cargar en absoluto.
  //   plan            objeto completo de HERZON_DATA.planes (la plantilla activa)
  //   kcalObjetivo    el manual si el usuario lo fijó; si no, el de la
  //                   plantilla escalado por escalaPorciones, redondeado
  //   escalaPorciones 0.8 - 1.2 (1 = sin ajustar)
  //   macros          { proteina_g, carbohidrato_g, grasa_g } de la
  //                   plantilla activa, escalados por escalaPorciones
  // -----------------------------------------------------------------------
  G.Herzon.planActivo = function () {
    var HERZON_DATA = G.HERZON_DATA;
    var est = obtenerRecoEstado();
    var plan = planSeleccionadoActivo(est, HERZON_DATA);
    var kcalObjetivo = (est.kcalManual !== null && est.kcalManual !== undefined)
      ? est.kcalManual
      : redondear(plan.kcalObjetivo * est.escalaPorciones);
    var macros = {
      proteina_g: redondear(plan.macrosTotales.proteina * est.escalaPorciones),
      carbohidrato_g: redondear(plan.macrosTotales.carbohidrato * est.escalaPorciones),
      grasa_g: redondear(plan.macrosTotales.grasa * est.escalaPorciones)
    };
    return {
      plan: plan,
      kcalObjetivo: kcalObjetivo,
      escalaPorciones: est.escalaPorciones,
      macros: macros
    };
  };

  // -----------------------------------------------------------------------
  // Registro: namespaces disjuntos por tarea (plan.md 3.B). Este módulo SOLO
  // escribe Herzon.Views.plan y Herzon.Views.suplementos (nunca resumen,
  // perfil ni seguimiento: esos son de T-005).
  // -----------------------------------------------------------------------
  G.Herzon.Views.plan = montarVistaPlan;
  G.Herzon.Views.suplementos = montarVistaSuplementos;

  G.Herzon.registerView('plan', montarVistaPlan);
  G.Herzon.registerView('suplementos', montarVistaSuplementos);
})();

</script>
<script id="hz-vista-rutina">
// build/vista_rutina.js
// R10 (T-053): vista nueva "Rutina" -- lectura (R-05), editor solo en modo
// real (R-06) y documento imprimible/descargable (R-07). Registra
// window.Herzon.Views.rutina y Herzon.registerView('rutina', ...) (API
// publicada por T-002/build/shell.html, contrato .harness/plan.md 3.C).
//
// Consume window.HERZON_DATA (T-001 + claves aditivas R-02/R-03 de

  function buscarHijoPorId(raizEl, id) {
    if (raizEl.getAttribute && raizEl.getAttribute('id') === id) { return raizEl; }
    var hijos = raizEl.children || [];
    for (var i = 0; i < hijos.length; i++) {

    thead.appendChild(trEncabezado);
    tabla.appendChild(thead);

    var tbody = crear(doc, 'tbody');
    for (var f = 0; f < filas.length; f++) {
      var tr = crear(doc, 'tr');
      var fila = filas[f];
      for (var i = 0; i < fila.length; i++) {

        if (esPrimera) { celda.setAttribute('scope', 'row'); }
        tr.appendChild(celda);
      }
      tbody.appendChild(tr);
    }
    tabla.appendChild(tbody);
    wrap.appendChild(tabla);
    contenedorEl.appendChild(wrap);
    return wrap;

  // -----------------------------------------------------------------------
  // Fechas (mismo patrón UTC que build/data.js/build/documentos.js: sin
  // dependencia de zona horaria local).
  // -----------------------------------------------------------------------
  function formatoFechaHoy(fecha) {
    var yyyy = fecha.getUTCFullYear();
    var mm = String(fecha.getUTCMonth() + 1);
    if (mm.length < 2) { mm = '0' + mm; }
    var dd = String(fecha.getUTCDate());
    if (dd.length < 2) { dd = '0' + dd; }
    return yyyy + '-' + mm + '-' + dd;
  }

  // -----------------------------------------------------------------------

  // -----------------------------------------------------------------------
  function obtenerAlmacen() {
    return (G.Herzon && G.Herzon.Almacen) ? G.Herzon.Almacen : null;
  }

  function esModoReal(Almacen) {
    return !!(Almacen && typeof Almacen.modo === 'function' && Almacen.modo() === 'real');
  }

  function tituloDia(dia) {
    return 'Día ' + dia.dia + (dia.titulo ? (' — ' + dia.titulo) : '');

  // HERZON_DATA como parámetro y se invoca en cada clic, no una sola vez.
  // =========================================================================
  function datosDocumentoRutina(HERZON_DATA, opciones) {
    opciones = opciones || {};
    return {
      paciente: HERZON_DATA.paciente,
      rutina: HERZON_DATA.rutina || null,
      notaDatos: HERZON_DATA.meta.nota,
      fechaGeneracion: opciones.fechaGeneracion || formatoFechaHoy(opciones.ahora || new Date())
    };

  // renderDocumentoRutina(doc, contenedorEl, payload): llena #documento-rutina

  function renderDocumentoRutina(doc, contenedorEl, payload) {
    limpiar(contenedorEl);
    var rutina = payload.rutina || { dias: [], actualizado: '' };

    contenedorEl.appendChild(crear(doc, 'h2', ['hz-doc-titulo'], TITULO_DOCUMENTO_RUTINA));

    var meta = crear(doc, 'div', ['hz-doc-meta']);
    [
      'Cliente: ' + payload.paciente.nombre,
      'Objetivo: ' + payload.paciente.objetivo,
      'Actualizada: ' + (rutina.actualizado || ''),
      'Generado: ' + payload.fechaGeneracion
    ].forEach(function (texto) {
      meta.appendChild(crear(doc, 'span', null, texto));
    });
    contenedorEl.appendChild(meta);

    var dias = rutina.dias || [];
    for (var d = 0; d < dias.length; d++) {
      var dia = dias[d];
      var seccion = crearSeccionDoc(doc, contenedorEl, tituloDia(dia));

          ej.nombre,
          ej.series,
          ej.repeticiones,
          (ej.descanso_s != null) ? (ej.descanso_s + ' s') : '—',
          ej.notas || ''

      construirTablaDoc(doc, seccion, ['Ejercicio', 'Series', 'Repeticiones', 'Descanso', 'Notas'], filas);

    contenedorEl.appendChild(crear(doc, 'p', ['hz-doc-pie'], payload.notaDatos));
    return contenedorEl;

      .replace(/</g, '&lt;')

      .replace(/"/g, '&quot;');

  function generarHtmlRutinaDescargable(payload) {

  // =========================================================================
  // R-06: validación del borrador (patrón T-029, C-6: nunca guardar en
  // silencio). Función PURA -- no toca Almacen ni DOM (testeable en
  // aislamiento, expuesta como rutinaInterno.validarBorrador).
  // =========================================================================
  function nombreCampoLegible(campo) {
    if (campo === 'nombre') { return LABEL_EJERCICIO; }
    if (campo === 'series') { return LABEL_SERIES; }
    if (campo === 'repeticiones') { return LABEL_REPETICIONES; }
    if (campo === 'descanso') { return LABEL_DESCANSO; }
    return campo;
  }

  function validarBorrador(dias) {
    var errores = [];
    var invalidos = [];
    if (!Array.isArray(dias) || !dias.length) {
      errores.push('agrega al menos un día con un ejercicio');
    }
    (dias || []).forEach(function (dia, di) {
      if (!dia || !Array.isArray(dia.ejercicios) || !dia.ejercicios.length) {
        errores.push('el día ' + (di + 1) + ' necesita al menos un ejercicio');
        return;
      }
      dia.ejercicios.forEach(function (ej, ei) {
        var ubicacion = ' (día ' + (di + 1) + ', ejercicio ' + (ei + 1) + ')';
        var nombre = String((ej && ej.nombre) || '').trim();
        if (!nombre) {
          errores.push(nombreCampoLegible('nombre') + ubicacion);
          invalidos.push({ d: di, e: ei, campo: 'nombre' });
        }
        var seriesTexto = String((ej && ej.series != null) ? ej.series : '').trim();
        var series = parseInt(seriesTexto, 10);
        if (seriesTexto === '' || isNaN(series) || series < 1 || series > 10) {
          errores.push(nombreCampoLegible('series') + ubicacion);
          invalidos.push({ d: di, e: ei, campo: 'series' });
        }
        var repeticiones = String((ej && ej.repeticiones) || '').trim();
        if (!repeticiones) {
          errores.push(nombreCampoLegible('repeticiones') + ubicacion);
          invalidos.push({ d: di, e: ei, campo: 'repeticiones' });
        }
        var descansoTexto = String((ej && ej.descanso != null) ? ej.descanso : '').trim();
        if (descansoTexto !== '') {
          var descanso = parseInt(descansoTexto, 10);
          if (isNaN(descanso) || descanso < 0 || descanso > 600) {
            errores.push(nombreCampoLegible('descanso') + ubicacion);
            invalidos.push({ d: di, e: ei, campo: 'descanso' });
          }
        }
      });
    });
    return { valido: errores.length === 0, errores: errores, invalidos: invalidos };
  }

  // -----------------------------------------------------------------------

  // -----------------------------------------------------------------------
  var refsMontajeRutina = null;
  var borradorDias = [];
  var mensajeExitoRutina = '';

  function ejercicioVacio() {
    return { nombre: '', series: '', repeticiones: '', descanso: '', notas: '' };
  }

  function diaVacio() {
    return { titulo: '', ejercicios: [ejercicioVacio()] };
  }

  function reconstruirBorrador(rutina) {
    if (!rutina || !Array.isArray(rutina.dias) || !rutina.dias.length) { return []; }
    return rutina.dias.map(function (d) {
      return {
        titulo: d.titulo || '',
        ejercicios: (d.ejercicios || []).map(function (e) {
          return {
            nombre: e.nombre || '',
            series: (e.series != null) ? String(e.series) : '',
            repeticiones: e.repeticiones || '',
            descanso: (e.descanso_s != null) ? String(e.descanso_s) : '',
            notas: e.notas || ''
          };
        })
      };
    });
  }

  function idCampoDia(i) { return 'hz-rut-d' + (i + 1) + '-titulo'; }
  function idCampoEjercicio(i, j, campo) { return 'hz-rut-d' + (i + 1) + '-e' + (j + 1) + '-' + campo; }

  // Relee TODOS los valores actualmente tecleados en el DOM hacia
  // `borradorDias` ANTES de cualquier mutación estructural (agregar/quitar
  // día o ejercicio) o de validar al guardar -- así ninguna tecla se pierde
  // (R-06.4): el DOM es la fuente de verdad mientras no hay remontaje.
  function sincronizarDesdeDOM(formEl) {
    borradorDias.forEach(function (dia, i) {
      var campoTitulo = buscarHijoPorId(formEl, idCampoDia(i));
      if (campoTitulo) { dia.titulo = campoTitulo.value; }
      dia.ejercicios.forEach(function (ej, j) {
        ['nombre', 'series', 'repeticiones', 'descanso', 'notas'].forEach(function (campo) {
          var el = buscarHijoPorId(formEl, idCampoEjercicio(i, j, campo));
          if (el) { ej[campo] = el.value; }
        });
      });
    });
  }

  function limpiarInvalidos(formEl) {
    ['nombre', 'series', 'repeticiones', 'descanso'].forEach(function (campo) {
      borradorDias.forEach(function (dia, i) {
        dia.ejercicios.forEach(function (ej, j) {
          var el = buscarHijoPorId(formEl, idCampoEjercicio(i, j, campo));
          if (el) { el.removeAttribute('aria-invalid'); }
        });
      });
    });
  }

  // -----------------------------------------------------------------------
  // Montaje de la vista completa: lectura (R-05) + editor solo real (R-06).
  // Una sola función `render()` reconstruye TODO desde cero en cada llamada
  // (montaje inicial, herzon:modo-cambiado y tras un guardado exitoso) --
  // así el editor SIEMPRE arranca con un borrador fiel a HERZON_DATA.rutina
  // recién guardado/remontado (R-06.4).
  // -----------------------------------------------------------------------
  function montarVistaRutina(rootEl) {
    var doc = rootEl.ownerDocument;

    function render() {
      limpiar(rootEl);
      var HERZON_DATA = G.HERZON_DATA;
      var Almacen = obtenerAlmacen();
      var enModoReal = esModoReal(Almacen);
      var rutina = HERZON_DATA && HERZON_DATA.rutina;
      var dias = (rutina && Array.isArray(rutina.dias)) ? rutina.dias : [];

      var contenedorDocumento = (typeof doc.getElementById === 'function') ? doc.getElementById('documento-rutina') : null;

      // --- R-05.1: fila de herramientas (imprimir / descargar) ---
      var toolbar = crear(doc, 'div', ['hz-doc-herramientas']);
      var botonImprimir = crear(doc, 'button', ['hz-doc-btn'], TEXTO_BOTON_IMPRIMIR_RUTINA);
      botonImprimir.setAttribute('type', 'button');
      botonImprimir.setAttribute('id', 'hz-btn-imprimir-rutina');
      var botonDescargar = crear(doc, 'button', ['hz-doc-btn'], TEXTO_BOTON_DESCARGAR_RUTINA);
      botonDescargar.setAttribute('type', 'button');
      botonDescargar.setAttribute('id', 'hz-btn-descargar-rutina');
      var sinRutinaReal = enModoReal && !rutina;
      if (sinRutinaReal) {
        [botonImprimir, botonDescargar].forEach(function (b) {
          b.setAttribute('disabled', 'disabled');
          b.setAttribute('aria-disabled', 'true');
        });
      }
      toolbar.appendChild(botonImprimir);
      toolbar.appendChild(botonDescargar);
      rootEl.appendChild(toolbar);

      botonImprimir.addEventListener('click', function () {
        if (!G.HERZON_DATA || !G.HERZON_DATA.rutina || !contenedorDocumento) { return; }

  // -----------------------------------------------------------------------

    var card = crear(doc, 'div', ['hz-card', 'hz-form-card']);
    card.setAttribute('id', 'hz-rutina-editor');
    card.appendChild(crear(doc, 'h3', ['hz-card-title'], TITULO_EDITOR));

    var contenedorDias = crear(doc, 'div', ['hz-form-ancho']);
    form.appendChild(contenedorDias);

    var botonAgregarDia = crear(doc, 'button', ['hz-btn', 'hz-btn-secundario'], TEXTO_BOTON_AGREGAR_DIA);
    botonAgregarDia.setAttribute('type', 'button');
    botonAgregarDia.setAttribute('id', 'hz-btn-agregar-dia');
    form.appendChild(botonAgregarDia);

    var botonGuardar = crear(doc, 'button', ['hz-btn', 'hz-btn-primario'], TEXTO_BOTON_GUARDAR_RUTINA);

    botonGuardar.setAttribute('id', 'hz-btn-guardar-rutina');
    acciones.appendChild(botonGuardar);
    form.appendChild(acciones);

    errorEl.setAttribute('id', 'hz-rutina-error');
    form.appendChild(errorEl);

    estadoEl.setAttribute('id', 'hz-rutina-estado');

    // consumo único -- si un guardado exitoso dejó un mensaje pendiente, se
    // pinta aquí una sola vez y se limpia la variable de módulo.
    if (mensajeExitoRutina) {
      estadoEl.textContent = mensajeExitoRutina;
      estadoEl.style.color = 'var(--delta-good)';
      mensajeExitoRutina = '';
    }
    form.appendChild(estadoEl);

    function actualizarBotonAgregarDia() {
      if (borradorDias.length >= MAX_DIAS) {
        botonAgregarDia.setAttribute('disabled', 'disabled');
        botonAgregarDia.setAttribute('aria-disabled', 'true');
      } else {
        botonAgregarDia.removeAttribute('disabled');
        botonAgregarDia.removeAttribute('aria-disabled');
      }

      crearCampoInput(doc, subGrid, idCampoEjercicio(i, j, 'nombre'), LABEL_EJERCICIO, 'text', ej.nombre, { maxlength: 80 });
      crearCampoInput(doc, subGrid, idCampoEjercicio(i, j, 'series'), LABEL_SERIES, 'number', ej.series, { min: 1, max: 10 });
      crearCampoInput(doc, subGrid, idCampoEjercicio(i, j, 'repeticiones'), LABEL_REPETICIONES, 'text', ej.repeticiones, { maxlength: 40 });
      crearCampoInput(doc, subGrid, idCampoEjercicio(i, j, 'descanso'), LABEL_DESCANSO, 'number', ej.descanso, { min: 0, max: 600 });

      var botonQuitarEj = crear(doc, 'button', ['hz-btn', 'hz-btn-peligro', 'hz-form-ancho'], TEXTO_BOTON_QUITAR);
      botonQuitarEj.setAttribute('type', 'button');

        if (idxEj !== -1) { dia.ejercicios.splice(idxEj, 1); }
        // R-06.4: quitar el último ejercicio de un día elimina el día del
        // borrador (reversible mientras no se guarde).
        if (!dia.ejercicios.length) {
          var idxDia = borradorDias.indexOf(dia);
          if (idxDia !== -1) { borradorDias.splice(idxDia, 1); }
        }
        repintarCampos();
      });
      subGrid.appendChild(botonQuitarEj);
    }

    function construirFieldsetDia(dia, i) {
      var fieldset = crear(doc, 'fieldset', ['hz-form-ancho']);
      fieldset.appendChild(crear(doc, 'legend', null, 'Día ' + (i + 1)));

      crearCampoInput(doc, fieldset, idCampoDia(i), LABEL_TITULO_DIA, 'text', dia.titulo, { maxlength: 60 });

      var subGrid = crear(doc, 'div', ['hz-form-sub']);
      dia.ejercicios.forEach(function (ej, j) { construirCamposEjercicio(subGrid, ej, i, j); });
      fieldset.appendChild(subGrid);

        botonAgregarEj.setAttribute('disabled', 'disabled');

      if (!resultado.valido) {

      var diasPayload = borradorDias.map(function (dia) {
        return {
          titulo: dia.titulo,
          ejercicios: dia.ejercicios.map(function (ej) {
            var descansoTexto = String(ej.descanso == null ? '' : ej.descanso).trim();
            return {
              nombre: ej.nombre,
              series: parseInt(ej.series, 10),
              repeticiones: ej.repeticiones,
              descanso_s: (descansoTexto === '') ? null : parseInt(descansoTexto, 10),
              notas: ej.notas
            };
          })
        };
      });
      var totalEjercicios = diasPayload.reduce(function (acc, d) { return acc + d.ejercicios.length; }, 0);

      if (!Almacen || typeof Almacen.guardarRutina !== 'function') {
        errorEl.textContent = MSG_GUARDADO_FALLIDO;
        return;
      }
      var ok = Almacen.guardarRutina({ dias: diasPayload, actualizado: formatoFechaHoy(new Date()) });
      if (!ok) {
        errorEl.textContent = MSG_GUARDADO_FALLIDO;
        return;
      }
      mensajeExitoRutina = 'Rutina guardada en este dispositivo — ' + diasPayload.length + ' día(s), ' + totalEjercicios + ' ejercicio(s).';
      render();
    });

    repintarCampos();
    card.appendChild(form);
    rootEl.appendChild(card);
  }

  // -----------------------------------------------------------------------
  // R-05.6: reactividad multi-cliente. Views se monta UNA sola vez
  // (Herzon.registerView, plan.md 3.C); este listener a nivel de módulo es
  // el único mecanismo de repintado ante herzon:modo-cambiado (demo<->real y
  // cliente<->cliente). Patrón COPIADO de build/vista_dieta_supl.js
  // (manejarRemontajeDatos); ese archivo no se toca en R10 (C-7).
  // -----------------------------------------------------------------------
  function manejarRemontajeDatos() {
    if (refsMontajeRutina) { refsMontajeRutina.render(); }
  }
  if (typeof G.addEventListener === 'function') {
    G.addEventListener('herzon:modo-cambiado', manejarRemontajeDatos);
  }

  // -----------------------------------------------------------------------
  // Registro (R-08.1): namespace propio Herzon.Views.rutina (plan.md 3.B);
  // funciones puras expuestas para prueba en Herzon.Views.rutinaInterno.
  // -----------------------------------------------------------------------
  G.Herzon.Views.rutina = montarVistaRutina;
  G.Herzon.Views.rutinaInterno = {
    renderDocumentoRutina: renderDocumentoRutina,
    generarHtmlRutinaDescargable: generarHtmlRutinaDescargable,
    validarBorrador: validarBorrador
  };

  G.Herzon.registerView('rutina', montarVistaRutina);
})();

  }

  function fechaHoyTexto() {
    var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
      'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    var d = new Date();
    return d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function opcionesActividad(factoresActividad) {
    var opciones = [{ valor: '', etiqueta: 'Selecciona' }];
    Object.keys(factoresActividad || {}).forEach(function (clave) {
      opciones.push({ valor: clave, etiqueta: ETIQUETAS_ACTIVIDAD[clave] || clave });
    });
    return opciones;
  }

  // Semáforo de laboratorios (contrato sección 2): estatus reservado SOLO para
  // marcadores clínicos, jamás usado como serie. `mejorSi` indica la dirección en
  // la que el marcador debe moverse para mejorar; este prototipo solo penaliza el
  // sentido CONTRARIO a esa mejora (p.ej. HDL con mejorSi "mayor" no se penaliza
  // por estar por encima del máximo de referencia).
  var ETIQUETAS_ESTADO = { good: 'En rango', warning: 'Vigilancia', serious: 'Fuera de rango', critical: 'Crítico' };

  function calcularEstadoMarcador(valor, referencia, mejorSi) {
    var min = (referencia && typeof referencia.min === 'number') ? referencia.min : 0;
    var max = (referencia && typeof referencia.max === 'number') ? referencia.max : 0;
    var rango = (max - min) || 1;
    var distancia = 0;
    if (mejorSi === 'mayor') {
      if (valor < min) { distancia = min - valor; }
    } else {
      if (valor > max) { distancia = valor - max; }
    }
    if (distancia <= 0) { return 'good'; }
    var proporcion = distancia / rango;
    if (proporcion <= 0.15) { return 'warning'; }
    if (proporcion <= 0.40) { return 'serious'; }
    return 'critical';
  }

  // -----------------------------------------------------------------------
  // Acceso a Herzon.Almacen (R8/R9): SIEMPRE opcional/defensivo -- el shell
  // puede montar esta vista antes de que almacen.js exista (orden de
  // inyección) o el selfcheck de node puede no montarlo en absoluto (queda
  // en el comportamiento "demo" de antes de R8, sin vacíos ni captura).
  // -----------------------------------------------------------------------
  function obtenerAlmacen() {
    return (G.Herzon && G.Herzon.Almacen) ? G.Herzon.Almacen : null;
  }

  function esModoReal(Almacen) {
    return !!(Almacen && typeof Almacen.modo === 'function' && Almacen.modo() === 'real');
  }

  // -----------------------------------------------------------------------
  // Utilidades de DOM (usadas solo dentro de las funciones de montaje)
  // -----------------------------------------------------------------------
  function crear(doc, tag, clases, texto) {
    var elemento = doc.createElement(tag);
    if (clases) {
      for (var i = 0; i < clases.length; i++) { elemento.classList.add(clases[i]); }
    }
    if (texto != null) { elemento.textContent = texto; }
    return elemento;
  }

  function limpiar(elemento) {
    while (elemento.childNodes && elemento.childNodes.length) {
      elemento.removeChild(elemento.childNodes[0]);
    }
  }

  function limpiarNodo(nodo) {
    if (nodo && nodo.parentNode) { nodo.parentNode.removeChild(nodo); }
  }

  // Busca un descendiente (o el propio nodo) por atributo id, sin depender de
  // querySelector/getElementById: build/testdom.js no los implementa (solo
  // expone consultarTodo/consultarUno por tag o por clase) -- mismo patrón
  // que buscarHijoPorId en build/vista_dieta_supl.js.
  function buscarHijoPorId(raizEl, id) {
    if (raizEl.getAttribute && raizEl.getAttribute('id') === id) { return raizEl; }
    var hijos = raizEl.children || [];
    for (var i = 0; i < hijos.length; i++) {
      var encontrado = buscarHijoPorId(hijos[i], id);
      if (encontrado) { return encontrado; }
    }
    return null;
  }

  function crearVacio(doc, contenedorEl, texto) {
    var nota = crear(doc, 'div', ['hz-vacio'], texto || TEXTO_VACIO);
    contenedorEl.appendChild(nota);
    return nota;
  }

  function crearCampoInput(doc, contenedorEl, idCampo, etiquetaTexto, tipo, valorInicial, atributosExtra) {
    var campo = crear(doc, 'div', ['hz-form-campo']);
    var etiqueta = crear(doc, 'label', null, etiquetaTexto);
    etiqueta.setAttribute('for', idCampo);
    var input = crear(doc, 'input');
    input.setAttribute('id', idCampo);
    input.setAttribute('type', tipo);
    if (atributosExtra) {
      for (var clave in atributosExtra) {
        if (Object.prototype.hasOwnProperty.call(atributosExtra, clave)) {
          input.setAttribute(clave, String(atributosExtra[clave]));
        }
      }
    }
    input.value = valorInicial != null ? valorInicial : '';
    campo.appendChild(etiqueta);
    campo.appendChild(input);
    contenedorEl.appendChild(campo);
    return { campo: campo, input: input };
  }

  function crearCampoSelect(doc, contenedorEl, idCampo, etiquetaTexto, opciones) {
    var campo = crear(doc, 'div', ['hz-form-campo']);
    var etiqueta = crear(doc, 'label', null, etiquetaTexto);
    etiqueta.setAttribute('for', idCampo);
    var select = crear(doc, 'select');
    select.setAttribute('id', idCampo);
    for (var i = 0; i < opciones.length; i++) {
      var opcion = crear(doc, 'option', null, opciones[i].etiqueta);
      opcion.setAttribute('value', opciones[i].valor);
      select.appendChild(opcion);
    }
    campo.appendChild(etiqueta);
    campo.appendChild(select);
    contenedorEl.appendChild(campo);
    return { campo: campo, select: select };
  }

  // S-05/S-03: checkbox de una fila (mismo patrón que crearCampoInput/
  // crearCampoSelect de arriba, pero con type=checkbox e input.checked en
  // vez de input.value).
  function crearCampoCheckbox(doc, contenedorEl, idCampo, etiquetaTexto, checkedInicial) {
    var campo = crear(doc, 'div', ['hz-form-campo', 'hz-form-check', 'hz-form-ancho']);
    var input = crear(doc, 'input');
    input.setAttribute('id', idCampo);
    input.setAttribute('type', 'checkbox');
    input.checked = !!checkedInicial;
    var etiqueta = crear(doc, 'label', null, etiquetaTexto);
    etiqueta.setAttribute('for', idCampo);
    campo.appendChild(input);
    campo.appendChild(etiqueta);
    contenedorEl.appendChild(campo);
    return { campo: campo, input: input };
  }

  // S-04: lectura de archivo local para restaurar un respaldo. Mismo patrón
  // que `leerArchivoComoTexto` de build/documentos.js (COPIADO, no
  // importado -- C-7, documentos.js no se toca en R10): aislado en su
  // propia función para que el selfcheck pueda ejercitar el resto del
  // flujo con un stub mínimo de FileReader, sin depender de un navegador.
  function leerArchivoComoTextoLocal(archivo, callback) {
    if (typeof FileReader === 'undefined') {
      callback(null, 'este navegador no soporta FileReader');
      return;
    }
    var lector = new FileReader();
    lector.onerror = function () { callback(null, 'error de lectura del archivo'); };
    lector.onload = function () { callback(String(lector.result || ''), null); };
    lector.readAsText(archivo);
  }

  function limpiarBordesValidacion(campos) {
    campos.forEach(function (c) {
      c.input.style.borderColor = '';
      c.input.removeAttribute('aria-invalid');
    });
  }

  function marcarBordeInvalido(campo) {
    campo.input.style.borderColor = 'var(--delta-bad)';
    campo.input.setAttribute('aria-invalid', 'true');
  }

  // -----------------------------------------------------------------------
  // R11 (D-01/D-02/D-03/D-06): formulario de alta de cliente como <dialog
  // class="hz-dialogo"> nativo (CSS de T-059, shell.html sección 14), ids
  // CONGELADOS (Adendum R9 punto 6: #hz-card-alta-cliente, #hz-form-alta-
  // cliente, #hz-alta-nombre/sexo/edad/talla/peso/actividad/objetivo,
  // #hz-alta-error, #hz-btn-crear-cliente, #hz-btn-cancelar-alta). Se
  // construye UNA sola vez (singleton a nivel de módulo, sobrevive a
  // cualquier limpiar()/remontaje de las vistas porque cuelga de
  // document.body y no de ningún rootEl) -- así funciona aunque Vista
  // Perfil nunca se haya montado (mountFn perezoso, D-02). En TestDOM (sin
  // document.body ni dialog.showModal) se ancla al último rootEl de Perfil
  // conocido en su lugar (guardas typeof en cada paso).
  // -----------------------------------------------------------------------
  var dialogoAltaEl = null;
  var rootPerfilConocido = null;

  function construirDialogoAlta(doc) {
    var dialog = crear(doc, 'dialog', ['hz-dialogo']);
    dialog.setAttribute('id', 'hz-dialogo-alta');

    var card = crear(doc, 'div', ['hz-card', 'hz-form-card']);
    card.setAttribute('id', 'hz-card-alta-cliente');
    card.appendChild(crear(doc, 'h3', ['hz-card-title'], TITULO_ALTA));
    card.appendChild(crear(doc, 'p', ['hz-nota'], NOTA_PRIVACIDAD_ALTA));

    var form = crear(doc, 'form', ['hz-form', 'hz-form-columnas']);
    form.setAttribute('id', 'hz-form-alta-cliente');

    var campoNombre = crearCampoInput(doc, form, 'hz-alta-nombre', 'Nombre', 'text', '');
    campoNombre.campo.classList.add('hz-form-ancho');
    var campoSexo = crearCampoSelect(doc, form, 'hz-alta-sexo', 'Sexo', OPCIONES_SEXO);
    var campoEdad = crearCampoInput(doc, form, 'hz-alta-edad', 'Edad (años)', 'number', '', { min: 1, max: 120, step: 1 });
    var campoTalla = crearCampoInput(doc, form, 'hz-alta-talla', 'Talla (cm)', 'number', '', { min: 50, max: 250, step: 1 });
    var campoPeso = crearCampoInput(doc, form, 'hz-alta-peso', 'Peso (kg)', 'number', '', { min: 20, max: 400, step: 0.1 });
    var campoActividad = crearCampoSelect(doc, form, 'hz-alta-actividad', 'Nivel de actividad',
      opcionesActividad((G.HERZON_DATA || {}).factoresActividad));
    var campoObjetivo = crearCampoInput(doc, form, 'hz-alta-objetivo', 'Objetivo', 'text', '');

    var errorEl = crear(doc, 'p', ['hz-form-error', 'hz-form-ancho']);
    errorEl.setAttribute('id', 'hz-alta-error');
    errorEl.style.color = 'var(--delta-bad)';
    form.appendChild(errorEl);

    var acciones = crear(doc, 'div', ['hz-form-acciones', 'hz-form-ancho']);
    var botonCrear = crear(doc, 'button', ['hz-btn', 'hz-btn-primario'], 'Crear cliente');
    botonCrear.setAttribute('type', 'submit');
    botonCrear.setAttribute('id', 'hz-btn-crear-cliente');
    acciones.appendChild(botonCrear);

    // D-03: en el diálogo modal, Cancelar SIEMPRE está presente (ya no
    // depende de clientesCount/enReal: el diálogo mismo es la vía de
    // "salir sin guardar" en cualquier escenario, demo o real).
    var botonCancelar = crear(doc, 'button', ['hz-btn', 'hz-btn-secundario'], 'Cancelar');
    botonCancelar.setAttribute('type', 'button');
    botonCancelar.setAttribute('id', 'hz-btn-cancelar-alta');
    botonCancelar.addEventListener('click', function (ev) {
      if (ev && typeof ev.preventDefault === 'function') { ev.preventDefault(); }
      cerrarDialogoAlta();
    });
    acciones.appendChild(botonCancelar);
    form.appendChild(acciones);

    function limpiarCamposAlta() {
      campoNombre.input.value = '';
      campoNombre.input.removeAttribute('aria-invalid');
      campoSexo.select.value = '';
      campoEdad.input.value = '';
      campoTalla.input.value = '';
      campoPeso.input.value = '';
      campoActividad.select.value = '';
      campoObjetivo.input.value = '';
      errorEl.textContent = '';
    }

    // D-03: Cancelar, Escape (evento 'close' nativo del <dialog>) y crear
    // cliente con éxito cierran el diálogo Y limpian campos/error.
    function cerrarDialogoAlta() {
      limpiarCamposAlta();
      if (typeof dialog.close === 'function') { dialog.close(); }
      else { dialog.removeAttribute('open'); }
    }
    dialog.addEventListener('close', limpiarCamposAlta);

    form.addEventListener('submit', function (ev) {
      if (ev && typeof ev.preventDefault === 'function') { ev.preventDefault(); }
      errorEl.textContent = '';
      // C-6: código nuevo/refactorizado usa SOLO aria-invalid + la regla
      // CSS F-01.6, sin inline borderColor.
      campoNombre.input.removeAttribute('aria-invalid');
      var Almacen = obtenerAlmacen();
      if (!Almacen || typeof Almacen.crearCliente !== 'function') {
        errorEl.textContent = 'No se puede crear un cliente en este momento.';
        return;
      }
      var perfilObj = {
        nombre: campoNombre.input.value,
        sexo: campoSexo.select.value,
        edad: parseFloat(campoEdad.input.value),
        talla_cm: parseFloat(campoTalla.input.value),
        pesoInicial_kg: parseFloat(campoPeso.input.value),
        actividad: campoActividad.select.value,
        objetivo: campoObjetivo.input.value
      };
      ['edad', 'talla_cm', 'pesoInicial_kg'].forEach(function (clave) {
        if (isNaN(perfilObj[clave])) { perfilObj[clave] = undefined; }
      });
      var res = Almacen.crearCliente(perfilObj);
      if (!res || !res.ok) {
        campoNombre.input.setAttribute('aria-invalid', 'true');
        errorEl.textContent = (res && res.errores && res.errores.length) ? res.errores.join(' ') : 'No se pudo crear el cliente.';
        return;
      }
      // Éxito: crearCliente ya disparó herzon:modo-cambiado de forma
      // SÍNCRONA (Adendum R9 punto 3) -- las vistas ya remontaron con el
      // nuevo cliente montado. El diálogo cierra y se limpia (D-03).
      cerrarDialogoAlta();
    });

    card.appendChild(form);
    dialog.appendChild(card);
    return dialog;
  }

  // D-01: documento REAL con document.body disponible (navegador) -- en
  // TestDOM (selfcheck) `G.document` no existe, así que esto es null y el
  // llamador cae al fallback de rootEl.
  function documentoConBody() {
    return (G.document && typeof G.document.createElement === 'function' && G.document.body) ? G.document : null;
  }

  // D-01: crea el diálogo la PRIMERA vez que se necesita (singleton a nivel
  // de módulo); llamadas siguientes devuelven el mismo nodo sin volver a
  // construirlo. En TestDOM (fallback sin document.body) el diálogo cuelga
  // del rootEl de Perfil, que limpiar(rootEl) desancla en cada render() --
  // si el singleton ya existe pero quedó huérfano por eso, se reancla aquí
  // (mismo nodo, nunca se reconstruye). En DOM real no aplica: el diálogo
  // cuelga de document.body, ajeno a cualquier rootEl.
  function asegurarDialogoAlta(rootElFallback) {
    if (dialogoAltaEl) {
      if (!documentoConBody() && rootElFallback && dialogoAltaEl.parentNode !== rootElFallback) {
        rootElFallback.appendChild(dialogoAltaEl);
      }
      return dialogoAltaEl;
    }
    var docReal = documentoConBody();
    if (docReal) {
      dialogoAltaEl = construirDialogoAlta(docReal);
      docReal.body.appendChild(dialogoAltaEl);
    } else if (rootElFallback) {
      dialogoAltaEl = construirDialogoAlta(rootElFallback.ownerDocument);
      rootElFallback.appendChild(dialogoAltaEl);
    }
    return dialogoAltaEl;
  }

  // D-02/D-06: abre el diálogo (showModal si existe; fallback
  // setAttribute('open','') en TestDOM) y enfoca #hz-alta-nombre. Idempotente
  // (guarda dialog.open): puede recibir la misma solicitud desde el listener
  // de nivel de módulo Y desde el listener interno de mountPerfil sin lanzar
  // InvalidStateError por un showModal() duplicado.
  function abrirDialogoAlta(rootElFallback) {
    var Almacen = obtenerAlmacen();
    // D-06: bloqueado === true -> el diálogo NO se abre.
    if (Almacen && typeof Almacen.bloqueado === 'function' && Almacen.bloqueado()) { return; }
    var dialog = asegurarDialogoAlta(rootElFallback);
    if (!dialog) { return; }
    if (typeof dialog.showModal === 'function') {
      if (!dialog.open) { dialog.showModal(); }
    } else {
      dialog.setAttribute('open', '');
    }
    var nombreInput = buscarHijoPorId(dialog, 'hz-alta-nombre');
    if (nombreInput && typeof nombreInput.focus === 'function') { nombreInput.focus(); }
  }

  // -----------------------------------------------------------------------
  // Vista Resumen: UN número héroe (peso actual + delta con signo + sparkline
  // de 12 puntos), 4 stat tiles con trayectoria (DV-06), y la nota "Acerca del
  // modo demo" SOLO en modo demo (PR-04). Reparto (LY-01 piezas 2 y 4): una
  // sola .hz-grid con el héroe a data-ancho="doble" y dos wrappers de 2
  // stat tiles cada uno.
  // -----------------------------------------------------------------------
  function mountResumen(rootEl) {
    var doc = rootEl.ownerDocument;

    function render() {
      limpiar(rootEl);
      var Charts = G.Herzon.Charts || {};
      var Almacen = obtenerAlmacen();
      var data = G.HERZON_DATA || {};
      var paciente = data.paciente || {};
      var series = data.series || {};
      var pesoSerie = series.peso_kg || [];
      var grasaSerie = series.grasa_pct || [];
      var cinturaSerie = series.cintura_cm || [];
      var adherenciaSerie = series.adherenciaDieta_pct || [];
      var enReal = esModoReal(Almacen);
      var heroVacio = enReal && pesoSerie.length < 2;

      // --- LY-01 pieza 2: UNA sola .hz-grid con el héroe (data-ancho doble)
      // y dos wrappers de 2 stat tiles. ---
      var grid = crear(doc, 'div', ['hz-grid']);

      var heroCard = crear(doc, 'div', ['hz-card']);
      heroCard.setAttribute('data-ancho', 'doble');
      grid.appendChild(heroCard);

      var hero = null;
      if (heroVacio) {
        crearVacio(doc, heroCard);
      } else {
        var pesoInicial = pesoSerie.length ? pesoSerie[0] : (paciente.pesoInicial_kg || 0);
        var pesoActual = pesoSerie.length ? pesoSerie[pesoSerie.length - 1] : (paciente.pesoActual_kg || 0);
        var deltaPeso = redondear(pesoActual - pesoInicial, 1);
        hero = crear(doc, 'div', ['hz-hero']);
        hero.appendChild(crear(doc, 'div', ['hz-hero-label'], 'Peso actual'));
        hero.appendChild(crear(doc, 'div', ['hz-hero-num'], formatoNumero(pesoActual, 1) + ' kg'));
        var delta = crear(doc, 'div', ['hz-stat-delta'], conSigno(deltaPeso, 1) + ' kg desde el inicio');
        delta.classList.add(deltaPeso <= 0 ? 'hz-delta-good' : 'hz-delta-bad');
        hero.appendChild(delta);
        heroCard.appendChild(hero);
      }

      // Dos wrappers flex-column de 2 stat tiles cada uno (layout puntual,
      // sin clase congelada propia -- ver preámbulo, mismo patrón que
      // build/vista_dieta_supl.js).
      var wrapA = crear(doc, 'div');
      wrapA.style.display = 'flex';
      wrapA.style.flexDirection = 'column';
      wrapA.style.gap = '16px';
      var wrapB = crear(doc, 'div');
      wrapB.style.display = 'flex';
      wrapB.style.flexDirection = 'column';
      wrapB.style.gap = '16px';
      grid.appendChild(wrapA);
      grid.appendChild(wrapB);

      // jera-8/fini-6 (Adendum R6): el héroe se mide DESPUÉS de estar en el
      // documento (grid ya apendizado a rootEl) para que el sparkline reciba
      // el ancho real de la card, no el de respaldo desconectado.
      rootEl.appendChild(grid);

      if (!heroVacio && hero && typeof Charts.sparkline === 'function') {
        var anchoMedido = hero.clientWidth || heroCard.clientWidth || 0;
        // LY-01 pieza 4 / decisión C2: tope Math.min(ancho, 560), alto 56,
        // lineaAcento:true (deja de codificar la evidencia principal en el
        // gris más recesivo).
        Charts.sparkline(hero, {
          valores: pesoSerie,
          color: 'var(--series-1)',
          ancho: anchoMedido > 0 ? Math.min(anchoMedido, 560) : undefined,
          alto: 56,
          lineaAcento: true
        });
      }

      if (typeof Charts.statTile === 'function') {
        var deltaImcResumen;
        if (typeof paciente.imcActual === 'number' && typeof paciente.imcInicial === 'number') {
          deltaImcResumen = redondear(paciente.imcActual - paciente.imcInicial, 1);
        }
        Charts.statTile(wrapA, {
          etiqueta: 'IMC actual',
          valorFormateado: formatoOTexto(paciente.imcActual, 1),
          delta: deltaImcResumen,
          mejorSi: 'menor'
        });
        // DV-06: sparkline de trayectoria en Grasa/Cintura/Adherencia (no en
        // IMC), colorSparkline por entidad (grasa: series-2, resto:
        // series-1) y lineaAcento:true, consistente con el héroe (LY-01).
        // Nota de implementación: Charts.statTile (build/charts.js, fuera de
        // este POSEE) NO reenvía `lineaAcento` a su llamada interna de
        // Charts.sparkline (solo reenvía `color`), así que la opción
        // `lineaAcento` dentro de las opciones de statTile es no-op ahí. En
        // vez de depender de ese reenvío, este módulo monta el tile SIN
        // sparkline y agrega el sparkline con una llamada directa y pública
        // a Charts.sparkline (misma primitiva que el héroe de LY-01), que sí
        // soporta lineaAcento -- mismo resultado visual, cero cambios en
        // charts.js.
        var tileGrasa = Charts.statTile(wrapA, {
          etiqueta: 'Grasa corporal',
          valorFormateado: grasaSerie.length ? formatoNumero(grasaSerie[grasaSerie.length - 1], 1) + '%' : '—',
          delta: grasaSerie.length >= 2 ? redondear(grasaSerie[grasaSerie.length - 1] - grasaSerie[0], 1) : undefined,
          sufijoDelta: ' pp',
          mejorSi: 'menor'
        });
        if (grasaSerie.length >= 2 && typeof Charts.sparkline === 'function') {
          Charts.sparkline(tileGrasa, { valores: grasaSerie, color: 'var(--series-2)', lineaAcento: true });
        }
        var tileCintura = Charts.statTile(wrapB, {
          etiqueta: 'Cintura',
          valorFormateado: cinturaSerie.length ? formatoNumero(cinturaSerie[cinturaSerie.length - 1], 1) + ' cm' : '—',
          delta: cinturaSerie.length >= 2 ? redondear(cinturaSerie[cinturaSerie.length - 1] - cinturaSerie[0], 1) : undefined,
          sufijoDelta: ' cm',
          mejorSi: 'menor'
        });
        if (cinturaSerie.length >= 2 && typeof Charts.sparkline === 'function') {
          Charts.sparkline(tileCintura, { valores: cinturaSerie, color: 'var(--series-1)', lineaAcento: true });
        }
        var tileAdherencia = Charts.statTile(wrapB, {
          etiqueta: 'Adherencia a dieta (promedio)',
          valorFormateado: adherenciaSerie.length ? (String(Math.round(promedio(adherenciaSerie))) + '%') : '—'
        });
        if (adherenciaSerie.length >= 2 && typeof Charts.sparkline === 'function') {
          Charts.sparkline(tileAdherencia, { valores: adherenciaSerie, color: 'var(--series-1)', lineaAcento: true });
        }
      }

      // PR-04: la nota "Acerca del modo demo" vive SOLO en modo demo (Almacen
      // ausente o modo()==='demo'); no participa de la retícula (se monta
      // DESPUÉS del grid, decisión C5).
      var mostrarNotaDemo = !Almacen || (typeof Almacen.modo === 'function' && Almacen.modo() === 'demo');
      if (mostrarNotaDemo) {
        var nota = crear(doc, 'div', ['hz-nota']);
        nota.appendChild(crear(doc, 'strong', null, TITULO_NOTA_DEMO));
        var lista = crear(doc, 'ul');
        (data.supuestos || []).forEach(function (s) { lista.appendChild(crear(doc, 'li', null, s)); });
        nota.appendChild(lista);
        rootEl.appendChild(nota);
      }
    }

    render();
    // Adendum R9 punto 3: herzon:modo-cambiado cubre TODO remontaje de
    // G.HERZON_DATA (demo<->real y cliente<->cliente) -- re-renderizar
    // releyendo G.HERZON_DATA desde cero.
    if (typeof G.addEventListener === 'function') {
      G.addEventListener('herzon:modo-cambiado', function () { render(); });
    }
  }

  // -----------------------------------------------------------------------
  // D-02 (R11, hereda MC-04/BUG 1 del R9): el listener de
  // `herzon:cliente-nuevo-solicitado` NO puede vivir SOLO dentro de
  // mountPerfil(), porque Herzon.registerView monta esa vista de forma
  // PEREZOSA (plan.md 3.C) -- mountPerfil solo se ejecuta la primera vez
  // que la pestaña Perfil se activa. En una carga fresca real (pestaña
  // activa por defecto = Resumen, contrato de shell.html), si el usuario
  // nunca visitó Perfil y hace clic en "Usar mis datos" (0 clientes) o en
  // "+ Nuevo cliente..." del selector, Almacen.activarReal/
  // Almacen.crearCliente despachan este evento y, sin este listener a nivel
  // de módulo, se disparaba al vacío. Se registra aquí (nivel superior del
  // IIFE): abre el diálogo de alta directamente, SIN cambiar de pestaña
  // (R11 punto 1, D-02) -- construyéndolo bajo demanda si Perfil nunca se
  // ha montado (abrirDialogoAlta/asegurarDialogoAlta arriba). El listener
  // interno registrado dentro de mountPerfil (más abajo) sigue cubriendo el
  // caso "Perfil ya montada"; abrirDialogoAlta es idempotente, así que no
  // importa que ambos disparen para el mismo evento.
  // -----------------------------------------------------------------------
  if (typeof G.addEventListener === 'function') {
    G.addEventListener('herzon:cliente-nuevo-solicitado', function () {
      abrirDialogoAlta(rootPerfilConocido);
    });
  }

  // -----------------------------------------------------------------------
  // Vista Perfil: UN número héroe (IMC actual) DENTRO del grid de 3 tarjetas
  // (LY-02), tarjeta clínica, tarjeta antropométrica, semáforos de
  // laboratorios en grid anidado (LY-02, omitida por S-05 si el cliente
  // tiene labsOcultos), edición de perfil (F-04, con la casilla S-05 y el
  // pie de eliminación F-05) y eliminación de cliente en modo real (R8
  // punto 5, MC-06), la card de desbloqueo (S-02, primera card mientras
  // Almacen.bloqueado()===true), la card de seguridad y respaldo (S-03/S-04,
  // solo real desbloqueado) y, SOLO en modo demo (D-05, R11), la card
  // #hz-card-modo-real al final. El alta de cliente (F-03, MC-04, ids
  // congelados en Adendum R9 punto 6) YA NO vive inline en esta vista -- es
  // el diálogo modal #hz-dialogo-alta (D-01, construido a nivel de módulo,
  // ver arriba). Orden real de la vista (C-3): [bloqueado: desbloqueo
  // primera] -> cards actuales -> Editar perfil (casilla labs + pie de
  // eliminación) -> seguridad -> [demo: card Modo real al final].
  // -----------------------------------------------------------------------
  function mountPerfil(rootEl) {
    var doc = rootEl.ownerDocument;
    // D-01/D-02: recuerda el rootEl de Perfil -- el listener de nivel de
    // módulo lo usa como fallback en TestDOM (donde no hay document.body)
    // para anclar el diálogo de alta si se construye bajo demanda ahí.
    rootPerfilConocido = rootEl;
    // F-04.5: mensaje de éxito de "Guardar cambios" -- patrón consumo-único:
    // el submit exitoso lo fija ANTES de provocar el siguiente montaje
    // (propio, o vía herzon:modo-cambiado si S-05 cambió la configuración);
    // ese siguiente montaje lo consume una sola vez.
    var mensajeExitoPerfil = '';
    // S-03: mismo patrón consumo-único, compartido por las tres acciones de
