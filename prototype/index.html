<script id="hz-motor">
// build/motor_recomendacion.js
// Herzon.Motor — funciones PURAS de cálculo nutricional (Adendum R5 punto 2).
// Ninguna función toca `document`, `window` ni `HERZON_DATA`: todo entra por
// argumentos y todo sale por el valor de retorno. Esto es lo que permite
// `require()` desde node sin navegador y sin stub de DOM (build/testdom.js
// no aplica aquí: no hay nada que montar).
//
// Fórmulas y redondeos (EXACTOS, congelados en .harness/plan.md Adendum R5):
//   tmb            Mifflin-St Jeor: mujer 10*peso + 6.25*talla - 5*edad - 161;
//                  hombre 10*peso + 6.25*talla - 5*edad + 5. Redondeado a entero.
//   get            tmb * factorActividad. Redondeado a entero.
//   kcalObjetivo   get * (1 + ajuste), ajuste por objetivo: 'perdida' -15%,
//                  'recomposicion' -10%, 'mantener' 0%, 'ganancia' +10%.
//                  Redondeado a entero.
//   macrosObjetivo proteina_g/kg según objetivo ('perdida'/'recomposicion'
//                  1.8, 'mantener' 1.6, 'ganancia' 2.0); grasa 27.5% de las
//                  kcal (a 9 kcal/g); carbohidrato absorbe el resto de las
//                  kcal (a 4 kcal/g), usando los gramos YA redondeados de
//                  proteína y grasa para que el reparto sea internamente
//                  consistente. Cada campo se redondea a gramo entero.
//   recomendar     distancia euclidiana normalizada entre las necesidades y
//                  cada plan, en las 4 dimensiones (kcal, proteína,
//                  carbohidrato, grasa); score = 100 / (1 + distancia),
//                  redondeado a entero; orden DESCENDENTE por score.
//
// Preámbulo obligatorio (plan.md 3.A): script clásico, IIFE, sin import/export.
(function () {
  var G = (typeof window !== 'undefined') ? window : globalThis;
  G.Herzon = G.Herzon || {};
  G.Herzon.Motor = G.Herzon.Motor || {};
  var Motor = G.Herzon.Motor;

  // -----------------------------------------------------------------------
  // Constantes internas (no se exponen: quien llama pasa `objetivo` como
  // string y el motor resuelve el ajuste/factor correspondiente).
  // Objetivos válidos: 'perdida', 'recomposicion', 'mantener', 'ganancia'.
  // -----------------------------------------------------------------------
  var AJUSTE_KCAL_POR_OBJETIVO = {
    perdida: -0.15,
    recomposicion: -0.10,
    mantener: 0,
    ganancia: 0.10
  };

  var PROTEINA_G_POR_KG_POR_OBJETIVO = {
    perdida: 1.8,
    recomposicion: 1.8,
    mantener: 1.6,
    ganancia: 2.0
  };

  var PORCENTAJE_GRASA_DE_KCAL = 0.275;
  var KCAL_POR_G_PROTEINA = 4;
  var KCAL_POR_G_CARBOHIDRATO = 4;
  var KCAL_POR_G_GRASA = 9;

  function redondear(n) {
    return Math.round(n);
  }

  function validarObjetivo(objetivo, nombreFuncion) {
    if (!Object.prototype.hasOwnProperty.call(AJUSTE_KCAL_POR_OBJETIVO, objetivo)) {
      throw new Error(
        'Herzon.Motor.' + nombreFuncion + ': objetivo inválido "' + objetivo +
        '". Valores válidos: "perdida", "recomposicion", "mantener", "ganancia".'
      );
    }
  }

  // -----------------------------------------------------------------------
  // tmb({sexo, pesoKg, tallaCm, edad}) -> número entero (kcal/día)
  // Mifflin-St Jeor. sexo: 'femenino' | 'masculino' (mismo vocabulario que
  // HERZON_DATA.paciente.sexo).
  // -----------------------------------------------------------------------
  Motor.tmb = function (perfil) {
    var sexo = perfil.sexo;
    var pesoKg = perfil.pesoKg;
    var tallaCm = perfil.tallaCm;
    var edad = perfil.edad;
    var base = 10 * pesoKg + 6.25 * tallaCm - 5 * edad;
    if (sexo === 'femenino') {
      return redondear(base - 161);
    }
    if (sexo === 'masculino') {
      return redondear(base + 5);
    }
    throw new Error('Herzon.Motor.tmb: sexo inválido "' + sexo + '". Valores válidos: "femenino", "masculino".');
  };

  // -----------------------------------------------------------------------
  // get(tmb, factor) -> número entero (kcal/día)
  // factor: factor de actividad (p.ej. 1.2 sedentario, 1.375 ligero, 1.55
  // moderado, 1.725 intenso — catálogo en HERZON_DATA.factoresActividad).
  // -----------------------------------------------------------------------
  Motor.get = function (tmb, factor) {
    return redondear(tmb * factor);
  };

  // -----------------------------------------------------------------------
  // kcalObjetivo(get, objetivo) -> número entero (kcal/día)
  // -----------------------------------------------------------------------
  Motor.kcalObjetivo = function (get, objetivo) {
    validarObjetivo(objetivo, 'kcalObjetivo');
    var ajuste = AJUSTE_KCAL_POR_OBJETIVO[objetivo];
    return redondear(get * (1 + ajuste));
  };

  // -----------------------------------------------------------------------
  // macrosObjetivo({kcal, pesoKg, objetivo}) -> {proteina_g, carbohidrato_g, grasa_g}
  // -----------------------------------------------------------------------
  Motor.macrosObjetivo = function (params) {
    var kcal = params.kcal;
    var pesoKg = params.pesoKg;
    var objetivo = params.objetivo;
    validarObjetivo(objetivo, 'macrosObjetivo');

    var proteinaGPorKg = PROTEINA_G_POR_KG_POR_OBJETIVO[objetivo];
    var proteina_g = redondear(pesoKg * proteinaGPorKg);
    var grasa_g = redondear((kcal * PORCENTAJE_GRASA_DE_KCAL) / KCAL_POR_G_GRASA);
    var kcalRestante = kcal - proteina_g * KCAL_POR_G_PROTEINA - grasa_g * KCAL_POR_G_GRASA;
    var carbohidrato_g = redondear(kcalRestante / KCAL_POR_G_CARBOHIDRATO);

    return {
      proteina_g: proteina_g,
      carbohidrato_g: carbohidrato_g,
      grasa_g: grasa_g
    };
  };

  // -----------------------------------------------------------------------
  // Formato de un delta con signo explícito: 5 -> "+5", -5 -> "-5", 0 -> "+0".
  // -----------------------------------------------------------------------
  function formatoDelta(n) {
    return (n >= 0 ? '+' + n : String(n));
  }

  // -----------------------------------------------------------------------
  // generarRazones(plan, necesidades) -> string[] en español, legibles.
  // -----------------------------------------------------------------------
  function generarRazones(plan, necesidades) {
    var deltaKcal = plan.kcalObjetivo - necesidades.kcal;
    var deltaProteina = plan.macrosTotales.proteina - necesidades.proteina_g;
    var deltaCarbohidrato = plan.macrosTotales.carbohidrato - necesidades.carbohidrato_g;
    var deltaGrasa = plan.macrosTotales.grasa - necesidades.grasa_g;

    var razones = [];
    razones.push('kcal a ' + formatoDelta(deltaKcal) + ' del objetivo');
    if (deltaProteina >= 0) {
      razones.push('proteína suficiente');
    } else {
      razones.push('proteína insuficiente (' + deltaProteina + ' g respecto al objetivo)');
    }
    razones.push('carbohidrato a ' + formatoDelta(deltaCarbohidrato) + ' g del objetivo');
    razones.push('grasa a ' + formatoDelta(deltaGrasa) + ' g del objetivo');
    return razones;
  }

  // -----------------------------------------------------------------------
  // distanciaNormalizada(necesidades, plan) -> número >= 0.
  // Euclidiana sobre las 4 dimensiones, cada una normalizada contra la
  // necesidad correspondiente (deltas relativos, no absolutos), para que
  // kcal (~1000s) y macros (~100s) pesen de forma comparable.
  // -----------------------------------------------------------------------
  function distanciaNormalizada(necesidades, plan) {
    var dKcal = (plan.kcalObjetivo - necesidades.kcal) / necesidades.kcal;
    var dProteina = (plan.macrosTotales.proteina - necesidades.proteina_g) / necesidades.proteina_g;
    var dCarbohidrato = (plan.macrosTotales.carbohidrato - necesidades.carbohidrato_g) / necesidades.carbohidrato_g;
    var dGrasa = (plan.macrosTotales.grasa - necesidades.grasa_g) / necesidades.grasa_g;
    return Math.sqrt(dKcal * dKcal + dProteina * dProteina + dCarbohidrato * dCarbohidrato + dGrasa * dGrasa);
  }

  // -----------------------------------------------------------------------
  // recomendar(necesidades, planes) -> [{plan, score, razones[]}] descendente.
  // necesidades: {kcal, proteina_g, carbohidrato_g, grasa_g} — armado por el
  // llamador combinando kcalObjetivo() y macrosObjetivo().
  // planes: arreglo de plantillas con {id, nombre, kcalObjetivo,
  // macrosTotales:{proteina, carbohidrato, grasa}} (forma de HERZON_DATA.planes,
  // Adendum R5 punto 1; nota: sin sufijo "_g" en macrosTotales).
  // score: 0-100, mayor es mejor ajuste (100 / (1 + distancia normalizada)).
  // -----------------------------------------------------------------------
  Motor.recomendar = function (necesidades, planes) {
    var resultados = [];
    for (var i = 0; i < planes.length; i++) {
      var plan = planes[i];
      var distancia = distanciaNormalizada(necesidades, plan);
      var score = redondear(100 / (1 + distancia));
      resultados.push({
        plan: plan,
        score: score,
        razones: generarRazones(plan, necesidades)
      });
    }
    resultados.sort(function (a, b) { return b.score - a.score; });
    return resultados;
  };
})();

</script>
<script id="hz-docs">
// build/documentos.js
// U-DOCUMENTOS (T-023, refinado en T-030/R6): Herzon.Docs — documento
// imprimible del plan, descargas locales (.html/.csv via Blob) e
// importación de mediciones por CSV. Ver .harness/plan.md Adendum R5
// puntos 3 y 4, y Adendum R6 punto 3 (forma real de Herzon.planActivo()).
//
// Consume window.HERZON_DATA (T-001, forma congelada en plan.md 3.I) y
// Herzon.planActivo() (T-004/vista_dieta_supl.js): la forma REAL que
// documenta la cabecera de ese módulo ES el contrato (Adendum R6 punto 3)
// — { plan, kcalObjetivo, escalaPorciones, macros:{proteina_g,
// carbohidrato_g,grasa_g} }, sin `necesidades` ni `ajustes` — con fallback
// íntegro al plan por defecto si la función no existe, lanza, o no trae
// `.plan`. No conoce ni modifica build/data.js, build/vista_dieta_supl.js
// ni build/shell.html: los ids que consulta (#documento-plan,
// #doc-herramientas y sus botones, #hz-doc-input-importar) ya existen como
// marcado estático puesto por T-021 (build/shell.html); este módulo SOLO
// los cablea, nunca los define.
//
// Preámbulo obligatorio (plan.md 3.A): script clásico, IIFE, sin
// import/export. Prohibido tocar `document` en el nivel superior del
// módulo: toda manipulación real del DOM vive dentro de `init()` y las
// funciones que llama (mismo patrón que build/vista_dieta_supl.js). La
// única excepción es el auto-inicio de abajo, que solo LEE la propiedad
// `G.document` (nunca el identificador suelto `document`) para decidir SI
// difiere a `DOMContentLoaded`; bajo el selfcheck de node
// (`globalThis.window = globalThis`, sin `document` real) esa propiedad es
// `undefined`, el bloque no se ejecuta y el módulo se carga sin lanzar,
// igual que el resto de los módulos de esta interfaz.
//
// Cero red: solo Blob/data URIs y FileReader (legítimos por ser locales,
// plan.md Adendum R5 punto 3 y criterio de aceptación T-023). Cero
// inyección cruda de marcado: todo texto entra al DOM vivo con
// textContent, incluidos los mensajes de validación del CSV importado
// (dato NO confiable).
(function () {
  var G = (typeof window !== 'undefined') ? window : globalThis;
  G.Herzon = G.Herzon || {};
  G.Herzon.Docs = G.Herzon.Docs || {};

  // -----------------------------------------------------------------------
  // Utilidades locales de DOM (sin document en el nivel superior: reciben
  // siempre `doc`, igual que build/vista_dieta_supl.js y build/charts.js).
  // -----------------------------------------------------------------------
  function crearHTML(doc, tag) {
    return doc.createElement(tag);
  }

  function limpiar(el) {
    el.textContent = '';
  }

  function crearSeccion(doc, contenedorEl, tituloTexto) {
    var seccion = crearHTML(doc, 'div');
    seccion.classList.add('hz-doc-seccion');
    var titulo = crearHTML(doc, 'h3');
    titulo.classList.add('hz-doc-seccion-titulo');
    titulo.textContent = tituloTexto;
    seccion.appendChild(titulo);
    contenedorEl.appendChild(seccion);
    return seccion;
  }

  function construirTabla(doc, contenedorEl, columnas, filas) {
    var wrap = crearHTML(doc, 'div');
    wrap.classList.add('hz-table-wrap');
    var tabla = crearHTML(doc, 'table');
    tabla.classList.add('hz-table');

    var thead = crearHTML(doc, 'thead');
    var trEncabezado = crearHTML(doc, 'tr');
    for (var c = 0; c < columnas.length; c++) {
      var th = crearHTML(doc, 'th');
      th.setAttribute('scope', 'col');
      th.textContent = columnas[c];
      trEncabezado.appendChild(th);
    }
    thead.appendChild(trEncabezado);
    tabla.appendChild(thead);

    var tbody = crearHTML(doc, 'tbody');
    for (var f = 0; f < filas.length; f++) {
      var tr = crearHTML(doc, 'tr');
      var fila = filas[f];
      for (var i = 0; i < fila.length; i++) {
        var celda = crearHTML(doc, i === 0 ? 'th' : 'td');
        if (i === 0) { celda.setAttribute('scope', 'row'); }
        var valor = fila[i];
        celda.textContent = (valor === null || valor === undefined) ? '' : String(valor);
        tr.appendChild(celda);
      }
      tbody.appendChild(tr);
    }
    tabla.appendChild(tbody);
    wrap.appendChild(tabla);
    contenedorEl.appendChild(wrap);
    return wrap;
  }

  var NOMBRES_MOMENTO = {
    desayuno: 'Desayuno',
    colacion_manana: 'Colación matutina',
    comida: 'Comida',
    colacion_tarde: 'Colación vespertina',
    cena: 'Cena'
  };

  // -----------------------------------------------------------------------
  // Fechas (mismo patrón UTC que build/data.js: sin dependencia de zona
  // horaria local del navegador donde se abra el prototipo).
  // -----------------------------------------------------------------------
  function formatoFechaHoy(fecha) {
    var yyyy = fecha.getUTCFullYear();
    var mm = String(fecha.getUTCMonth() + 1);
    if (mm.length < 2) { mm = '0' + mm; }
    var dd = String(fecha.getUTCDate());
    if (dd.length < 2) { dd = '0' + dd; }
    return yyyy + '-' + mm + '-' + dd;
  }

  // -----------------------------------------------------------------------
  // PR-05 (R9, decisión C6): nombres de exportables por modo + slug de
  // cliente. `slugCliente(nombre)`: minúsculas, sin acentos (normalización
  // NFD + descarte de marcas diacríticas), espacios y símbolos a guiones,
  // solo `[a-z0-9-]`, sin guiones sobrantes al inicio/fin. Ej.:
  // "María José" -> "maria-jose".
  // -----------------------------------------------------------------------
  function slugCliente(nombre) {
    if (typeof nombre !== 'string') { return ''; }
    var normalizado = nombre.normalize ? nombre.normalize('NFD').replace(/[\u0300-\u036f]/g, '') : nombre;
    return normalizado
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // Lectura defensiva del Almacén (PR-05): `G.Herzon.Almacen && Almacen.modo()`.
  // Sin Almacén disponible, o con Almacén en modo no-real, se trata como
  // demo (el nombre de archivo nunca debe insinuar que es un cliente real
  // cuando no hay forma fiable de saberlo).
  function almacenDisponible() {
    var Almacen = G.Herzon && G.Herzon.Almacen;
    return (Almacen && typeof Almacen.modo === 'function') ? Almacen : null;
  }

  function enModoReal() {
    var Almacen = almacenDisponible();
    return !!(Almacen && Almacen.modo() === 'real');
  }

  // nombreArchivoExportable(base, fecha, extension): 'rinde-<slug>-<base>-
  // <fecha>.<extension>' en real (fallback 'rinde-<base>-<fecha>.<extension>'
  // sin nombre de cliente disponible), 'rinde-demo-<base>-<fecha>.<extension>'
  // en demo/sin Almacén.
  function nombreArchivoExportable(base, fecha, extension) {
    if (!enModoReal()) {
      return 'rinde-demo-' + base + '-' + fecha + '.' + extension;
    }
    var Almacen = almacenDisponible();
    var activo = (Almacen && typeof Almacen.clienteActivo === 'function') ? Almacen.clienteActivo() : null;
    var slug = (activo && activo.nombre) ? slugCliente(activo.nombre) : '';
    var prefijo = slug ? ('rinde-' + slug + '-') : 'rinde-';
    return prefijo + base + '-' + fecha + '.' + extension;
  }

  // -----------------------------------------------------------------------
  // Herzon.planActivo() — Adendum R5 punto 4 + Adendum R6 punto 3: "la forma
  // REAL documentada en la cabecera de vista_dieta_supl.js ES el contrato".
  // Esa forma es { plan, kcalObjetivo, escalaPorciones, macros:{proteina_g,
  // carbohidrato_g,grasa_g} } — NO trae `necesidades` ni `ajustes` (ese era
  // el bug prod-3: este módulo esperaba claves que planActivo() jamás
  // devolvió, así que kcal objetivo/macros/escala nunca llegaban al
  // documento). Consumo DEFENSIVO: si la función no existe, no es function,
  // o lanza, o no trae `.plan`, cae al plan por defecto (primer plan del
  // catálogo) con kcalObjetivo/escalaPorciones/macros en null (esa sección
  // del documento simplemente se omite).
  // -----------------------------------------------------------------------
  function obtenerPlanActivo(HERZON_DATA) {
    if (typeof G.Herzon.planActivo === 'function') {
      try {
        var resultado = G.Herzon.planActivo();
        if (resultado && resultado.plan) {
          return {
            plan: resultado.plan,
            kcalObjetivo: (resultado.kcalObjetivo === null || resultado.kcalObjetivo === undefined) ? null : resultado.kcalObjetivo,
            escalaPorciones: (resultado.escalaPorciones === null || resultado.escalaPorciones === undefined) ? null : resultado.escalaPorciones,
            macros: resultado.macros || null
          };
        }
      } catch (e) {
        // Fallback abajo: una excepción de planActivo() no debe tumbar el
        // documento (defensivo, plan.md Adendum R5 punto 4).
      }
    }
    return { plan: HERZON_DATA.planes[0], kcalObjetivo: null, escalaPorciones: null, macros: null };
  }

  function datosDocumento(HERZON_DATA, opciones) {
    opciones = opciones || {};
    var activo = obtenerPlanActivo(HERZON_DATA);
    var fechaGeneracion = opciones.fechaGeneracion || formatoFechaHoy(opciones.ahora || new Date());
    return {
      paciente: HERZON_DATA.paciente,
      plan: activo.plan,
      kcalObjetivo: activo.kcalObjetivo,
      escalaPorciones: activo.escalaPorciones,
      macros: activo.macros,
      suplementos: HERZON_DATA.suplementos,
      fechaGeneracion: fechaGeneracion,
      notaDatos: HERZON_DATA.meta.nota
    };
  }

  // -----------------------------------------------------------------------
  // Render del documento vivo (#documento-plan, oculto en pantalla y
  // visible SOLO en @media print — CSS de build/shell.html, T-021). Clases
  // usadas: TODAS ya congeladas (hz-doc-*: plan.md Adendum R5 punto 5;
  // hz-table/hz-table-wrap: plan.md 3.G). Cero clases nuevas.
  // -----------------------------------------------------------------------
  function renderDocumento(doc, contenedorEl, payload) {
    limpiar(contenedorEl);

    var titulo = crearHTML(doc, 'h2');
    titulo.classList.add('hz-doc-titulo');
    titulo.textContent = 'Documento del plan de nutrición — Rinde';
    contenedorEl.appendChild(titulo);

    var meta = crearHTML(doc, 'div');
    meta.classList.add('hz-doc-meta');
    [
      'Paciente: ' + payload.paciente.nombre,

      'Plan: ' + payload.plan.nombre,
      'Generado: ' + payload.fechaGeneracion
    ].forEach(function (texto) {
      var span = crearHTML(doc, 'span');
      span.textContent = texto;
      meta.appendChild(span);
    });
    contenedorEl.appendChild(meta);

    if (payload.kcalObjetivo != null || payload.escalaPorciones != null || payload.macros) {
      var seccionNecesidades = crearSeccion(doc, contenedorEl, 'Plan aplicado');
      var lineas = [];
      if (payload.kcalObjetivo != null) { lineas.push('Calorías objetivo aplicadas: ' + payload.kcalObjetivo + ' kcal/día.'); }
      if (payload.escalaPorciones != null) { lineas.push('Escala de porciones: ' + payload.escalaPorciones + '×.'); }
      if (payload.macros) {
        lineas.push(
          'Macronutrientes objetivo: proteína ' + payload.macros.proteina_g +
          ' g, carbohidrato ' + payload.macros.carbohidrato_g + ' g, grasa ' + payload.macros.grasa_g + ' g.'
        );
      }
      for (var li = 0; li < lineas.length; li++) {
        var p = crearHTML(doc, 'p');
        p.textContent = lineas[li];
        seccionNecesidades.appendChild(p);
      }
    }

    var seccionMenu = crearSeccion(doc, contenedorEl, 'Menú semanal completo');
    for (var d = 0; d < payload.plan.dias.length; d++) {
      var dia = payload.plan.dias[d];
      var tituloDia = crearHTML(doc, 'p');
      tituloDia.textContent = 'Día ' + dia.dia + ' — total ' + dia.totales.kcal + ' kcal';
      seccionMenu.appendChild(tituloDia);
      var filasDia = dia.comidas.map(function (comida) {
        return [
          NOMBRES_MOMENTO[comida.momento] || comida.momento,
          comida.hora,
          comida.nombre,
          comida.kcal + ' kcal'
        ];
      });
      construirTabla(doc, seccionMenu, ['Momento', 'Hora', 'Platillo', 'Calorías'], filasDia);
    }

    var seccionSuplementos = crearSeccion(doc, contenedorEl, 'Suplementos');
    var filasSuplementos = payload.suplementos.map(function (s) {
      return [s.nombre, s.dosis, s.horario, s.proposito];
    });
    construirTabla(doc, seccionSuplementos, ['Suplemento', 'Dosis', 'Horario', 'Propósito'], filasSuplementos);

    var pie = crearHTML(doc, 'p');
    pie.classList.add('hz-doc-pie');
    pie.textContent = payload.notaDatos;
    contenedorEl.appendChild(pie);

    return contenedorEl;
  }

  // -----------------------------------------------------------------------
  // Descarga .html autocontenida (Blob local). Documento SEPARADO del
  // prototipo (no se inyecta en prototype/index.html, se guarda en disco
  // del usuario): por eso trae su propio <style> mínimo — no es un módulo
  // escribiendo un <style> en el shell vivo (plan.md 3.G se refiere a ESE
  // shell). Los hexes usados aquí son literales VALIDADOS del modo claro
  // del contrato (.harness/design-contract-herzon.md sección 2:
  // --text-primary #0b0b0b, --text-secondary #52514e, --axis #c3c2b7,
  // --grid #e1e0d9), mismo precedente que el bloque @media print de T-021
  // (build/shell.html, comentario "5o bloque legítimo de tokens"): un
  // documento fuera del árbol vivo no tiene acceso a var(--token).
  // -----------------------------------------------------------------------
  function escaparHtml(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

        );

      for (var m = 0; m < dia.comidas.length; m++) {
        var comida = dia.comidas[m];
        partes.push(
          '<tr><td>' + escaparHtml(NOMBRES_MOMENTO[comida.momento] || comida.momento) +
          '</td><td>' + escaparHtml(comida.hora) +

    for (var s = 0; s < payload.suplementos.length; s++) {
      var sup = payload.suplementos[s];
      partes.push(
        '<tr><td>' + escaparHtml(sup.nombre) + '</td><td>' + escaparHtml(sup.dosis) +
        '</td><td>' + escaparHtml(sup.horario) + '</td><td>' + escaparHtml(sup.proposito) + '</td></tr>'

    partes.push('<p class="hz-doc-pie">' + escaparHtml(payload.notaDatos) + '</p>');

  // -----------------------------------------------------------------------
  // Descarga .csv de series (plan.md Adendum R5 punto 3). Columnas
  // simétricas con las que acepta el importador (ver COLUMNAS_MEDICIONES),
  // más adherenciaDieta_pct al final (informativa, no se re-importa).
  // -----------------------------------------------------------------------
  function escaparCsv(valor) {
    var texto = valor === null || valor === undefined ? '' : String(valor);
    if (/[",\n]/.test(texto)) {
      return '"' + texto.replace(/"/g, '""') + '"';
    }
    return texto;
  }

  function generarCsvDatos(HERZON_DATA) {
    var series = HERZON_DATA.series;
    var columnas = ['semana', 'fecha', 'peso_kg', 'grasa_pct', 'musculo_kg', 'cintura_cm', 'adherenciaDieta_pct'];
    var lineas = [columnas.join(',')];
    for (var i = 0; i < series.semanas.length; i++) {
      lineas.push([
        series.semanas[i],
        series.fechas[i],
        series.peso_kg[i],
        series.grasa_pct[i],
        series.musculo_kg[i],
        series.cintura_cm[i],
        series.adherenciaDieta_pct[i]
      ].map(escaparCsv).join(','));
    }
    return lineas.join('\n') + '\n';
  }

  // -----------------------------------------------------------------------
  // Plantilla CSV descargable ("formato documentado con plantilla CSV
  // descargable", criterio de aceptación T-023): mismas columnas que exige
  // el parser, con una fila de ejemplo válida (se auto-verifica en el
  // selfcheck: la plantilla debe parsear sin errores).
  // -----------------------------------------------------------------------
  var COLUMNAS_MEDICIONES = ['semana', 'fecha', 'peso_kg', 'grasa_pct', 'musculo_kg', 'cintura_cm'];

  function generarPlantillaCsv() {
    var encabezado = COLUMNAS_MEDICIONES.join(',');
    var filaEjemplo = ['13', '2026-06-01', '68.4', '27.1', '24.8', '84.2'].join(',');
    return encabezado + '\n' + filaEjemplo + '\n';
  }

  // -----------------------------------------------------------------------
  // Parser CSV de mediciones importadas — TOLERANTE: nunca lanza, siempre
  // devuelve { filasValidas, errores, encabezadoValido, totalFilas }. El
  // CSV importado es dato NO CONFIABLE (Adendum R5 punto 3): todo mensaje
  // de error se arma como texto plano en español y se pinta después solo
  // con textContent (jamás inyección cruda de marcado), sin importar qué
  // caracteres traiga.
  // -----------------------------------------------------------------------
  var LIMITES_FISIOLOGICOS = {
    peso_kg: { min: 20, max: 300 },
    grasa_pct: { min: 3, max: 70 },
    musculo_kg: { min: 5, max: 150 },
    cintura_cm: { min: 40, max: 250 }
  };

  function normalizarLineas(texto) {
    return String(texto || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  }

  // Parser CSV mínimo: separa por comas respetando campos entre comillas
  // dobles (con comillas escapadas como ""); suficiente para el formato
  // tabular simple de este import (sin celdas multilínea).
  function parsearLineaCsv(linea) {
    var campos = [];
    var actual = '';
    var dentroComillas = false;
    for (var i = 0; i < linea.length; i++) {
      var c = linea.charAt(i);
      if (dentroComillas) {
        if (c === '"') {
          if (linea.charAt(i + 1) === '"') { actual += '"'; i++; }
          else { dentroComillas = false; }
        } else {
          actual += c;
        }
      } else if (c === '"') {
        dentroComillas = true;
      } else if (c === ',') {
        campos.push(actual);
        actual = '';
      } else {
        actual += c;
      }
    }
    campos.push(actual);
    return campos.map(function (v) { return v.trim(); });
  }

  function fechaValida(texto) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(texto)) { return false; }
    var partes = texto.split('-');
    var anio = parseInt(partes[0], 10);
    var mes = parseInt(partes[1], 10);
    var dia = parseInt(partes[2], 10);
    if (mes < 1 || mes > 12) { return false; }
    var d = new Date(Date.UTC(anio, mes - 1, dia));
    return d.getUTCFullYear() === anio && (d.getUTCMonth() + 1) === mes && d.getUTCDate() === dia;
  }

  function numeroValido(texto) {
    return /^-?\d+(\.\d+)?$/.test(texto);
  }

  function parseCsvMediciones(texto, opciones) {
    opciones = opciones || {};
    var errores = [];
    var filasValidas = [];

    if (!texto || !String(texto).trim()) {
      errores.push({ fila: 0, mensaje: 'el archivo está vacío: no se encontraron datos' });
      return { filasValidas: filasValidas, errores: errores, encabezadoValido: false, totalFilas: 0 };
    }

    var lineas = normalizarLineas(texto).filter(function (l) { return l.trim() !== ''; });
    if (!lineas.length) {
      errores.push({ fila: 0, mensaje: 'el archivo está vacío: no se encontraron datos' });
      return { filasValidas: filasValidas, errores: errores, encabezadoValido: false, totalFilas: 0 };
    }

    var encabezado = parsearLineaCsv(lineas[0]).map(function (v) { return v.toLowerCase(); });
    var encabezadoValido = encabezado.length === COLUMNAS_MEDICIONES.length &&
      COLUMNAS_MEDICIONES.every(function (col, idx) { return encabezado[idx] === col; });

    if (!encabezadoValido) {
      errores.push({
        fila: 1,
        mensaje: 'encabezado inválido: se esperaban las columnas ' + COLUMNAS_MEDICIONES.join(', ') +
          ' (se encontró: "' + lineas[0] + '")'
      });
      return { filasValidas: filasValidas, errores: errores, encabezadoValido: false, totalFilas: lineas.length - 1 };
    }

    for (var f = 1; f < lineas.length; f++) {
      var numeroFila = f + 1; // número de línea humano (1 = encabezado)
      var campos = parsearLineaCsv(lineas[f]);
      if (campos.length !== COLUMNAS_MEDICIONES.length) {
        errores.push({
          fila: numeroFila,
          mensaje: 'fila ' + numeroFila + ': número de columnas inválido (se esperaban ' +
            COLUMNAS_MEDICIONES.length + ', se encontraron ' + campos.length + ')'
        });
        continue;
      }

      var crudo = {};
      for (var ci = 0; ci < COLUMNAS_MEDICIONES.length; ci++) { crudo[COLUMNAS_MEDICIONES[ci]] = campos[ci]; }

      var erroresFila = [];

      if (!/^\d+$/.test(crudo.semana) || parseInt(crudo.semana, 10) < 1) {
        erroresFila.push('"semana" inválida (número entero >= 1 esperado, se recibió "' + crudo.semana + '")');
      }

      if (!fechaValida(crudo.fecha)) {
        erroresFila.push('"fecha" inválida (formato AAAA-MM-DD esperado, se recibió "' + crudo.fecha + '")');
      } else if (opciones.fechaMinima && crudo.fecha < opciones.fechaMinima) {
        erroresFila.push('"fecha" fuera de rango (anterior a ' + opciones.fechaMinima + ')');
      } else if (opciones.fechaMaxima && crudo.fecha > opciones.fechaMaxima) {
        erroresFila.push('"fecha" fuera de rango (posterior a ' + opciones.fechaMaxima + ')');
      }

      ['peso_kg', 'grasa_pct', 'musculo_kg', 'cintura_cm'].forEach(function (campo) {
        var valorTexto = crudo[campo];
        if (!numeroValido(valorTexto)) {
          erroresFila.push('"' + campo + '" inválido (número esperado, se recibió "' + valorTexto + '")');
          return;
        }
        var valorNum = parseFloat(valorTexto);
        var limites = LIMITES_FISIOLOGICOS[campo];
        if (valorNum < limites.min || valorNum > limites.max) {
          erroresFila.push(
            '"' + campo + '" fuera de rango fisiológico plausible (' + limites.min + '-' + limites.max +
            ', se recibió ' + valorNum + ')'
          );
        }
      });

      if (erroresFila.length) {
        errores.push({ fila: numeroFila, mensaje: 'fila ' + numeroFila + ': ' + erroresFila.join('; ') });
        continue;
      }

      filasValidas.push({
        semana: parseInt(crudo.semana, 10),
        fecha: crudo.fecha,
        peso_kg: parseFloat(crudo.peso_kg),
        grasa_pct: parseFloat(crudo.grasa_pct),
        musculo_kg: parseFloat(crudo.musculo_kg),
        cintura_cm: parseFloat(crudo.cintura_cm)
      });
    }

    return { filasValidas: filasValidas, errores: errores, encabezadoValido: true, totalFilas: lineas.length - 1 };
  }

  // -----------------------------------------------------------------------
  // Merge EN MEMORIA (nunca persiste — plan.md Adendum R5 punto 3 y
  // criterio de aceptación T-023): actualiza semanas existentes, agrega
  // semanas nuevas y reordena cronológicamente. adherenciaDieta_pct no
  // viene en el CSV: en filas nuevas se arrastra el último valor conocido
  // como marcador sintético, documentado aquí, para no romper el largo
  // paralelo de arreglos que consumen las demás vistas (plan.md 3.I).
  // -----------------------------------------------------------------------
  function mergeMediciones(HERZON_DATA, filasValidas) {
    var series = HERZON_DATA.series;
    var agregadas = 0;
    var actualizadas = 0;
    var ultimaAdherencia = series.adherenciaDieta_pct.length ?
      series.adherenciaDieta_pct[series.adherenciaDieta_pct.length - 1] : 0;

    for (var i = 0; i < filasValidas.length; i++) {
      var fila = filasValidas[i];
      var idx = series.semanas.indexOf(fila.semana);
      if (idx === -1) {
        series.semanas.push(fila.semana);
        series.fechas.push(fila.fecha);
        series.peso_kg.push(fila.peso_kg);
        series.grasa_pct.push(fila.grasa_pct);
        series.musculo_kg.push(fila.musculo_kg);
        series.cintura_cm.push(fila.cintura_cm);
        series.adherenciaDieta_pct.push(ultimaAdherencia);
        agregadas++;
      } else {
        series.fechas[idx] = fila.fecha;
        series.peso_kg[idx] = fila.peso_kg;
        series.grasa_pct[idx] = fila.grasa_pct;
        series.musculo_kg[idx] = fila.musculo_kg;
        series.cintura_cm[idx] = fila.cintura_cm;
        actualizadas++;
      }
    }

    var orden = series.semanas.map(function (_valor, indice) { return indice; });
    orden.sort(function (a, b) { return series.semanas[a] - series.semanas[b]; });
    ['semanas', 'fechas', 'peso_kg', 'grasa_pct', 'musculo_kg', 'cintura_cm', 'adherenciaDieta_pct'].forEach(function (clave) {
      series[clave] = orden.map(function (indice) { return series[clave][indice]; });
    });

    return { agregadas: agregadas, actualizadas: actualizadas };
  }

  function rangoFechasDesdeInicio(HERZON_DATA) {
    var inicio = HERZON_DATA && HERZON_DATA.paciente && HERZON_DATA.paciente.inicio;
    if (!inicio) { return {}; }
    var fechaInicio = new Date(inicio + 'T00:00:00Z');
    var fechaMinima = new Date(fechaInicio.getTime() - 7 * 86400000);
    var fechaMaxima = new Date(fechaInicio.getTime() + 52 * 7 * 86400000);
    return { fechaMinima: formatoFechaHoy(fechaMinima), fechaMaxima: formatoFechaHoy(fechaMaxima) };
  }

  // -----------------------------------------------------------------------
  // Descarga genérica vía Blob local (cero red): crea el enlace temporal,
  // dispara la descarga y libera el object URL. `enlace.click()` es la vía
  // real de navegador; `enlace.despachar('click')` es el equivalente que
  // expone build/testdom.js para que el selfcheck ejercite la misma
  // función sin navegador.
  // -----------------------------------------------------------------------
  function descargarArchivo(doc, contenido, nombreArchivo, tipoMime) {
    if (typeof Blob === 'undefined' || typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') {
      return false;
    }
    var blob = new Blob([contenido], { type: tipoMime });
    var url = URL.createObjectURL(blob);
    var enlace = doc.createElement('a');
    enlace.setAttribute('href', url);
    enlace.setAttribute('download', nombreArchivo);
    if (typeof enlace.click === 'function') {
      enlace.click();
    } else if (typeof enlace.despachar === 'function') {
      enlace.despachar('click');
    }
    if (typeof URL.revokeObjectURL === 'function') {
      URL.revokeObjectURL(url);
    }
    return true;
  }

  // -----------------------------------------------------------------------
  // FileReader (legítimo por ser local — plan.md Adendum R5 punto 3):
  // aislado en una función propia para que el selfcheck pueda probar todo
  // el resto del flujo con un stub mínimo, sin depender de un navegador.
  // -----------------------------------------------------------------------
  function leerArchivoComoTexto(archivo, callback) {
    if (typeof FileReader === 'undefined') {
      callback(null, 'este navegador no soporta FileReader');
      return;
    }
    var lector = new FileReader();
    lector.onerror = function () { callback(null, 'error de lectura del archivo'); };
    lector.onload = function () { callback(String(lector.result || ''), null); };
    lector.readAsText(archivo);
  }

  function mostrarEstadoImportacion(elEstado, mensaje, esError) {
    if (!elEstado) { return; }
    elEstado.textContent = mensaje;
    if (esError) { elEstado.classList.add('hz-delta-bad'); } else { elEstado.classList.remove('hz-delta-bad'); }
  }

  // -----------------------------------------------------------------------
  // PR-07 (R9, decisión C8): textos EXACTOS por modo. Jamás prometer
  // guardado que no ocurre: solo el texto 'real' afirma persistencia, y
  // solo se usa cuando la importación de verdad enrutó por
  // Herzon.Almacen.mergeMediciones (contextoImportacion() === 'real').
  // -----------------------------------------------------------------------
  var TEXTO_IMPORT_GUARDADO_REAL = 'Guardado en este dispositivo.';
  var TEXTO_IMPORT_DEMO = 'En modo demo los datos importados no se guardan: se pierden al recargar la página.';
  var TEXTO_IMPORT_SIN_ALMACEN = 'Estos datos importados NO se guardan: se pierden al recargar la página.';
  var TEXTO_FORMATO_REAL = 'Los datos importados se guardan en este dispositivo.';
  var TEXTO_FORMATO_DEMO = TEXTO_IMPORT_DEMO;
  var TEXTO_FORMATO_SIN_ALMACEN = 'Los datos importados no se guardan: se pierden al recargar la página.';

  // contextoImportacion(): 'real' | 'demo' | 'sin-almacen'. Lectura
  // defensiva y EN VIVO (nunca cacheada): el modo puede cambiar dentro de
  // la misma carga de página vía el selector de cliente o el botón de modo
  // (Adendum R9 punto 3). 'sin-almacen' cubre tanto la ausencia de
  // Herzon.Almacen como una versión sin mergeMediciones -- la advertencia
  // honesta de no-persistencia de siempre.
  function contextoImportacion() {
    var Almacen = G.Herzon && G.Herzon.Almacen;
    if (!Almacen || typeof Almacen.modo !== 'function' || typeof Almacen.mergeMediciones !== 'function') {
      return 'sin-almacen';
    }
    return Almacen.modo() === 'real' ? 'real' : 'demo';
  }

  function construirMensajeImportacion(resultado, resumenMerge, contexto) {
    var partes = [];
    if (resumenMerge.agregadas || resumenMerge.actualizadas) {
      var base = 'Importación completa: ' + resumenMerge.agregadas + ' semana(s) nueva(s), ' +
        resumenMerge.actualizadas + ' actualizada(s).';
      partes.push(contexto === 'real' ? (base + ' ' + TEXTO_IMPORT_GUARDADO_REAL) : base);
    }
    if (resultado.errores.length) {
      var primeras = resultado.errores.slice(0, 3).map(function (e) { return e.mensaje; }).join(' | ');
      partes.push(
        resultado.errores.length + ' fila(s) con error, no se importaron: ' + primeras +
        (resultado.errores.length > 3 ? ' (y más)' : '')
      );
    }
    if (!partes.length) { partes.push('El archivo no contenía filas válidas para importar.'); }
    if (contexto === 'demo') {
      partes.push(TEXTO_IMPORT_DEMO);
    } else if (contexto === 'sin-almacen') {
      partes.push(TEXTO_IMPORT_SIN_ALMACEN);
    }
    return partes.join(' ');
  }

  function dispararEventoMediciones(resumenMerge, totalErrores) {
    if (typeof G.dispatchEvent !== 'function' || typeof CustomEvent === 'undefined') { return false; }
    var evento = new CustomEvent('herzon:mediciones-importadas', {
      detail: {
        agregadas: resumenMerge.agregadas,
        actualizadas: resumenMerge.actualizadas,
        errores: totalErrores
      }
    });
    G.dispatchEvent(evento);
    return true;
  }

  // Orquesta el pipeline completo (texto crudo -> parseo -> merge -> aviso
  // -> re-render -> evento), separado de FileReader para que sea testeable
  // de forma directa desde el selfcheck. PR-07 (R9, decisión C8): en modo
  // real enruta el merge por Herzon.Almacen.mergeMediciones (valida y
  // PERSISTE sobre clientes[activoId]); ese camino ya dispara
  // herzon:mediciones-importadas por su cuenta (Adendum R8 punto 1), así
  // que este módulo NO lo vuelve a disparar para no duplicarlo. En
  // demo/sin Almacén, el merge sigue siendo SOLO EN MEMORIA (Adendum R5
  // punto 3), con el evento propio de siempre.
  function procesarImportacionCsv(HERZON_DATA, texto, elEstado, actualizarDocumentoCb) {
    var opcionesRango = rangoFechasDesdeInicio(HERZON_DATA);
    var resultado = parseCsvMediciones(texto, opcionesRango);
    var contexto = contextoImportacion();
    var resumenMerge = { agregadas: 0, actualizadas: 0 };
    var eventoDisparado = false;
    if (resultado.filasValidas.length) {
      if (contexto === 'real') {
        var resAlmacen = G.Herzon.Almacen.mergeMediciones(resultado.filasValidas);
        resumenMerge = { agregadas: resAlmacen.agregadas || 0, actualizadas: resAlmacen.actualizadas || 0 };
        eventoDisparado = !!(resumenMerge.agregadas || resumenMerge.actualizadas);
      } else {
        resumenMerge = mergeMediciones(HERZON_DATA, resultado.filasValidas);
        eventoDisparado = dispararEventoMediciones(resumenMerge, resultado.errores.length);
      }
    }
    var mensaje = construirMensajeImportacion(resultado, resumenMerge, contexto);
    var esErrorTotal = resultado.filasValidas.length === 0 && resultado.errores.length > 0;
    mostrarEstadoImportacion(elEstado, mensaje, esErrorTotal);

    if (resultado.filasValidas.length && typeof actualizarDocumentoCb === 'function') {
      actualizarDocumentoCb();
    }
    return { resultado: resultado, resumenMerge: resumenMerge, eventoDisparado: eventoDisparado };
  }

  // -----------------------------------------------------------------------
  // Cableado real (init): TODO acceso al DOM vive aquí adentro, invocado
  // por el auto-inicio de más abajo (navegador real) o directamente por el
  // selfcheck con un `doc` de prueba (mismo patrón que `montarVistaPlan`
  // de build/vista_dieta_supl.js).
  // -----------------------------------------------------------------------
  function init(doc) {
    doc = doc || G.document;
    if (!doc || typeof doc.getElementById !== 'function') { return null; }
    var HERZON_DATA = G.HERZON_DATA;
    if (!HERZON_DATA) { return null; }

    var contenedorDocumento = doc.getElementById('documento-plan');
    var botonImprimir = doc.getElementById('hz-doc-btn-imprimir');
    var botonDescargarPlan = doc.getElementById('hz-doc-btn-descargar-plan');
    var botonDescargarDatos = doc.getElementById('hz-doc-btn-descargar-datos');
    var inputImportar = doc.getElementById('hz-doc-input-importar');
    var toolbar = doc.getElementById('doc-herramientas');

    if (!contenedorDocumento || !botonImprimir || !botonDescargarPlan || !botonDescargarDatos || !inputImportar) {
      return null;
    }

    function actualizarDocumento() {
      var payload = datosDocumento(HERZON_DATA);
      renderDocumento(doc, contenedorDocumento, payload);
      return payload;
    }

    actualizarDocumento();

    botonImprimir.addEventListener('click', function () {
      actualizarDocumento();
      if (typeof G.print === 'function') { G.print(); }
    });

    botonDescargarPlan.addEventListener('click', function () {
      var payload = actualizarDocumento();
      var html = generarHtmlDescargable(payload);
      descargarArchivo(doc, html, nombreArchivoExportable('plan', payload.fechaGeneracion, 'html'), 'text/html');
    });

    botonDescargarDatos.addEventListener('click', function () {
      var csv = generarCsvDatos(HERZON_DATA);
      descargarArchivo(doc, csv, nombreArchivoExportable('datos', formatoFechaHoy(new Date()), 'csv'), 'text/csv');
    });

    var elEstado = null;
    if (toolbar) {
      // Botón de plantilla + nota de formato + nota de estado: clases YA
      // congeladas (hz-doc-btn, hz-nota, hz-delta-bad — plan.md 3.G y
      // Adendum R5 punto 5), como hijos adicionales de la fila flex
      // #doc-herramientas. prod-5 (Adendum R6): la línea que documenta el
      // formato CSV vive en un <p class="hz-nota"> FIJO, propio, que nadie
      // vuelve a tocar; el estado de cada importación (éxito/error) vive en
      // OTRO <p class="hz-nota"> separado (#hz-doc-estado-importar), así
      // mostrarEstadoImportacion() nunca pisa la línea de formato.
      var botonPlantilla = crearHTML(doc, 'button');
      botonPlantilla.setAttribute('type', 'button');
      botonPlantilla.setAttribute('id', 'hz-doc-btn-plantilla-csv');
      botonPlantilla.classList.add('hz-doc-btn');
      botonPlantilla.textContent = 'Plantilla CSV de mediciones';
      toolbar.appendChild(botonPlantilla);
      botonPlantilla.addEventListener('click', function () {
        // Plantilla neutra (igual en ambos modos, decisión C6/PR-05): nunca
        // lleva prefijo demo ni slug de cliente.
        descargarArchivo(doc, generarPlantillaCsv(), 'rinde-plantilla-mediciones.csv', 'text/csv');
      });

      var elFormatoCsv = crearHTML(doc, 'p');
      elFormatoCsv.classList.add('hz-nota');
      elFormatoCsv.setAttribute('id', 'hz-doc-formato-csv');
      // actualizarNotaFormatoCsv(): relee contextoImportacion() EN VIVO y
      // reescribe el nodo -- nunca cachea el modo al montar. Necesario
      // porque el modo puede cambiar dentro de la misma carga de página
      // (selector de cliente o botón "Usar mis datos"/"Ver demo") sin
      // volver a llamar init(); jamás debe quedar prometiendo un guardado
      // que ya no aplica (PR-07, Adendum R9 punto 3 -- mismo patrón que
      // el listener herzon:modo-cambiado de vista_metricas.js/vista_dieta_supl.js).
      function actualizarNotaFormatoCsv() {
        var contextoFormato = contextoImportacion();
        var textoPersistenciaFormato = (contextoFormato === 'real') ? TEXTO_FORMATO_REAL :
          (contextoFormato === 'demo') ? TEXTO_FORMATO_DEMO : TEXTO_FORMATO_SIN_ALMACEN;
        elFormatoCsv.textContent =
          'Formato esperado del CSV: ' + COLUMNAS_MEDICIONES.join(', ') +
          ' (fecha en AAAA-MM-DD). ' + textoPersistenciaFormato;
      }
      actualizarNotaFormatoCsv();
      toolbar.appendChild(elFormatoCsv);
      if (typeof G.addEventListener === 'function') {
        G.addEventListener('herzon:modo-cambiado', function () { actualizarNotaFormatoCsv(); });
      }

      elEstado = crearHTML(doc, 'p');
      elEstado.classList.add('hz-nota');
      elEstado.setAttribute('id', 'hz-doc-estado-importar');
      toolbar.appendChild(elEstado);
    }

    inputImportar.addEventListener('change', function (evento) {
      var archivos = evento && evento.target && evento.target.files;
      var archivo = archivos && archivos[0];
      if (!archivo) { return; }
      leerArchivoComoTexto(archivo, function (texto, errorLectura) {
        // prod-5 (Adendum R6): resetear el input tras CADA importación
        // (éxito o error) para permitir reintentar el mismo archivo — el
        // navegador no dispara "change" dos veces seguidas para el mismo
        // archivo si el <input> conserva su valor anterior.
        if (errorLectura) {
          mostrarEstadoImportacion(elEstado, 'No se pudo leer el archivo: ' + errorLectura, true);
          inputImportar.value = '';
          return;
        }
        procesarImportacionCsv(HERZON_DATA, texto, elEstado, actualizarDocumento);
        inputImportar.value = '';
      });
    });

    return { actualizarDocumento: actualizarDocumento };
  }

  G.Herzon.Docs = {
    datosDocumento: datosDocumento,
    renderDocumento: renderDocumento,
    generarHtmlDescargable: generarHtmlDescargable,
    generarCsvDatos: generarCsvDatos,
    generarPlantillaCsv: generarPlantillaCsv,
    parseCsvMediciones: parseCsvMediciones,
    mergeMediciones: mergeMediciones,
    descargarArchivo: descargarArchivo,
    procesarImportacionCsv: procesarImportacionCsv,
    // Aditivas R9 (PR-05/PR-07): expuestas para que el selfcheck las
    // ejercite de forma directa además del flujo de UI completo.
    slugCliente: slugCliente,
    nombreArchivoExportable: nombreArchivoExportable,
    contextoImportacion: contextoImportacion,
    init: init
  };

  // Auto-inicio en navegador real (Adendum R5: los botones y #documento-
  // plan ya están en el marcado estático de build/shell.html, no hace
  // falta que ningún otro módulo llame Herzon.Docs.init() explícitamente).
  // `G.document` es SIEMPRE undefined bajo el selfcheck de node (que solo
  // define `globalThis.window = globalThis`), así que este bloque nunca se
  // ejecuta ahí. En el navegador, el script de este módulo corre a mitad
  // del <body> (antes de que el propio #documento-plan, último nodo del
  // documento, exista): por eso siempre se difiere a `DOMContentLoaded`
  // mientras el documento sigue en `readyState === 'loading'`, sin
  // importar en qué punto del ensamble quede inyectado este módulo.
  if (G.document && typeof G.document.getElementById === 'function') {
    if (G.document.readyState === 'loading' && typeof G.document.addEventListener === 'function') {
      G.document.addEventListener('DOMContentLoaded', function () { init(); });
    } else {
      init();
    }
  }
})();

</script>
<script id="hz-vistas-a">
// build/vista_dieta_supl.js
// U-VISTAS-A (T-004): vistas "Plan de dieta" y "Suplementos".
// Registra window.Herzon.Views.plan y window.Herzon.Views.suplementos, y llama
// Herzon.registerView('plan', ...) / Herzon.registerView('suplementos', ...)
// (API publicada por T-002, contrato .harness/plan.md sección 3.C).
//
// Consume window.HERZON_DATA (T-001, forma congelada en plan.md 3.I) y
// window.Herzon.Charts.* (T-003, API congelada en plan.md 3.B). No conoce ni
// modifica build/data.js ni build/charts.js.
//
// Método de gráficas: skill dataviz (marks-and-anatomy.md, interaction.md,
// anti-patterns.md) y .harness/design-contract-herzon.md secciones 2, 3 y 4.
// Reglas duras aplicadas aquí: regla 7 (leyenda >=2 series, etiqueta directa
// selectiva), regla 9 (toggle "Ver tabla" en toda .hz-chart), regla 11
// (exactamente UN .hz-hero por vista), regla 12 (n/a: esta vista no lleva el
// filtro de rango de fechas, exclusivo de Seguimiento).
//
// Preámbulo obligatorio (plan.md 3.A): script clásico, IIFE, sin
// import/export. Prohibido tocar `document` en el nivel superior del módulo:
// todo acceso al DOM ocurre dentro de las funciones `montarVistaPlan` y
// `montarVistaSuplementos`, invocadas por el shell (o por el selfcheck) con
// el contenedor ya presente.
(function () {
  var G = (typeof window !== 'undefined') ? window : globalThis;
  G.Herzon = G.Herzon || {};
  G.Herzon.Views = G.Herzon.Views || {};

  // -----------------------------------------------------------------------
  // Utilidades locales de DOM (sin document en el nivel superior: reciben
  // siempre `doc` = contenedorEl.ownerDocument, igual que build/charts.js).
  // -----------------------------------------------------------------------
  function crearHTML(doc, tag) {
    return doc.createElement(tag);
  }

  function limpiar(el) {
    el.textContent = '';
  }

  function crearCard(doc, contenedorEl, tituloTexto) {
    var card = crearHTML(doc, 'div');
    card.classList.add('hz-card');
    if (tituloTexto) {
      var titulo = crearHTML(doc, 'div');
      titulo.classList.add('hz-card-title');
      titulo.textContent = tituloTexto;
      card.appendChild(titulo);
    }
    contenedorEl.appendChild(card);
    return card;
  }

  // Número héroe manual (Herzon.Charts no publica una primitiva "hero": las
  // clases hz-hero / hz-hero-num / hz-hero-label son de chrome, congeladas en
  // plan.md 3.G y estilizadas por T-002). Regla 11: exactamente UN .hz-hero.
  function crearHero(doc, contenedorEl, etiquetaTexto) {
    var raiz = crearHTML(doc, 'div');
    raiz.classList.add('hz-hero');
    var num = crearHTML(doc, 'div');
    num.classList.add('hz-hero-num');
    var label = crearHTML(doc, 'div');
    label.classList.add('hz-hero-label');
    label.textContent = etiquetaTexto;
    raiz.appendChild(num);
    raiz.appendChild(label);
    contenedorEl.appendChild(raiz);
    return { raiz: raiz, num: num };
  }

  function crearCampoSelect(doc, formEl, idCampo, etiquetaTexto, opciones) {
    var campo = crearHTML(doc, 'div');
    campo.classList.add('hz-form-campo');

    var etiqueta = crearHTML(doc, 'label');
    etiqueta.setAttribute('for', idCampo);
    etiqueta.textContent = etiquetaTexto;

    var select = crearHTML(doc, 'select');
    select.setAttribute('id', idCampo);
    for (var i = 0; i < opciones.length; i++) {
      var opcion = crearHTML(doc, 'option');
      opcion.setAttribute('value', opciones[i].valor);
      opcion.textContent = opciones[i].etiqueta;
      select.appendChild(opcion);
    }

    campo.appendChild(etiqueta);
    campo.appendChild(select);
    formEl.appendChild(campo);
    return { campo: campo, select: select };
  }

  function construirTablaSimple(doc, contenedorEl, columnas, filas) {
    var wrap = crearHTML(doc, 'div');
    wrap.classList.add('hz-table-wrap');

    var tabla = crearHTML(doc, 'table');
    tabla.classList.add('hz-table');

    var thead = crearHTML(doc, 'thead');
    var trEncabezado = crearHTML(doc, 'tr');
    for (var c = 0; c < columnas.length; c++) {
      var th = crearHTML(doc, 'th');
      th.setAttribute('scope', 'col');
      th.textContent = columnas[c];
      trEncabezado.appendChild(th);
    }
    thead.appendChild(trEncabezado);
    tabla.appendChild(thead);

    var tbody = crearHTML(doc, 'tbody');
    for (var f = 0; f < filas.length; f++) {
      var tr = crearHTML(doc, 'tr');
      var fila = filas[f];
      for (var i = 0; i < fila.length; i++) {
        var esPrimera = i === 0;
        var celda = crearHTML(doc, esPrimera ? 'th' : 'td');
        if (esPrimera) celda.setAttribute('scope', 'row');
        else celda.style.fontVariantNumeric = 'tabular-nums';
        var valor = fila[i];
        celda.textContent = (valor === null || valor === undefined) ? '' : String(valor);
        tr.appendChild(celda);
      }
      tbody.appendChild(tr);
    }
    tabla.appendChild(tbody);
    wrap.appendChild(tabla);
    contenedorEl.appendChild(wrap);
    return wrap;
  }

  function formatearEntero(v) {
    if (typeof v !== 'number' || isNaN(v)) return '';
    var redondeado = Math.round(v);
    var negativo = redondeado < 0;
    var texto = String(Math.abs(redondeado)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (negativo ? '-' : '') + texto;
  }

  // -----------------------------------------------------------------------
  // Menú del día (Adendum R4, T-017): reemplaza la tabla apretada de
  // "Detalle del día" por una fila-card por comida (.hz-menu-item), con el
  // platillo COMPLETO (esta zona NO hereda el white-space:nowrap de
  // .hz-table: el texto envuelve) y una mini barra apilada de macros de esa
  // comida en CSS con tokens (colores por token, gap de 2px). Clases nuevas
  // SOLO con prefijo hz-menu- (plan.md Adendum R4 punto 2; estilos en
  // build/shell.html por regla 3.G).
  // -----------------------------------------------------------------------
  function construirFilaMenuComida(doc, listaEl, comida) {
    var item = crearHTML(doc, 'div');
    item.classList.add('hz-menu-item');

    var hora = crearHTML(doc, 'div');
    hora.classList.add('hz-menu-hora');
    hora.textContent = comida.hora;
    item.appendChild(hora);

    var nombreWrap = crearHTML(doc, 'div');
    nombreWrap.classList.add('hz-menu-nombre');
    var momento = crearHTML(doc, 'span');
    momento.classList.add('hz-menu-momento');
    momento.textContent = (NOMBRES_MOMENTO[comida.momento] || comida.momento) + ': ';
    var platillo = crearHTML(doc, 'span');
    platillo.classList.add('hz-menu-platillo');
    platillo.textContent = comida.nombre;
    nombreWrap.appendChild(momento);
    nombreWrap.appendChild(platillo);
    item.appendChild(nombreWrap);

    var kcal = crearHTML(doc, 'div');
    kcal.classList.add('hz-menu-kcal');
    kcal.textContent = formatearEntero(comida.kcal) + ' kcal';
    item.appendChild(kcal);

    // Mini barra apilada de macros de ESTA comida: ancho proporcional a las
    // kcal que aporta cada macro (proteína y carbohidrato 4 kcal/g, grasa
    // 9 kcal/g), asignación de color fija del contrato (proteína=series-1,
    // carbohidrato=series-2, grasa=series-3), gap de 2px vía CSS.
    var macros = crearHTML(doc, 'div');
    macros.classList.add('hz-menu-macros');
    var kcalProteina = comida.proteina_g * 4;
    var kcalCarbohidrato = comida.carbohidrato_g * 4;
    var kcalGrasa = comida.grasa_g * 9;
    var kcalMacrosTotal = kcalProteina + kcalCarbohidrato + kcalGrasa;
    if (kcalMacrosTotal <= 0) { kcalMacrosTotal = 1; }
    [
      { color: 'var(--series-1)', kcal: kcalProteina },
      { color: 'var(--series-2)', kcal: kcalCarbohidrato },
      { color: 'var(--series-3)', kcal: kcalGrasa }
    ].forEach(function (seg) {
      var segEl = crearHTML(doc, 'div');
      segEl.classList.add('hz-menu-macro-seg');
      segEl.style.width = (seg.kcal / kcalMacrosTotal * 100) + '%';
      segEl.style.backgroundColor = seg.color;
      macros.appendChild(segEl);
    });
    item.appendChild(macros);

    listaEl.appendChild(item);
    return item;
  }

  // -----------------------------------------------------------------------
  // Vista "Plan de dieta"
  // -----------------------------------------------------------------------
  var NOMBRES_MOMENTO = {
    desayuno: 'Desayuno',
    colacion_manana: 'Colación matutina',
    comida: 'Comida',
    colacion_tarde: 'Colación vespertina',
    cena: 'Cena'
  };

  var ETIQUETAS_OBJETIVO = {
    recomposicion_corporal: 'Recomposición corporal',
    control_glucemico: 'Control glucémico'
  };

  var ETIQUETAS_RESTRICCION = {
    sin_frutos_secos_de_arbol: 'Alergia a frutos secos de árbol (nuez)',
    bajo_en_carbohidratos: 'Preferencia baja en carbohidratos'
  };

  // -----------------------------------------------------------------------
  // R8 (Adendum R8 punto 4) + R9: estados vacíos en modo real. Textos
  // exactos pinneados por este mismo selfcheck (build/selfcheck_vistas_a.js);

  // -----------------------------------------------------------------------
  var TEXTO_VACIO_PLAN = 'Aún no tienes un plan aplicado. Usa el recomendador de aquí abajo para elegir y aplicar una plantilla a tu perfil.';
  var TEXTO_VACIO_SUPLEMENTOS = 'Sin datos aún — no hay suplementos registrados en tu régimen.';

  // -----------------------------------------------------------------------
  // C3 (síntesis R9, hallazgo LY-05): rótulos cortos de despliegue para la
  // gráfica de barras de adherencia por suplemento -- el nombre completo con

  // de build/data.js, con un fallback data-driven (recorta el calificador
  // entre paréntesis y se queda con las 2 primeras palabras) para cualquier
  // régimen futuro fuera de ese catálogo.
  // -----------------------------------------------------------------------
  var ETIQUETAS_CORTAS_SUPLEMENTO = {
    'Omega-3 (aceite de pescado)': 'Omega-3',
    'Vitamina D3': 'Vitamina D3',
    'Magnesio quelado': 'Magnesio',
    'Probiótico multiflora': 'Probiótico'
  };

  function etiquetaCortaSuplemento(nombreCompleto) {
    if (Object.prototype.hasOwnProperty.call(ETIQUETAS_CORTAS_SUPLEMENTO, nombreCompleto)) {
      return ETIQUETAS_CORTAS_SUPLEMENTO[nombreCompleto];
    }
    var sinCalificador = String(nombreCompleto || '').replace(/\s*\([^)]*\)\s*$/, '');
    var palabras = sinCalificador.split(' ').filter(function (p) { return p.length > 0; });
    return palabras.slice(0, 2).join(' ') || sinCalificador;
  }

  // Deriva las opciones del formulario directamente de HERZON_DATA.planes
  // (plan.indicadoPara), sin lista clínica hardcodeada: P2 del coordinador
  // prohíbe un motor clínico real, y la selección "sale de plan.indicadoPara".
  function derivarOpciones(planes, campo) {
    var vistos = {};
    var orden = [];
    for (var i = 0; i < planes.length; i++) {
      var valores = (planes[i].indicadoPara && planes[i].indicadoPara[campo]) || [];
      for (var j = 0; j < valores.length; j++) {
        if (!vistos[valores[j]]) { vistos[valores[j]] = true; orden.push(valores[j]); }
      }
    }
    return orden;
  }

  // Sin motor clínico real (P2): puntaje simple a partir de plan.indicadoPara.
  // OPEN-QUESTION (registrada también en el handoff de T-004): con las 2
  // variantes actuales, ambos planes listan AMBOS objetivos en
  // indicadoPara.objetivo, así que el campo "objetivo" no alcanza por sí solo
  // a discriminar entre planes; el campo "restricción/alergia" sí lo hace,
  // porque cada plan tiene una restricción primaria distinta
  // (indicadoPara.restriccion[0]). El formulario deja ambos campos activos
  // (la fórmula usa los dos) para no cerrar la puerta si T-001 agrega un
  // tercer plan más adelante con objetivos disjuntos.
  function elegirPlan(planes, objetivoSel, restriccionSel) {
    var mejor = planes[0];
    var mejorPuntaje = -1;
    for (var i = 0; i < planes.length; i++) {
      var p = planes[i];
      var ind = p.indicadoPara || {};
      var puntaje = 0;
      if (ind.objetivo && ind.objetivo.indexOf(objetivoSel) !== -1) puntaje += 1;
      if (ind.restriccion && ind.restriccion.indexOf(restriccionSel) !== -1) puntaje += 1;
      if (ind.restriccion && ind.restriccion[0] === restriccionSel) puntaje += 1;
      if (puntaje > mejorPuntaje) { mejorPuntaje = puntaje; mejor = p; }
    }
    return mejor;
  }

  // -----------------------------------------------------------------------
  // Recomendador de plan (Adendum R5, T-022): calculadora de necesidades
  // (TMB/GET/kcal objetivo/macros vía Herzon.Motor, T-020) + ranking de
  // plantillas con razones + Herzon.planActivo() (Adendum R5 punto 4).
  // Estado a nivel de módulo (no ligado al montaje de la vista): permite que
  // Herzon.planActivo() responda incluso antes de que la pestaña "Plan de
  // dieta" se haya activado alguna vez (inicialización perezosa, ver
  // obtenerRecoEstado). Ninguna función de esta sección toca `document` en
  // el nivel superior del módulo (plan.md 3.A): todo el cálculo corre bajo
  // demanda dentro de funciones.
  // -----------------------------------------------------------------------
  function redondear(n) {
    return Math.round(n);
  }

  function formatoEscala(n) {
    return n.toFixed(2) + 'x';
  }

  // Traduce el texto legible de HERZON_DATA.paciente.objetivo (p. ej.
  // "Recomposición corporal") al vocabulario que espera Herzon.Motor
  // ('perdida' | 'recomposicion' | 'mantener' | 'ganancia'). No hay motor
  // clínico real (P2): esto es una correspondencia de texto, no un cálculo.
  function objetivoMotorDesdeTexto(texto) {
    var normalizado = String(texto || '').toLowerCase();
    if (normalizado.indexOf('recomposici') !== -1) return 'recomposicion';
    if (normalizado.indexOf('perdida') !== -1 || normalizado.indexOf('pérdida') !== -1) return 'perdida';
    if (normalizado.indexOf('ganancia') !== -1) return 'ganancia';
    return 'mantener';
  }

  var ETIQUETAS_SEXO_MOTOR = { femenino: 'Femenino', masculino: 'Masculino' };

  var ETIQUETAS_FACTOR_ACTIVIDAD = {
    sedentario: 'Sedentario (poco o nada de ejercicio)',
    ligero: 'Actividad ligera (1 a 3 días por semana)',
    moderado: 'Actividad moderada (3 a 5 días por semana)',
    intenso: 'Actividad intensa (6 a 7 días por semana)'
  };

  var ETIQUETAS_OBJETIVO_MOTOR = {
    perdida: 'Pérdida de grasa',
    recomposicion: 'Recomposición corporal',
    mantener: 'Mantenimiento',
    ganancia: 'Ganancia muscular'
  };

  function planPorId(HERZON_DATA, id) {
    var encontrados = HERZON_DATA.planes.filter(function (p) { return p.id === id; });
    return encontrados.length ? encontrados[0] : null;
  }

  // El plan activo del recomendador: el que el usuario eligió a mano en el
  // ranking (data-plan-id de un botón "Usar este plan"), o si aún no eligió
  // ninguno, la plantilla mejor rankeada (primera de est.ranking).
  function planSeleccionadoActivo(est, HERZON_DATA) {
    if (est.planIdSeleccionado) {
      var encontrado = planPorId(HERZON_DATA, est.planIdSeleccionado);
      if (encontrado) return encontrado;
    }
    // R6 (prod-2): en modo automático (sin elección explícita en el
    // recomendador) la fuente de verdad es la MISMA que usa la card
    // "Personaliza tu plan" (objetivo/restricción) -- así el resto de la
    // vista y Herzon.planActivo() nunca contradicen qué plantilla está
    // activa. Antes caía al mejor score del ranking, que podía ser una
    // plantilla distinta a la que el formulario ya mostraba.
    if (est.filtroObjetivo || est.filtroRestriccion) {
      var porFiltro = elegirPlan(HERZON_DATA.planes, est.filtroObjetivo, est.filtroRestriccion);
      if (porFiltro) return porFiltro;
    }
    if (est.ranking && est.ranking.length) return est.ranking[0].plan;
    return HERZON_DATA.planes[0];
  }

  // Perfil precargado con el perfil del paciente sintético (plan.md
  // Adendum R5 punto 4: "formulario precargado con el perfil"). El peso
  // usado es pesoInicial_kg (no pesoActual_kg): es el que reproduce
  // EXACTAMENTE el ancla de verificación del Adendum R5 (TMB 1432, GET
  // 1969 con factor 'ligero'), que además es el mismo factor con el que
  // build/data.js ya precalculó paciente.gastoEnergetico.
  function crearRecoEstadoInicial() {
    var HERZON_DATA = G.HERZON_DATA;
    var paciente = HERZON_DATA.paciente;
    // R8 (Adendum R8 punto 4): en modo real, paciente.actividad es la clave
    // ADITIVA que expone Herzon.Almacen (construirPacienteDesdePerfil) con
    // el nivel de actividad REAL capturado en el alta/edición de perfil --
    // se precarga aquí para no adivinar. En demo esa clave no existe (el
    // paciente sintético de build/data.js no la trae) y el default sigue
    // siendo 'ligero' (reproduce el ancla de verificación TMB 1432/GET 1969
    // del Adendum R5, que no cambia).
    var factorPrecargado = (paciente.actividad && HERZON_DATA.factoresActividad &&
      Object.prototype.hasOwnProperty.call(HERZON_DATA.factoresActividad, paciente.actividad))
      ? paciente.actividad
      : 'ligero';
    // MC-07 (Adendum R9 punto 3): HERZON_DATA.planAplicado es la clave
    // ADITIVA que expone Herzon.Almacen al montar un cliente real, con el
    // slot `plan` persistido de ESE cliente (null si aún no aplicó ninguna
    // plantilla). Precargar la selección aquí evita que Herzon.planActivo()
    // resuelva por accidente el plan de OTRO cliente/modo mientras el
    // usuario no ha vuelto a elegir nada en este panel. En demo esa clave no
    // existe (undefined) y planIdPrecargado cae en null -- comportamiento
    // actual, sin cambios.
    var planAplicadoPersistido = HERZON_DATA.planAplicado;
    var planIdPrecargado = (planAplicadoPersistido && planAplicadoPersistido.plantillaId &&
      planPorId(HERZON_DATA, planAplicadoPersistido.plantillaId))
      ? planAplicadoPersistido.plantillaId
      : null;
    return {
      perfil: {
        sexo: paciente.sexo,
        edad: paciente.edad,
        tallaCm: paciente.talla_cm,
        pesoKg: paciente.pesoInicial_kg,
        factorClave: factorPrecargado,
        objetivo: objetivoMotorDesdeTexto(paciente.objetivo)
      },
      necesidades: null,      // { tmb, get, kcal, proteina_g, carbohidrato_g, grasa_g }
      ranking: null,          // [{ plan, score, razones[] }] descendente (Herzon.Motor.recomendar)
      planIdSeleccionado: planIdPrecargado, // MC-07: precargado desde HERZON_DATA.planAplicado, o null = automático (el mejor rankeado)
      kcalManual: null,       // override manual del kcal objetivo mostrado, o null = usa el de la plantilla
      escalaPorciones: 1,     // 0.8 - 1.2
      // R6 (prod-2, claves ADITIVAS, plan.md Adendum R6 punto 3): la card
      // "Personaliza tu plan" (objetivo/restricción) y Herzon.planActivo()
      // deben coincidir SIEMPRE en modo automático (planIdSeleccionado nulo);
      // antes, cada uno resolvía la plantilla por su cuenta (el formulario
      // vía elegirPlan, planActivo() vía el mejor score del ranking) y podían
      // apuntar a plantillas distintas, mostrando kcal contradictorias entre
      // la vista principal y el panel del recomendador. Se comparten aquí.
      filtroObjetivo: derivarOpciones(HERZON_DATA.planes, 'objetivo')[0] || null,
      filtroRestriccion: derivarOpciones(HERZON_DATA.planes, 'restriccion')[0] || null
    };
  }

  function recalcularNecesidadesYRanking(est) {
    var Motor = G.Herzon.Motor;
    var HERZON_DATA = G.HERZON_DATA;
    var factor = HERZON_DATA.factoresActividad[est.perfil.factorClave] || HERZON_DATA.factoresActividad.ligero;
    var tmb = Motor.tmb({ sexo: est.perfil.sexo, pesoKg: est.perfil.pesoKg, tallaCm: est.perfil.tallaCm, edad: est.perfil.edad });
    var get = Motor.get(tmb, factor);
    var kcalCalculado = Motor.kcalObjetivo(get, est.perfil.objetivo);
    var macrosCalculados = Motor.macrosObjetivo({ kcal: kcalCalculado, pesoKg: est.perfil.pesoKg, objetivo: est.perfil.objetivo });
    est.necesidades = {
      tmb: tmb,
      get: get,
      kcal: kcalCalculado,
      proteina_g: macrosCalculados.proteina_g,
      carbohidrato_g: macrosCalculados.carbohidrato_g,
      grasa_g: macrosCalculados.grasa_g
    };
    est.ranking = Motor.recomendar(
      {
        kcal: est.necesidades.kcal,
        proteina_g: est.necesidades.proteina_g,
        carbohidrato_g: est.necesidades.carbohidrato_g,
        grasa_g: est.necesidades.grasa_g
      },
      HERZON_DATA.planes
    );
  }

  // Estado a nivel de módulo, inicialización perezosa (no requiere DOM ni
  // que la vista se haya montado): así Herzon.planActivo() puede llamarse
  // en cualquier momento tras cargar este script.
  var recoEstadoSingleton = null;
  function obtenerRecoEstado() {
    if (!recoEstadoSingleton) {
      recoEstadoSingleton = crearRecoEstadoInicial();
      recalcularNecesidadesYRanking(recoEstadoSingleton);
    }
    return recoEstadoSingleton;
  }

  // -----------------------------------------------------------------------
  // R9 (Adendum R9 punto 3, MC-02/MC-07): referencias de re-montaje. Cada
  // vista se monta UNA sola vez (Herzon.registerView, plan.md 3.C); toda
  // reactividad a un cambio de cliente/modo posterior pasa por
  // herzon:modo-cambiado (ver manejarRemontajeDatos, más abajo), que
  // necesita poder volver a dibujar la vista YA montada.
  // -----------------------------------------------------------------------
  var refsMontajePlan = null;
  var refsMontajeSuplementos = null;

  // R6 (fini-4): los botones del recomendador dejan de estilizarse con
  // element.style inline y pasan a la clase congelada .hz-table-toggle
  // (plan.md Adendum R6 punto 6: "botones del recomendador via clases
  // existentes tipo .hz-table-toggle"), estilizada por build/shell.html
  // (T-026), que ya hereda :hover/:focus-visible y el estado disabled
  // (opacidad + cursor) sin que este módulo declare un solo estilo propio.

  // R6 (jera-6): distingue el par "proteína suficiente"/"insuficiente" del
  // resto de las razones del ranking con el patrón punto de estatus
  // (.hz-status-dot + .hz-status-label, clases congeladas en plan.md 3.G,
  // ya usadas por build/vista_metricas.js). "insuficiente" contiene la
  // subcadena "suficiente" en medio de otra palabra, así que se prueba
  // primero para no confundirla con "suficiente" a secas.
  function estadoDesdeRazon(texto) {
    var normalizado = String(texto || '').toLowerCase();
    if (normalizado.indexOf('insuficiente') !== -1) return 'warning';
    if (normalizado.indexOf('suficiente') !== -1) return 'good';
    return null;
  }

  function capitalizarPrimeraLetra(texto) {
    if (!texto) return texto;
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  // Pinta las razones del ranking como UNA línea de texto normal (jera-6):
  // 0.85rem, sentence case (solo la primera razón capitalizada; el resto
  // conserva el texto en minúsculas que ya produce Herzon.Motor), color
  // var(--text-secondary) y razones separadas por ' · ' -- ya NO chips
  // .hz-badge (ese queda reservado a rótulos cortos reales, plan.md
  // Adendum R6 punto 6). R9 (LY-06b): .hz-reco-razones ya NO se fuerza a
  // "block" -- se deja el flex-wrap nativo de build/shell.html para que el
  // botón "Usar este plan" pueda vivir como último hijo de este mismo
  // contenedor, empujado a la derecha con margin-left:auto (ver
  // renderRanking, más abajo).
  function construirLineaRazones(doc, contenedorEl, razones) {
    limpiar(contenedorEl);
    contenedorEl.style.fontSize = '0.85rem';
    contenedorEl.style.color = 'var(--text-secondary)';
    for (var i = 0; i < razones.length; i++) {
      if (i > 0) contenedorEl.appendChild(doc.createTextNode(' · '));
      var textoRazon = i === 0 ? capitalizarPrimeraLetra(razones[i]) : razones[i];
      var estado = estadoDesdeRazon(razones[i]);
      if (estado) {
        var envoltura = crearHTML(doc, 'span');
        envoltura.style.display = 'inline-flex';
        envoltura.style.alignItems = 'center';
        var punto = crearHTML(doc, 'span');
        punto.classList.add('hz-status-dot');
        punto.setAttribute('data-status', estado);
        var etiquetaEstado = crearHTML(doc, 'span');
        etiquetaEstado.classList.add('hz-status-label');
        etiquetaEstado.textContent = textoRazon;
        envoltura.appendChild(punto);
        envoltura.appendChild(etiquetaEstado);
        contenedorEl.appendChild(envoltura);
      } else {
        contenedorEl.appendChild(doc.createTextNode(textoRazon));
      }
    }
  }

  function crearStat(doc, contenedorEl, etiquetaTexto) {
    var stat = crearHTML(doc, 'div');
    stat.classList.add('hz-stat');
    var label = crearHTML(doc, 'div');
    label.classList.add('hz-stat-label');
    label.textContent = etiquetaTexto;
    var num = crearHTML(doc, 'div');
    num.classList.add('hz-stat-num');
    stat.appendChild(label);
    stat.appendChild(num);
    contenedorEl.appendChild(stat);
    return { stat: stat, num: num };
  }

  function crearCampoInput(doc, contenedorEl, idCampo, etiquetaTexto, tipo, valorInicial, atributosExtra) {
    var campo = crearHTML(doc, 'div');
    campo.classList.add('hz-form-campo');

    var etiqueta = crearHTML(doc, 'label');
    etiqueta.setAttribute('for', idCampo);
    etiqueta.textContent = etiquetaTexto;

    var input = crearHTML(doc, 'input');
    input.setAttribute('id', idCampo);
    input.setAttribute('type', tipo);
    if (atributosExtra) {
      for (var clave in atributosExtra) {
        if (Object.prototype.hasOwnProperty.call(atributosExtra, clave)) {
          input.setAttribute(clave, String(atributosExtra[clave]));
        }
      }
    }
    input.value = valorInicial;

    campo.appendChild(etiqueta);
    campo.appendChild(input);
    contenedorEl.appendChild(campo);
    return { campo: campo, input: input };
  }

  // Busca un descendiente (o el propio nodo) por atributo id, sin depender
  // de querySelector/getElementById: build/testdom.js no los implementa
  // (solo expone consultarTodo/consultarUno por tag o por clase), así que
  // ningún módulo de este epic usa esos métodos (mismo patrón que el resto
  // del archivo, ver buscarPorId en build/selfcheck_vistas_a.js).
  function buscarHijoPorId(raizEl, id) {
    if (raizEl.getAttribute && raizEl.getAttribute('id') === id) return raizEl;
    var hijos = raizEl.children || [];
    for (var i = 0; i < hijos.length; i++) {
      var encontrado = buscarHijoPorId(hijos[i], id);
      if (encontrado) return encontrado;
    }
    return null;
  }

  // Construye y cablea el panel del recomendador dentro del contenedor
  // #reco-plan que publica build/shell.html (T-021, clases hz-reco-*
  // congeladas en plan.md Adendum R5 punto 5). Flujo #reco-plan: formulario
  // precargado -> necesidades (TMB/GET/kcal objetivo/macros en g) -> ranking
  // de plantillas con la recomendada destacada y razones -> modificable
  // (otra plantilla, kcal manual, escala de porciones 0.8x-1.2x).
  function montarPanelRecomendador(doc, contenedorReco, HERZON_DATA, refrescarVistaPrincipal) {
    limpiar(contenedorReco);
    var est = obtenerRecoEstado();

    var titulo = crearHTML(doc, 'div');
    titulo.classList.add('hz-card-title');
    titulo.textContent = 'Calculadora y recomendador de plan';
    contenedorReco.appendChild(titulo);

    var disclaimer = crearHTML(doc, 'p');
    disclaimer.classList.add('hz-nota');
    disclaimer.textContent = 'Cálculo estándar (fórmula de Mifflin-St Jeor) a partir de los datos que ingreses; ' +
      'no sustituye una valoración nutriológica o médica profesional.';
    contenedorReco.appendChild(disclaimer);

    // --- 1. Formulario precargado con el perfil ---
    var form = crearHTML(doc, 'form');
    form.classList.add('hz-reco-form');
    contenedorReco.appendChild(form);

    var opcionesSexo = Object.keys(ETIQUETAS_SEXO_MOTOR).map(function (v) {
      return { valor: v, etiqueta: ETIQUETAS_SEXO_MOTOR[v] };
    });
    var opcionesFactor = Object.keys(HERZON_DATA.factoresActividad).map(function (v) {
      return { valor: v, etiqueta: ETIQUETAS_FACTOR_ACTIVIDAD[v] || v };
    });
    var opcionesObjetivoMotor = Object.keys(ETIQUETAS_OBJETIVO_MOTOR).map(function (v) {
      return { valor: v, etiqueta: ETIQUETAS_OBJETIVO_MOTOR[v] };
    });

    var campoSexo = crearCampoSelect(doc, form, 'hz-reco-sexo', 'Sexo', opcionesSexo);
    var campoEdad = crearCampoInput(doc, form, 'hz-reco-edad', 'Edad (años)', 'number', String(est.perfil.edad), { min: 10, max: 100, step: 1 });
    var campoTalla = crearCampoInput(doc, form, 'hz-reco-talla', 'Talla (cm)', 'number', String(est.perfil.tallaCm), { min: 100, max: 220, step: 1 });
    var campoPeso = crearCampoInput(doc, form, 'hz-reco-peso', 'Peso (kg)', 'number', String(est.perfil.pesoKg), { min: 30, max: 250, step: 0.1 });
    var campoFactor = crearCampoSelect(doc, form, 'hz-reco-factor', 'Nivel de actividad', opcionesFactor);
    var campoObjetivoMotor = crearCampoSelect(doc, form, 'hz-reco-objetivo', 'Objetivo', opcionesObjetivoMotor);

    campoSexo.select.value = est.perfil.sexo;
    campoFactor.select.value = est.perfil.factorClave;
    campoObjetivoMotor.select.value = est.perfil.objetivo;

    function leerPerfilDeFormulario() {
      est.perfil.sexo = campoSexo.select.value;
      var edadLeida = parseInt(campoEdad.input.value, 10);
      if (!isNaN(edadLeida) && edadLeida > 0) est.perfil.edad = edadLeida;
      var tallaLeida = parseFloat(campoTalla.input.value);
      if (!isNaN(tallaLeida) && tallaLeida > 0) est.perfil.tallaCm = tallaLeida;
      var pesoLeido = parseFloat(campoPeso.input.value);
      if (!isNaN(pesoLeido) && pesoLeido > 0) est.perfil.pesoKg = pesoLeido;
      est.perfil.factorClave = campoFactor.select.value;
      est.perfil.objetivo = campoObjetivoMotor.select.value;
    }

      CAMPOS_NUMERICOS_VALIDABLES.forEach(function (campo) {

        if (texto === '' || texto === null || texto === undefined || isNaN(numero) || numero <= 0) {

      });

    function renderNecesidades() {

    // --- 3. Ranking de plantillas con la recomendada destacada y razones ---
    var listaRanking = crearHTML(doc, 'div');

    function renderRanking() {

      // "Aplicado" (data-seleccionado, botón deshabilitado) SOLO refleja una

      for (var i = 0; i < est.ranking.length; i++) {

        var botonUsar = crearHTML(doc, 'button');

          // Al aplicar una nueva plantilla el usuario arranca limpio: kcal

          est.kcalManual = null;

          campoKcalManual.input.value = '';
          campoEscala.input.value = '1';
          actualizarEtiquetaEscala(1);
          // MC-07 (Adendum R9 punto 3): en modo real, aplicar una plantilla
          // la persiste en el cliente activo (Herzon.Almacen.guardarPlan) y
          // expone HERZON_DATA.planAplicado de inmediato -- así el
